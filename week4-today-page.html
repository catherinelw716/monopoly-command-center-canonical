<style id="week4-today-native-style">
body.w4today-standalone{margin:0;background:#07111f;color:#e5edf6;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.w4today{max-width:1180px;margin:0 auto;padding:22px 18px 40px;color:inherit}.w4t-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:14px}.w4t-kicker{font-size:10px;text-transform:uppercase;letter-spacing:.08em;opacity:.6}.w4t-title{font-size:28px;font-weight:850;line-height:1.1;margin:4px 0 5px}.w4t-sub{font-size:12px;line-height:1.5;opacity:.72;max-width:820px}.w4t-stamp{font-size:10px;opacity:.65;white-space:nowrap}.w4t-back{color:#9fc9ff;text-decoration:none;font-size:11px;display:inline-block;margin-bottom:10px}.w4t-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0}.w4t-card,.w4t-table{background:#0d1a2a;border:1px solid #203249;border-radius:12px}.w4t-card{padding:12px}.w4t-card small{font-size:9px;text-transform:uppercase;letter-spacing:.05em;opacity:.55}.w4t-card b{display:block;font-size:20px;margin-top:3px}.w4t-card span{display:block;font-size:10px;line-height:1.4;opacity:.7;margin-top:2px}.w4t-section{font-size:15px;font-weight:850;margin:18px 0 8px}.w4t-table{overflow:auto}.w4t-row{display:grid;grid-template-columns:40px minmax(130px,1fr) 105px 110px 120px 170px 115px;min-width:850px;border-bottom:1px solid #203249;align-items:center}.w4t-row:last-child{border-bottom:0}.w4t-row>div{padding:9px 7px;font-size:10px;line-height:1.35}.w4t-th{background:#101f31}.w4t-th>div{font-size:8px;text-transform:uppercase;letter-spacing:.05em;opacity:.55;font-weight:800}.w4t-pick{font-size:12px!important;font-weight:850}.w4t-muted{display:block;font-size:8px;opacity:.58;margin-top:2px}.w4t-good{color:#64cf93}.w4t-warn{color:#e7bc6a}.w4t-bad{color:#ea8e8e}.w4t-pill{display:inline-flex;padding:3px 6px;border:1px solid rgba(127,127,127,.25);border-radius:999px;font-size:8px;font-weight:800}.w4t-port{display:grid;grid-template-columns:1fr 1fr;gap:10px}.w4t-wager{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid #203249;font-size:10px}.w4t-wager:last-child{border-bottom:0}.w4t-note{padding:10px 12px;border-left:3px solid #5f9bd3;background:rgba(95,155,211,.08);border-radius:8px;font-size:10px;line-height:1.5;margin-top:10px}
@media(max-width:760px){.w4t-grid,.w4t-port{grid-template-columns:1fr}.w4t-head{flex-direction:column}.w4t-title{font-size:23px}}
</style>
<script id="week4-today-native-script">
(function(){
 const G=()=>window.WEEK4_CURRENT_PUBLIC||[],M=()=>window.WEEK4_CURRENT_META||{};
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const money=n=>'$'+Number(n||0).toLocaleString();
 function parseTeamLine(text,team){const m=String(text||'').match(new RegExp('(?:^|\\s)'+team.replace(/[.*+?^${}()|[\\]\\]/g,'\\$&')+'\\s*([+-]?\\d+(?:\\.5)?)','i'));return m?Number(m[1]):null;}
 function primaryTeam(g){return String(g.lean||'').trim().split(/\s+/)[0]||null;}
 function liveDiff(g){const team=primaryTeam(g);if(!team||team==='NO')return null;const sly=parseTeamLine(g.sly,team)??parseTeamLine(g.lean,team),cur=parseTeamLine(g.current,team);return sly==null||cur==null?null:+(cur-sly).toFixed(1);}
 function sourceRead(g){const bits=[];if(g.sportsline?.kind==='Spread')bits.push('SL '+(g.sportsline.grade||'')+' '+(g.sportsline.visiblePick||''));if(g.gridiron)bits.push(g.gridiron.bestSide==='NO TAKE'?'Gridiron 50/50':'Gridiron '+g.gridiron.bestSide+' '+g.gridiron.bestPct+'%');if(g.nfelo)bits.push(g.nfelo.positiveEdge?'nfelo '+g.nfelo.bestSide+' '+(g.nfelo.bestEv>0?'+':'')+g.nfelo.bestEv+'%':'nfelo neutral');return bits.join(' · ')||'No external spread read';}
 function diffText(g){const d=liveDiff(g);return d==null?'—':`${d>0?'+':''}${d}`;}
 function priceClass(g){const d=liveDiff(g);if(d==null||d===0)return'w4t-warn';return d>0?'w4t-good':'w4t-bad';}
 function row(g){const decision=g.decision||g.state||'—',cls=decision==='PLAY'?'w4t-good':decision==='PASS'?'w4t-bad':'w4t-warn';return `<div class="w4t-row"><div>#${esc(g.rank||'—')}</div><div class="w4t-pick">${esc(g.lean||'NO TAKE')}<span class="w4t-muted">${esc(g.game)} · ${esc(g.time||'')}</span></div><div>${esc(g.sly||'—')}</div><div><b>${esc(g.current||'—')}</b><span class="w4t-muted">latest market</span></div><div class="${priceClass(g)}">${esc(diffText(g))}<span class="w4t-muted">Current − Sly</span></div><div>${esc(sourceRead(g))}</div><div><span class="w4t-pill ${cls}">${esc(decision)}</span><span class="w4t-muted">C ${money(g.catherine)} · A ${money(g.amanda)}</span></div></div>`;}
 function wagers(arr){return (arr||[]).map(w=>`<div class="w4t-wager"><span><b>${esc(w.pick)}</b><span class="w4t-muted">${esc(w.role||'')}</span></span><b>${money(w.amount)}</b></div>`).join('')||'<span class="w4t-muted">No working wagers</span>';}
 function html(){const games=G(),meta=M(),plays=games.filter(g=>g.decision==='PLAY').length,watch=games.filter(g=>g.decision==='WATCH').length,pass=games.filter(g=>g.decision==='PASS').length,p=meta.working_portfolio||{},bal=meta.balances||{};return `<div class="w4today"><a class="w4t-back" href="/?full=1">← Full Command Center</a><div class="w4t-head"><div><div class="w4t-kicker">NFL Monopoly · Week 4 · live operational board</div><div class="w4t-title">Today — Week 4</div><div class="w4t-sub">This page is generated only from the current Week 4 state. Sly's contest spreads remain locked; Current comes from the latest Week 4 market overlay; DIFF is calculated here as Current − Sly.</div></div><div class="w4t-stamp">Market snapshot<br><b>${esc(meta.captured_at_local||'latest')}</b></div></div><div class="w4t-grid"><div class="w4t-card"><small>Board status</small><b>${plays} Play · ${watch} Watch</b><span>${pass} pass · ${games.length} games tracked</span></div><div class="w4t-card"><small>Household bankroll</small><b>${money(bal.Household||((bal.Catherine||0)+(bal.Amanda||0)))}</b><span>Catherine ${money(bal.Catherine)} · Amanda ${money(bal.Amanda)}</span></div><div class="w4t-card"><small>Working exposure</small><b>${money(p.household_outlay||0)}</b><span>Portfolio sizing is downstream of the recommendation board.</span></div></div><div class="w4t-note"><b>Freshness rule:</b> every row below comes from the current Week 4 structured state and latest market overlay.</div><div class="w4t-section">Current slate</div><div class="w4t-table"><div class="w4t-row w4t-th"><div>Rank</div><div>Recommendation</div><div>Sly</div><div>Current</div><div>DIFF</div><div>External reads</div><div>State / stake</div></div>${[...games].sort((a,b)=>(a.rank||99)-(b.rank||99)).map(row).join('')}</div><div class="w4t-section">Working portfolio</div><div class="w4t-port"><div class="w4t-card"><small>Catherine</small>${wagers(p.Catherine)}</div><div class="w4t-card"><small>Amanda</small>${wagers(p.Amanda)}</div></div><div class="w4t-note">Use <b>Overview</b> for the Prediction → Price → Confirmation → Context synthesis, and <b>5-Factor</b> for the raw five-factor evidence.</div></div>`;}
 function renderStandalone(){if(!G().length)return false;const st=document.getElementById('week4-today-native-style');if(st&&st.parentNode!==document.head)document.head.appendChild(st);document.body.className='w4today-standalone';document.body.innerHTML=html();document.title='Today · Week 4 · NFL Monopoly';window.scrollTo(0,0);return true;}
 function legacyTarget(){return document.getElementById('today')||document.querySelector('[data-view-panel="today"]');}
 function renderLegacy(){const root=legacyTarget();if(!root||!G().length)return false;root.innerHTML=html();return true;}
 function goToday(e){const c=e.target.closest?.('[data-view="today"]');if(!c)return;e.preventDefault();e.stopImmediatePropagation();location.href='/today';}
 document.addEventListener('click',goToday,true);document.addEventListener('touchend',goToday,{capture:true,passive:false});
 function boot(){if(location.pathname==='/today'||location.pathname==='/today/'){renderStandalone();return;}setTimeout(()=>{const active=document.querySelector('[data-view="today"].active');if(location.pathname==='/'&&active&&!new URLSearchParams(location.search).has('full')){location.replace('/today');return;}renderLegacy();},80);}
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
 window.renderWeek4Today=(location.pathname==='/today'||location.pathname==='/today/')?renderStandalone:renderLegacy;
})();
</script>
