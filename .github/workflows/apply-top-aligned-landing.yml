name: Apply Top Aligned Landing
on:
  push:
    paths:
      - apply-top-aligned-landing.js
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply migration
        run: node apply-top-aligned-landing.js
      - name: Syntax check
        run: node --check server-local.js
      - name: Local landing smoke
        run: |
          set -euo pipefail
          PORT=18080 node server-local.js > /tmp/cc.log 2>&1 &
          pid=$!
          trap 'kill $pid || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18080/ > /tmp/root.html; then break; fi
            sleep .25
          done
          grep -q 'Top Aligned Plays' /tmp/root.html
          grep -q 'Important conflicts' /tmp/root.html
          grep -q 'No master consensus score' /tmp/root.html
          curl -fsS http://127.0.0.1:18080/healthz > /tmp/health.json
          grep -q '"topAligned":true' /tmp/health.json
      - name: Commit migrated server
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server-local.js
          git diff --cached --quiet || git commit -m "Add Top Aligned Plays to landing page"
          git push
