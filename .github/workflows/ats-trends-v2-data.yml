name: ATS Trends v2 data build

on:
  push:
    branches: [main]
    paths:
      - 'ats-trends-v2-challenger.js'
      - 'ats-trends-v2-challenger-qa.js'
      - 'ats-trends-v2-ui-patch.html'
      - 'ats-trends-v2-ui-qa.js'
      - 'build-ats-trends-v2-week04-data.js'
      - 'build-ats-trends-prospective-ledger.js'
      - 'five-factor-scorecard-data-week04.json'
      - '.github/workflows/ats-trends-v2-data.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run challenger QA
        run: node ats-trends-v2-challenger-qa.js
      - name: Run v1-v2 UI QA
        run: node ats-trends-v2-ui-qa.js
      - name: Build source-backed Week 4 dataset
        run: node build-ats-trends-v2-week04-data.js
      - name: Freeze prospective v1-v2 ledger
        run: node build-ats-trends-prospective-ledger.js
      - name: Show comparison summary
        run: node -e "const r=require('./ats-trends-v2-week04-results.json'); console.log(JSON.stringify(r.summary,null,2));"
      - name: Persist generated challenger data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ats-trends-v2-week04-input.json ats-trends-v2-week04-results.json ats-trends-prospective-ledger.json
          git diff --cached --quiet || git commit -m "Refresh ATS Trends v2 source-backed outputs"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: ats-trends-v2-week04
          path: |
            ats-trends-v2-week04-input.json
            ats-trends-v2-week04-results.json
            ats-trends-prospective-ledger.json
          retention-days: 14
