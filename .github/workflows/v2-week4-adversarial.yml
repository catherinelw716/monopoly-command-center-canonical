name: Week 4 Adversarial Review QA

on:
  push:
    paths:
      - 'v2/results/week_04_adversarial_review.json'
      - 'v2/results/week_04_four_source_contradiction_layer.json'
      - 'v2/results/week_04_friday_model_layer.json'
      - 'v2/week4_adversarial_qa.py'
      - '.github/workflows/v2-week4-adversarial.yml'
  workflow_dispatch:

jobs:
  week4-adversarial:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Week 4 adversarial review
        run: python v2/week4_adversarial_qa.py
