name: Overview synthesis QA

on:
  push:
    branches: [main]
    paths:
      - 'week4-overview-page.html'
      - 'week4-overview-synthesis-qa.js'
      - '.github/workflows/overview-synthesis-qa.yml'
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate synthesis board contract
        run: node week4-overview-synthesis-qa.js
