name: V2 Research CI

on:
  push:
    paths:
      - 'v2/**'
      - 'V2_MODEL_SPEC.md'
      - 'V2_DATA_FEASIBILITY.md'
      - '.github/workflows/v2-research-ci.yml'
  workflow_dispatch:

jobs:
  v2-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install V2 dependencies
        run: pip install nflreadpy polars pyarrow numpy pandas scikit-learn

      - name: Compile research scripts
        run: >-
          python -m py_compile
          v2/build_historical_dataset.py
          v2/build_baseline_features.py
          v2/qa_checks.py
          v2/shadow_model.py
          v2/shadow_ledger.py
          v2/fit_shadow_model.py
          v2/capture_shadow_snapshot.py
          v2/validate_shadow_ledger.py
          v2/settle_shadow_results.py
          v2/score_shadow_ledger.py
          v2/shadow_pipeline_qa.py
          v2/monopoly_simulator.py
          v2/monopoly_simulator_qa.py
          v2/monopoly_historical_replay_qa.py
          v2/benchmark_strategies.py
          v2/benchmark_strategies_qa.py
          v2/monopoly_tournament_optimizer.py
          v2/monopoly_tournament_optimizer_qa.py
          v2/monopoly_robust_optimizer.py
          v2/run_v2_0009_milestone.py
          v2/run_week3_sunday_robust.py
          v2/run_week3_stability_redteam.py

      - name: Run deterministic shadow-ledger QA
        run: python v2/shadow_pipeline_qa.py

      - name: Run deterministic Monopoly simulator QA
        run: python v2/monopoly_simulator_qa.py

      - name: Replay audited Week 1-2 Monopoly history
        run: python v2/monopoly_historical_replay_qa.py

      - name: Run benchmark strategy QA
        run: python v2/benchmark_strategies_qa.py

      - name: Run V2-0009 tournament optimizer QA
        run: python v2/monopoly_tournament_optimizer_qa.py

      - name: Execute V2-0009 milestone proxy evaluation
        run: |
          python v2/run_v2_0009_milestone.py --simulations 600 --output /tmp/v2_0009_milestone_results.json > /tmp/v2_0009_stdout.json
          python - <<'PY'
          import json
          p='/tmp/v2_0009_milestone_results.json'
          d=json.load(open(p))
          print('V2-0009 optimizer parameters:', d['optimizer']['parameters'])
          print('V2-0009 optimizer expected household prize share:', round(d['optimizer']['expected_household_prize_share'], 6))
          print('V2-0009 optimizer P(any cash):', round(d['optimizer']['p_any_cash'], 6))
          print('V2-0009 optimizer future-minimum failure risk:', round(d['optimizer']['future_minimum_failure_risk'], 6))
          print('Best benchmark:', d['benchmark_ranking'][0]['strategy'], round(d['benchmark_ranking'][0]['expected_household_prize_share'], 6))
          print('Optimizer bets:', d['optimizer']['bets_by_entry'])
          for x in d['robustness_red_team']:
              print('STRESS', x['stress'], round(x['expected_household_prize_share'], 6), round(x['p_any_cash'], 6), round(x['future_minimum_failure_risk'], 6))
          PY

      - name: Execute robust Week 3 Sunday evaluation
        run: |
          python v2/run_week3_sunday_robust.py --simulations 400 --output /tmp/week3_sunday_robust.json > /tmp/week3_sunday_robust_stdout.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/week3_sunday_robust.json'))
          o=d['optimizer']
          print('ROBUST objective:', o['objective'])
          print('ROBUST parameters:', o['parameters'])
          print('ROBUST household outlay:', o['household_outlay'])
          print('ROBUST floor utility:', round(o['robust_floor_utility'], 6))
          print('ROBUST average utility:', round(o['robust_average_utility'], 6))
          print('ROBUST expected household prize share:', round(o['base_expected_household_prize_share'], 6))
          print('ROBUST P(any cash):', round(o['base_p_any_cash'], 6))
          print('ROBUST future-minimum failure risk:', round(o['base_future_minimum_failure_risk'], 6))
          print('ROBUST bets:', o['bets_by_entry'])
          print('Top probability edges:')
          for x in d['probability_ranking'][:8]:
              print(x['game_id'], x['suggested_side'], round(x['edge_per_dollar'],6), x['sly_home_spread'], x['market_home_spread'])
          PY

      - name: Execute Week 3 stability red-team
        run: |
          python v2/run_week3_stability_redteam.py > /tmp/week3_stability_stdout.json
          python - <<'PY'
          import json
          d=json.load(open('v2/results/week3_sunday_stability_redteam.json'))
          print('STABILITY runs:', d['runs'])
          print('STABILITY top parameters:', d['parameter_frequency'][:5])
          print('STABILITY metrics:', d['metric_stability'])
          print('STABILITY selections:')
          for row in d['selection_stability']:
              if row['selection_rate'] >= 0.40 or row['material_market_edge']:
                  print(row)
          PY

      - name: Validate JSON contracts and frozen model artifact
        run: |
          python -m json.tool v2/data_contract.json > /dev/null
          python -m json.tool v2/monopoly_contract.json > /dev/null
          python -m json.tool v2/historical_replay_wk1_wk2.json > /dev/null
          python -m json.tool v2/season_2026/week_02_field_state.json > /dev/null
          python -m json.tool v2/season_2026/week_03_optimizer_proxy.json > /dev/null
          python -m json.tool v2/season_2026/week_03_current_market_2026-09-27_1100ET.json > /dev/null
          python -m json.tool v2/season_2026/week_03_current_market_2026-09-27_1120ET.json > /dev/null
          python -m json.tool v2/season_2026/week_03_context_tiebreak_2026-09-27.json > /dev/null
          python -m json.tool v2/season_2026/week_03_v1_heuristic_portfolio.json > /dev/null
          python -m json.tool v2/shadow_event_schema.json > /dev/null
          python - <<'PY'
          from v2.shadow_model import ShadowModel
          p='v2/model_artifacts/v2_global_hybrid_2016_2025.json'
          model=ShadowModel.load(p)
          assert model.artifact_hash == 'da2b587b06a91d05834a92ed5d2dc6cc42ba7d38069d8d0e7f73b94a71617026'
          assert model.n_training_games == 2639
          assert model.push_shrink == 75.0
          print(f'Frozen shadow model verified: {model.model_version} {model.artifact_hash}')
          PY

      - name: Smoke-test nflverse schedule API and spread normalization
        run: |
          python - <<'PY'
          import nflreadpy as nfl
          import polars as pl
          from v2.build_historical_dataset import normalize_schedule_core

          schedules = nfl.load_schedules([2024])
          assert schedules.height > 250, schedules.height
          core = normalize_schedule_core(schedules)
          assert 'nflverse_spread_line_source' in core.columns
          assert 'home_spread_closing' in core.columns

          check = core.filter(pl.col('nflverse_spread_line_source').is_not_null()).select(
              (pl.col('home_spread_closing') + pl.col('nflverse_spread_line_source')).abs().max().alias('max_error')
          ).item()
          assert check == 0, check
          print(f'Schedule smoke passed: {core.height} games; spread sign max error={check}')
          PY

      - name: Build one-season raw sample
        run: python v2/build_historical_dataset.py --start-season 2024 --end-season 2024 --output-dir /tmp/v2-data

      - name: Run staging QA
        run: python v2/qa_checks.py --data-dir /tmp/v2-data --report /tmp/v2-data/qa_report.json

      - name: Build leakage-safe baseline features
        run: python v2/build_baseline_features.py --data-dir /tmp/v2-data

      - name: Verify baseline artifact
        run: |
          python - <<'PY'
          import polars as pl
          p='/tmp/v2-data/gold/baseline_games.parquet'
          df=pl.read_parquet(p)
          assert df.height > 200, df.height
          assert 'home_margin' in df.columns
          assert any(c.startswith('diff_') for c in df.columns)
          print(f'Baseline feature smoke passed: {df.height} game rows, {df.width} columns')
          PY
