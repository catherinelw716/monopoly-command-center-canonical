name: V2 Research CI

on:
  push:
    paths:
      - 'v2/**'
      - 'V2_MODEL_SPEC.md'
      - 'V2_DATA_FEASIBILITY.md'
      - '.github/workflows/v2-research-ci.yml'
  workflow_dispatch:

jobs:
  v2-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install V2 dependencies
        run: pip install nflreadpy polars pyarrow numpy pandas scikit-learn

      - name: Compile research scripts
        run: >-
          python -m py_compile
          v2/build_historical_dataset.py
          v2/build_baseline_features.py
          v2/qa_checks.py
          v2/shadow_model.py
          v2/shadow_ledger.py
          v2/fit_shadow_model.py
          v2/capture_shadow_snapshot.py
          v2/validate_shadow_ledger.py
          v2/settle_shadow_results.py
          v2/score_shadow_ledger.py
          v2/shadow_pipeline_qa.py

      - name: Run deterministic shadow-ledger QA
        run: python v2/shadow_pipeline_qa.py

      - name: Validate JSON contracts and frozen model artifact
        run: |
          python -m json.tool v2/data_contract.json > /dev/null
          python -m json.tool v2/shadow_event_schema.json > /dev/null
          python - <<'PY'
          from v2.shadow_model import ShadowModel
          p='v2/model_artifacts/v2_global_hybrid_2016_2025.json'
          model=ShadowModel.load(p)
          assert model.artifact_hash == 'da2b587b06a91d05834a92ed5d2dc6cc42ba7d38069d8d0e7f73b94a71617026'
          assert model.n_training_games == 2639
          assert model.push_shrink == 75.0
          print(f'Frozen shadow model verified: {model.model_version} {model.artifact_hash}')
          PY

      - name: Smoke-test nflverse schedule API and spread normalization
        run: |
          python - <<'PY'
          import nflreadpy as nfl
          import polars as pl
          from v2.build_historical_dataset import normalize_schedule_core

          schedules = nfl.load_schedules([2024])
          assert schedules.height > 250, schedules.height
          core = normalize_schedule_core(schedules)
          assert 'nflverse_spread_line_source' in core.columns
          assert 'home_spread_closing' in core.columns

          check = core.filter(pl.col('nflverse_spread_line_source').is_not_null()).select(
              (pl.col('home_spread_closing') + pl.col('nflverse_spread_line_source')).abs().max().alias('max_error')
          ).item()
          assert check == 0, check
          print(f'Schedule smoke passed: {core.height} games; spread sign max error={check}')
          PY

      - name: Build one-season raw sample
        run: python v2/build_historical_dataset.py --start-season 2024 --end-season 2024 --output-dir /tmp/v2-data

      - name: Run staging QA
        run: python v2/qa_checks.py --data-dir /tmp/v2-data --report /tmp/v2-data/qa_report.json

      - name: Build leakage-safe baseline features
        run: python v2/build_baseline_features.py --data-dir /tmp/v2-data

      - name: Verify baseline artifact
        run: |
          python - <<'PY'
          import polars as pl
          p='/tmp/v2-data/gold/baseline_games.parquet'
          df=pl.read_parquet(p)
          assert df.height > 200, df.height
          assert 'home_margin' in df.columns
          assert any(c.startswith('diff_') for c in df.columns)
          print(f'Baseline feature smoke passed: {df.height} game rows, {df.width} columns')
          PY
