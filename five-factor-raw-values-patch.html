<style id="five-factor-raw-values-style">
#spreadScorecard .ff-raw-primary{font-size:11px;font-weight:850;line-height:1.35}#spreadScorecard .ff-raw-secondary{display:block;font-size:8px;opacity:.52;margin-top:2px}#spreadScorecard .ff-factor-score.ff-raw-score{font-size:11px;line-height:1.35}#spreadScorecard .ff-raw-audit{display:block;font-size:8px;font-weight:600;opacity:.48;margin-top:2px}#spreadScorecard .ff-weighting-note{border-left:3px solid var(--ff-accent,currentColor)}
</style>
<script id="five-factor-raw-values-script">
(function(){
 const FF=()=>window.FIVE_FACTOR_PUBLIC||{};
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const fmt=n=>n==null?'—':`${Number(n)>0?'+':''}${Number(n)}`;
 const map=()=>Object.fromEntries((FF().games||[]).map(g=>[g.game,g]));
 function lineRaw(g){const r=g.fiveFactor?.lineMovement?.raw||{};if(r.openAway==null||r.currentAway==null)return 'Unavailable';const m=Number(r.movementTowardAway||0);const dir=Math.abs(m)<.001?'no move':m>0?`${Math.abs(m).toFixed(1)} toward ${g.away}`:`${Math.abs(m).toFixed(1)} toward ${g.home}`;return `${g.away} ${fmt(r.openAway)} → ${fmt(r.currentAway)} · ${dir}`;}
 function moneyRaw(g){const r=g.fiveFactor?.money?.raw||{};if(r.awayPct==null||r.homePct==null)return 'Unavailable';return `${g.away} ${r.awayPct}% · ${g.home} ${r.homePct}%`;}
 function defenseRaw(g){const r=g.fiveFactor?.defense?.raw||{};if(r.awayRank==null||r.homeRank==null)return 'Unavailable';return `${g.away} #${r.awayRank} · ${g.home} #${r.homeRank}`;}
 function keyRaw(g){const r=g.fiveFactor?.keyNumbers?.raw||{};if(r.slyAway==null)return 'Unavailable';return `Sly ${g.away} ${fmt(r.slyAway)} · market ${g.away} ${fmt(r.currentAway)}`;}
 function rawFor(g,k){return k==='lineMovement'?lineRaw(g):k==='money'?moneyRaw(g):k==='defense'?defenseRaw(g):keyRaw(g);}
 function scoreFor(g,k){const o=g.fiveFactor?.overall||{},s=o.leanSide;if(s==='neutral')return 10;return g.fiveFactor?.[k]?.scores?.[s]??10;}
 function addWeightingNote(){const page=document.querySelector('#spreadScorecard .ff-page');if(!page||page.querySelector('.ff-weighting-note'))return;const note=page.querySelector('.ff-note');if(!note)return;note.insertAdjacentHTML('afterend','<div class="ff-panel ff-note ff-weighting-note"><b>Raw evidence first.</b> The 20-point factor scores are a locked Week 4 heuristic, not validated probabilities or empirically proven equal weights. This page now shows the actual market move, handle split, defensive ranks and key-number prices first; point scores remain only as an audit reference.</div>');}
 function patchTable(){const page=document.querySelector('#spreadScorecard');if(!page)return;const th=page.querySelector('.ff-row.ff-th');if(th&&th.children.length>=9){['Line move','Money / handle','Defense rank','Key-number price'].forEach((x,i)=>th.children[5+i].textContent=x);}
 const m=map();page.querySelectorAll('.ff-row:not(.ff-th)').forEach(row=>{const game=row.querySelector('.ff-muted')?.textContent?.split(' · ')[0]?.trim();const g=m[game];if(!g||row.children.length<9)return;['lineMovement','money','defense','keyNumbers'].forEach((k,i)=>{const c=row.children[5+i];c.innerHTML=`<span class="ff-raw-primary">${esc(rawFor(g,k))}</span><span class="ff-raw-secondary">audit score ${scoreFor(g,k)}/20</span>`;});});}
 function patchCards(){const m=map();document.querySelectorAll('#spreadScorecard .ff-game').forEach(card=>{const e=card.querySelector('.ff-eyebrow')?.textContent||'';const game=e.split('·').slice(1).join('·').trim();const g=m[game];if(!g)return;const factors=card.querySelectorAll('.ff-factor');const keys=['lineMovement','money','defense','keyNumbers'];factors.forEach((f,i)=>{const k=keys[i];if(!k)return;const score=f.querySelector('.ff-factor-score');if(score){score.classList.add('ff-raw-score');score.innerHTML=`${esc(rawFor(g,k))}<span class="ff-raw-audit">audit score ${scoreFor(g,k)}/20</span>`;}});});}
 function run(){if(!document.getElementById('spreadScorecard'))return;addWeightingNote();patchTable();patchCards();}
 document.addEventListener('click',()=>setTimeout(run,0));document.addEventListener('touchend',()=>setTimeout(run,0));window.addEventListener('popstate',()=>setTimeout(run,0));if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>{setTimeout(run,50);setTimeout(run,400);setTimeout(run,1200)});else{setTimeout(run,50);setTimeout(run,400);setTimeout(run,1200)}
})();
</script>
