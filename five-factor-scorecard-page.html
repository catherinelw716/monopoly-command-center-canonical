<script id="five-factor-scorecard-script">
(function(){
 const S=()=>window.FIVE_FACTOR_PUBLIC||{};
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const fmt=n=>n==null?'Unavailable':`${n>0?'+':''}${Number(n)}`;
 const score=(f,side)=>f?.scores?.[side]??10;
 const sideOf=g=>g.fiveFactor.overall.leanSide;
 const sideLabel=(g,side)=>side==='away'?g.away:side==='home'?g.home:'No edge';
 const scoreClass=v=>v>=12?'ff-pos':v<=8?'ff-neg':'ff-neu';
 const verdict=v=>v>=12?'SUPPORTS':v<=8?'OPPOSES':'NEUTRAL';
 function comparison(g){const x=g.mainSystemComparison||{};const s=x.status||'CHALLENGER ONLY';const cls=s==='DISAGREES'?'ff-badge disagree':'ff-badge';return `<span class="${cls}">${esc(s)}${x.mainSide?' · main: '+esc(x.mainSide):''}</span>`;}
 function factorRaw(g,key){const f=g.fiveFactor[key],r=f.raw||{};
  if(key==='lineMovement')return r.openAway==null?'Opening line unavailable':`${g.away}: ${fmt(r.openAway)} → ${fmt(r.currentAway)}`;
  if(key==='trends')return `Weighted ATS index: ${g.away} ${r.awayIndex??'—'} · ${g.home} ${r.homeIndex??'—'}`;
  if(key==='money')return r.awayPct==null?'Verified handle unavailable':`${g.away} ${r.awayPct}% · ${g.home} ${r.homePct}% handle · ref ${g.away} ${fmt(r.referenceAway)}`;
  if(key==='defense')return r.awayRank==null?'Comparable defense rank unavailable':`Def EPA/play rank: ${g.away} #${r.awayRank} · ${g.home} #${r.homeRank}`;
  if(key==='keyNumbers')return `Sly: ${g.away} ${fmt(r.slyAway)} · current: ${g.away} ${fmt(r.currentAway)}`;
  return '';
 }
 function factorRow(g,key,label){const f=g.fiveFactor[key],side=sideOf(g),v=side==='neutral'?10:score(f,side);return `<div class="ff-factor-row"><div class="ff-factor-name">${esc(label)}</div><div class="ff-factor-verdict ${scoreClass(v)}">${verdict(v)} · ${v}/20</div><div class="ff-factor-copy">${esc(f.explanation)}<span class="ff-factor-detail">${esc(factorRaw(g,key))}${f.status!=='verified'?' · '+esc(f.status):''}</span></div></div>`;}
 function caseText(g){const side=sideOf(g);if(side==='neutral')return {why:'The five-factor test does not separate the two sides enough to create an independent lean.',against:'There is no clear factor cluster on either side.'};const keys=['lineMovement','trends','money','defense','keyNumbers'];const support=keys.filter(k=>score(g.fiveFactor[k],side)>=12);const oppose=keys.filter(k=>score(g.fiveFactor[k],side)<=8);const names={lineMovement:'line movement',trends:'ATS trends',money:'money/handle',defense:'defense',keyNumbers:'key-number value'};const lead=support.map(k=>names[k]);const why=lead.length?`${sideLabel(g,side)} is supported by ${lead.join(', ')}.`:`${sideLabel(g,side)} has the higher total score, but the support is narrow rather than broad.`;const against=oppose.length?`The main counter-signals are ${oppose.map(k=>names[k]).join(' and ')}.`:'No factor strongly points the other way, although several inputs can be noisy or correlated.';return {why,against};}
 function summaryRow(g,i){const o=g.fiveFactor.overall,side=o.leanSide,leanScore=Math.max(o.awayScore,o.homeScore);const mini=k=>{const v=side==='neutral'?10:score(g.fiveFactor[k],side);return `<div class="ff-mini ${scoreClass(v)}">${v}</div>`};return `<div class="ff-summary-row"><div>${i+1}</div><div><span class="ff-summary-pick">${esc(o.lean)}</span><span class="ff-summary-game">${esc(g.game)}</span></div><div><span class="ff-grade">${esc(o.displayGrade)}</span></div><div><b>${leanScore}/100</b><span class="ff-summary-game">${o.alignment.supports} support · ${o.alignment.opposes} oppose</span></div>${mini('lineMovement')}${mini('trends')}${mini('money')}${mini('defense')}${mini('keyNumbers')}</div>`;}
 function card(g,i){const o=g.fiveFactor.overall,side=o.leanSide,leanScore=Math.max(o.awayScore,o.homeScore),c=caseText(g);const slyPick=side==='away'?`${g.away} ${fmt(g.slyAway)}`:side==='home'?`${g.home} ${fmt(-g.slyAway)}`:'No edge';return `<section class="ff-card"><div class="ff-card-head"><div><div class="ff-card-rank">#${i+1} · ${esc(g.game)}</div><div class="ff-card-pick">${esc(slyPick)} · ${esc(o.displayGrade)}</div><div class="ff-card-sub">Lean score ${leanScore}/100 · ${o.alignment.supports} of 5 factors support · ${o.alignment.opposes} oppose · Sly spread is the line being graded</div></div>${comparison(g)}</div><div class="ff-bottomline"><b>Bottom line:</b> ${esc(c.why)}</div><div class="ff-factor-list">${factorRow(g,'lineMovement','1 · Line movement')}${factorRow(g,'trends','2 · ATS trends')}${factorRow(g,'money','3 · Money / handle')}${factorRow(g,'defense','4 · Defense')}${factorRow(g,'keyNumbers','5 · Key numbers')}</div><div class="ff-against"><b>What argues against it:</b> ${esc(c.against)}</div>${o.confidenceCaps?.length?`<div class="ff-cap">Confidence/grade limits: ${esc(o.confidenceCaps.join(' · '))}</div>`:''}</section>`;}
 function ensureNav(){for(const nav of [document.querySelector('.primary-nav'),document.querySelector('.mobile-nav')]){if(!nav||nav.querySelector('.ff-nav-link'))continue;const a=document.createElement('a');a.href='/spread-scorecard';a.className='ff-nav-link';if(nav.classList.contains('primary-nav'))a.classList.add('nav-btn');a.textContent='5-Factor';const games=nav.querySelector('[data-view="games"]');games?nav.insertBefore(a,games):nav.appendChild(a);}}
 function render(){const s=S();if(!s.games?.length)return false;const games=[...s.games].sort((a,b)=>Math.max(b.fiveFactor.overall.awayScore,b.fiveFactor.overall.homeScore)-Math.max(a.fiveFactor.overall.awayScore,a.fiveFactor.overall.homeScore));const top=games.slice(0,3).map((g,i)=>{const o=g.fiveFactor.overall,c=caseText(g);return `<div class="ff-quick-card"><div class="ff-quick-rank">#${i+1} · ${esc(g.game)}</div><div class="ff-quick-pick">${esc(o.lean)} · ${esc(o.displayGrade)}</div><div class="ff-quick-reason">${esc(c.why)}</div></div>`}).join('');document.body.innerHTML=`<div id="ffStandalone"><div class="ff-wrap"><div class="ff-topbar"><a class="ff-back" href="/">← Full Command Center</a><a class="ff-back" href="/overview">Plain-English Overview</a></div><div class="ff-kicker">NFL Monopoly · Week 4 · Independent Challenger</div><h1 class="ff-title">5-Factor Spread Scorecard</h1><div class="ff-sub">This page asks one simple question for every Sly spread: <b>do line movement, ATS trends, actual money, defense and key-number positioning point toward the same side?</b> It is intentionally separate from the main model so disagreements are visible instead of averaged away.</div><div class="ff-explainer"><div class="ff-explainer-title">How to read the page</div><p><b>Green SUPPORTS</b> means that factor points toward the five-factor lean. <b>Red OPPOSES</b> means it points the other way. <b>Neutral</b> means that factor does not help separate the sides. The overall number is a heuristic score out of 100—not a predicted cover probability. The spread being graded is always Sly’s locked contest spread.</p></div><h2 class="ff-section-title">Quick read — strongest five-factor leans</h2><div class="ff-quick">${top}</div><h2 class="ff-section-title">All games at a glance</h2><div class="ff-summary"><div class="ff-summary-row ff-summary-head"><div>#</div><div>Lean</div><div>Grade</div><div>Strength</div><div>Line</div><div>Trends</div><div>Money</div><div>Def</div><div>Key #</div></div>${games.map(summaryRow).join('')}</div><h2 class="ff-section-title">Game-by-game explanation</h2>${games.map(card).join('')}<section class="ff-method"><h2>Methodology guardrails</h2><p><b>Money means handle/dollars wagered, not bet count or ticket %.</b> Small ATS samples are shrunk toward neutral and older H2H results are downweighted. Defense uses one EPA/play methodology. Key-number logic uses 3, 7, 6, 10 and 14. Sly is never overwritten by a market or model line.</p><p><b>This remains a challenger analysis.</b> It does not feed V2 or Catherine/Amanda sizing. Line movement and money are related market signals, so they should not be interpreted as fully independent evidence.</p></section><div class="ff-foot">Scorecard engine ${esc(s.engineVersion||'v1')} · captured ${esc(s.capturedAt||'')} · challenger only</div></div></div>`;document.title='5-Factor Spread Scorecard · NFL Monopoly';window.scrollTo(0,0);return true;}
 function apply(){if(location.pathname==='/spread-scorecard'){render();return;}ensureNav();}
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>{setTimeout(apply,50);setTimeout(apply,400);setTimeout(apply,1200)});else{setTimeout(apply,50);setTimeout(apply,400);setTimeout(apply,1200)}
 if(location.pathname!=='/spread-scorecard'){let t=null;new MutationObserver(()=>{clearTimeout(t);t=setTimeout(ensureNav,100)}).observe(document.documentElement,{childList:true,subtree:true});}
 window.renderFiveFactorScorecard=render;
})();
</script>
