<style id="five-factor-scorecard-style">
/* 5-Factor is a native Command Center view. The shell/header/nav remain untouched. */
#spreadScorecard.view{display:none}#spreadScorecard.view.active,#spreadScorecard.ff-active{display:block!important}
.ff-page{width:100%;color:var(--ff-text,inherit);padding-bottom:36px}.ff-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin:0 0 16px}.ff-eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;opacity:.62}.ff-title{font:inherit;font-size:28px;font-weight:850;line-height:1.12;margin:5px 0 6px}.ff-sub{font-size:13px;line-height:1.5;opacity:.72;max-width:820px}.ff-pill{display:inline-flex;padding:5px 9px;border:1px solid var(--ff-border,rgba(255,255,255,.12));border-radius:999px;font-size:10px;font-weight:750;white-space:nowrap;background:var(--ff-soft,rgba(255,255,255,.04))}.ff-panel,.ff-game,.ff-top-card{background:var(--ff-surface,rgba(255,255,255,.04));border:1px solid var(--ff-border,rgba(255,255,255,.12));border-radius:var(--ff-radius,12px);box-shadow:var(--ff-shadow,none)}.ff-note{padding:13px 15px;margin-bottom:16px;font-size:12px;line-height:1.5}.ff-section{font:inherit;font-size:16px;font-weight:800;margin:20px 0 9px}.ff-top{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.ff-top-card{padding:13px}.ff-rank{font-size:10px;opacity:.58;text-transform:uppercase;letter-spacing:.06em}.ff-pick{font-size:18px;font-weight:850;margin:4px 0}.ff-copy{font-size:12px;line-height:1.45;opacity:.76}.ff-table{overflow:hidden}.ff-row{display:grid;grid-template-columns:36px minmax(145px,1.45fr) 60px minmax(108px,.9fr) repeat(5,54px);align-items:center;border-bottom:1px solid var(--ff-border,rgba(255,255,255,.1))}.ff-row:last-child{border-bottom:0}.ff-row>div{padding:9px 7px;font-size:11px}.ff-row.ff-th{background:var(--ff-soft,rgba(255,255,255,.035))}.ff-th>div{font-size:9px;font-weight:750;text-transform:uppercase;letter-spacing:.05em;opacity:.58}.ff-lean{font-size:13px!important;font-weight:800}.ff-game-id{display:block;font-size:10px;font-weight:500;opacity:.55;margin-top:2px}.ff-grade{display:inline-flex;justify-content:center;min-width:30px;padding:4px 6px;border-radius:999px;border:1px solid var(--ff-border,rgba(255,255,255,.12));font-weight:850;background:var(--ff-soft,rgba(255,255,255,.04))}.ff-score{text-align:center;font-weight:800}.ff-good{color:var(--ff-good,#5fc88d)}.ff-bad{color:var(--ff-bad,#e68686)}.ff-neutral{opacity:.58}.ff-game{padding:14px;margin:10px 0}.ff-game-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}.ff-game-pick{font-size:21px;font-weight:850;margin:3px 0}.ff-meta{font-size:10px;line-height:1.45;opacity:.6}.ff-compare{padding:4px 8px;border-radius:999px;border:1px solid var(--ff-border,rgba(255,255,255,.12));font-size:9px;font-weight:800;white-space:nowrap}.ff-compare.disagree{color:var(--ff-bad,#e68686)}.ff-bottom{margin:11px 0;padding:10px 11px;background:var(--ff-soft,rgba(255,255,255,.035));border-left:3px solid var(--ff-accent,currentColor);border-radius:8px;font-size:12px;line-height:1.45}.ff-factors{border:1px solid var(--ff-border,rgba(255,255,255,.1));border-radius:10px;overflow:hidden}.ff-factor{display:grid;grid-template-columns:135px 95px 1fr;gap:10px;padding:9px 10px;border-bottom:1px solid var(--ff-border,rgba(255,255,255,.1));align-items:start}.ff-factor:last-child{border-bottom:0}.ff-factor-name{font-size:11px;font-weight:750}.ff-verdict{font-size:10px;font-weight:850}.ff-factor-text{font-size:11px;line-height:1.45;opacity:.78}.ff-raw{display:block;font-size:9px;line-height:1.35;opacity:.58;margin-top:3px}.ff-against{margin-top:10px;font-size:11px;line-height:1.45;opacity:.72}.ff-method{padding:13px 14px;margin-top:16px}.ff-method b{font-weight:800}.ff-foot{font-size:9px;opacity:.5;margin-top:10px}.ff-nav-native{cursor:pointer}
@media(max-width:850px){.ff-top{grid-template-columns:1fr}.ff-th{display:none}.ff-row{grid-template-columns:28px 1fr 46px 82px}.ff-row>div:nth-child(n+5){display:none}.ff-factor{grid-template-columns:120px 82px 1fr}}
@media(max-width:600px){.ff-head,.ff-game-head{flex-direction:column}.ff-title{font-size:24px}.ff-factor{grid-template-columns:1fr;gap:3px}.ff-game{padding:12px}.ff-row{grid-template-columns:25px 1fr 42px 72px}.ff-row>div{padding:8px 5px}}
</style>
<script id="five-factor-scorecard-script">
(function(){
 const VIEW='spreadScorecard', PATH='/spread-scorecard', S=()=>window.FIVE_FACTOR_PUBLIC||{};
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const fmt=n=>n==null?'Unavailable':`${n>0?'+':''}${Number(n)}`;
 const score=(f,side)=>f?.scores?.[side]??10, sideOf=g=>g.fiveFactor.overall.leanSide;
 const sideName=(g,s)=>s==='away'?g.away:s==='home'?g.home:'No edge';
 const cls=v=>v>=12?'ff-good':v<=8?'ff-bad':'ff-neutral', verdict=v=>v>=12?'SUPPORTS':v<=8?'OPPOSES':'NEUTRAL';
 function skin(){const sample=document.querySelector('#analysis .card,#analysis .panel,#games .card,#games .game-card,.card,.panel');if(!sample)return;const c=getComputedStyle(sample),root=document.documentElement.style;root.setProperty('--ff-surface',c.backgroundColor||'transparent');root.setProperty('--ff-border',c.borderColor||'rgba(255,255,255,.12)');root.setProperty('--ff-radius',c.borderRadius||'12px');root.setProperty('--ff-shadow',c.boxShadow||'none');root.setProperty('--ff-text',c.color||'inherit');const a=document.querySelector('.nav-btn.active,.primary-nav .active');if(a)root.setProperty('--ff-accent',getComputedStyle(a).color);}
 function compare(g){const x=g.mainSystemComparison||{},s=x.status||'CHALLENGER ONLY';return `<span class="ff-compare ${s==='DISAGREES'?'disagree':''}">${esc(s)}${x.mainSide?' · main '+esc(x.mainSide):''}</span>`;}
 function raw(g,k){const r=g.fiveFactor[k]?.raw||{};if(k==='lineMovement')return r.openAway==null?'Opening line unavailable':`${g.away} ${fmt(r.openAway)} → ${fmt(r.currentAway)}`;if(k==='trends')return `ATS index: ${g.away} ${r.awayIndex??'—'} · ${g.home} ${r.homeIndex??'—'}`;if(k==='money')return r.awayPct==null?'Verified handle unavailable':`${g.away} ${r.awayPct}% · ${g.home} ${r.homePct}% handle · ref ${g.away} ${fmt(r.referenceAway)}`;if(k==='defense')return r.awayRank==null?'Comparable defensive rank unavailable':`Def EPA/play: ${g.away} #${r.awayRank} · ${g.home} #${r.homeRank}`;return `Sly ${g.away} ${fmt(r.slyAway)} · market ${g.away} ${fmt(r.currentAway)}`;}
 function factor(g,k,label){const f=g.fiveFactor[k],s=sideOf(g),v=s==='neutral'?10:score(f,s);return `<div class="ff-factor"><div class="ff-factor-name">${esc(label)}</div><div class="ff-verdict ${cls(v)}">${verdict(v)} · ${v}/20</div><div class="ff-factor-text">${esc(f.explanation)}<span class="ff-raw">${esc(raw(g,k))}${f.status!=='verified'?' · '+esc(f.status):''}</span></div></div>`;}
 function reasoning(g){const side=sideOf(g),keys=['lineMovement','trends','money','defense','keyNumbers'],names={lineMovement:'line movement',trends:'ATS trends',money:'money/handle',defense:'defense',keyNumbers:'key-number value'};if(side==='neutral')return{why:'The five-factor test does not separate the two sides enough to create an independent lean.',against:'There is no clear cluster of supporting factors.'};const pos=keys.filter(k=>score(g.fiveFactor[k],side)>=12),neg=keys.filter(k=>score(g.fiveFactor[k],side)<=8);return{why:pos.length?`${sideName(g,side)} is supported by ${pos.map(k=>names[k]).join(', ')}.`:`${sideName(g,side)} has the higher total, but support is narrow.`,against:neg.length?`The main counter-signals are ${neg.map(k=>names[k]).join(' and ')}.`:'No factor strongly points the other way, though some inputs are noisy or correlated.'};}
 function displayPick(g){const s=sideOf(g);return s==='away'?`${g.away} ${fmt(g.slyAway)}`:s==='home'?`${g.home} ${fmt(-g.slyAway)}`:'No edge';}
 function row(g,i){const o=g.fiveFactor.overall,s=o.leanSide,total=Math.max(o.awayScore,o.homeScore),m=k=>{const v=s==='neutral'?10:score(g.fiveFactor[k],s);return `<div class="ff-score ${cls(v)}">${v}</div>`};return `<div class="ff-row"><div>${i+1}</div><div class="ff-lean">${esc(displayPick(g))}<span class="ff-game-id">${esc(g.game)}</span></div><div><span class="ff-grade">${esc(o.displayGrade)}</span></div><div><b>${total}/100</b><span class="ff-game-id">${o.alignment.supports} support · ${o.alignment.opposes} oppose</span></div>${m('lineMovement')}${m('trends')}${m('money')}${m('defense')}${m('keyNumbers')}</div>`;}
 function gameCard(g,i){const o=g.fiveFactor.overall,total=Math.max(o.awayScore,o.homeScore),r=reasoning(g);return `<section class="ff-game"><div class="ff-game-head"><div><div class="ff-rank">#${i+1} · ${esc(g.game)}</div><div class="ff-game-pick">${esc(displayPick(g))} · ${esc(o.displayGrade)}</div><div class="ff-meta">${total}/100 · ${o.alignment.supports} of 5 support · ${o.alignment.opposes} oppose · grading Sly's locked spread</div></div>${compare(g)}</div><div class="ff-bottom"><b>Why this side:</b> ${esc(r.why)}</div><div class="ff-factors">${factor(g,'lineMovement','1 · Line Movement')}${factor(g,'trends','2 · ATS Trends')}${factor(g,'money','3 · Money / Handle')}${factor(g,'defense','4 · Defense')}${factor(g,'keyNumbers','5 · Key Numbers')}</div><div class="ff-against"><b>What argues against it:</b> ${esc(r.against)}</div>${o.confidenceCaps?.length?`<div class="ff-foot">Grade limits: ${esc(o.confidenceCaps.join(' · '))}</div>`:''}</section>`;}
 function markup(){const s=S();if(!s.games?.length)return '<div class="ff-panel ff-note">Five-factor data is unavailable.</div>';const games=[...s.games].sort((a,b)=>Math.max(b.fiveFactor.overall.awayScore,b.fiveFactor.overall.homeScore)-Math.max(a.fiveFactor.overall.awayScore,a.fiveFactor.overall.homeScore)),top=games.slice(0,3).map((g,i)=>{const r=reasoning(g),o=g.fiveFactor.overall;return `<div class="ff-top-card"><div class="ff-rank">#${i+1} · ${esc(g.game)}</div><div class="ff-pick">${esc(displayPick(g))} · ${esc(o.displayGrade)}</div><div class="ff-copy">${esc(r.why)}</div></div>`}).join('');return `<div class="ff-page"><div class="ff-head"><div><div class="ff-eyebrow">NFL Monopoly · Week 4 · Spread analysis</div><h1 class="ff-title">5-Factor Spread Scorecard</h1><div class="ff-sub">A separate challenger view of every Sly spread using line movement, ATS trends, verified money/handle, defense and NFL key numbers. It does not change V2 or wager sizing.</div></div><span class="ff-pill">CHALLENGER · INDEPENDENT LENS</span></div><div class="ff-panel ff-note"><b>How to read this:</b> each game gets five 20-point factor scores and a plain-English conclusion. Green supports the lean; red argues against it. The overall score is a heuristic grade, not a cover probability. <b>Money means dollars/handle only—never number of bets or tickets.</b></div><h2 class="ff-section">Strongest 5-Factor leans</h2><div class="ff-top">${top}</div><h2 class="ff-section">All games</h2><div class="ff-panel ff-table"><div class="ff-row ff-th"><div>#</div><div>Lean</div><div>Grade</div><div>Strength</div><div>Line</div><div>Trends</div><div>Money</div><div>Def</div><div>Key #</div></div>${games.map(row).join('')}</div><h2 class="ff-section">Game-by-game explanation</h2>${games.map(gameCard).join('')}<div class="ff-panel ff-method"><b>Methodology guardrails.</b> Small ATS samples are shrunk toward neutral; older H2H is downweighted; defense uses one EPA/play methodology; key numbers are 3, 7, 6, 10 and 14; Sly is never overwritten. Line movement and money can be correlated, so they are not assumed to be independent evidence.</div><div class="ff-foot">Engine ${esc(s.engineVersion||'v1')} · captured ${esc(s.capturedAt||'')} · review ${esc(s.review?.status||'pending')}</div></div>`;}
 function mount(){let v=document.getElementById(VIEW);if(v){v.innerHTML=markup();return v}const anchor=document.getElementById('analysis')||document.getElementById('games')||document.querySelector('.view');if(!anchor)return null;v=document.createElement(anchor.tagName==='SECTION'?'section':'div');v.id=VIEW;v.className='view';v.innerHTML=markup();anchor.parentElement.appendChild(v);skin();return v;}
 function ensureNav(){for(const nav of [document.querySelector('.primary-nav'),document.querySelector('.mobile-nav')]){if(!nav||nav.querySelector(`[data-ff-view="${VIEW}"]`))continue;const tpl=nav.querySelector('[data-view]');let b=tpl?tpl.cloneNode(false):document.createElement('button');b.removeAttribute('data-view');b.removeAttribute('aria-current');b.type='button';b.dataset.ffView=VIEW;b.classList.add('ff-nav-native');b.classList.remove('active');b.textContent='5-Factor';const analysis=nav.querySelector('[data-view="analysis"]'),games=nav.querySelector('[data-view="games"]');const after=analysis||null;if(after)after.insertAdjacentElement('afterend',b);else if(games)nav.insertBefore(b,games);else nav.appendChild(b);}}
 function activate(push=true){const v=mount();if(!v)return false;document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));v.classList.add('active','ff-active');document.querySelectorAll('[data-view]').forEach(x=>x.classList.remove('active'));document.querySelectorAll(`[data-ff-view="${VIEW}"]`).forEach(x=>x.classList.add('active'));if(push&&location.pathname!==PATH)history.pushState({ff:VIEW},'',PATH);document.title='5-Factor Spread Scorecard · NFL Monopoly';skin();window.scrollTo(0,0);return true;}
 function deactivate(){const v=document.getElementById(VIEW);if(v)v.classList.remove('ff-active','active');document.querySelectorAll(`[data-ff-view="${VIEW}"]`).forEach(x=>x.classList.remove('active'));}
 function boot(){mount();ensureNav();skin();if(location.pathname===PATH||new URLSearchParams(location.search).get('view')==='spread-scorecard')activate(false);}
 document.addEventListener('click',e=>{const ff=e.target.closest(`[data-ff-view="${VIEW}"]`);if(ff){e.preventDefault();e.stopImmediatePropagation();activate(true);return}if(e.target.closest('[data-view]'))deactivate();},true);
 document.addEventListener('touchend',e=>{const ff=e.target.closest(`[data-ff-view="${VIEW}"]`);if(!ff)return;e.preventDefault();e.stopImmediatePropagation();activate(true);},{capture:true,passive:false});
 window.addEventListener('popstate',()=>{if(location.pathname===PATH)activate(false);else deactivate()});
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>{boot();setTimeout(boot,300);setTimeout(boot,1000)});else{boot();setTimeout(boot,300);setTimeout(boot,1000)}
 let timer=null;new MutationObserver(()=>{clearTimeout(timer);timer=setTimeout(()=>{mount();ensureNav();skin();if(location.pathname===PATH&&!document.getElementById(VIEW)?.classList.contains('ff-active'))activate(false)},100)}).observe(document.documentElement,{childList:true,subtree:true});
 window.renderFiveFactorScorecard=activate;
})();
</script>
