.ff-page{width:100%}.ff-page-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:18px}.ff-kicker{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#8fa5ba}.ff-title{font-size:30px;line-height:1.12;margin:5px 0 7px}.ff-sub{font-size:14px;line-height:1.55;color:#b7c6d5;max-width:850px}.ff-challenger{padding:5px 9px;border:1px solid #31557d;border-radius:999px;background:#14253a;color:#cce0f7;font-size:10px;white-space:nowrap}.ff-explainer,.ff-panel,.ff-card,.ff-method{background:#0d1a2a;border:1px solid #203249;border-radius:14px}.ff-explainer{padding:14px 16px;margin-bottom:16px}.ff-explainer b{color:#f5f8fb}.ff-explainer p{margin:0;color:#c8d5e1;font-size:12px;line-height:1.55}.ff-section-title{font-size:17px;margin:20px 0 9px}.ff-quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.ff-quick-card{background:#101f31;border:1px solid #203249;border-radius:12px;padding:13px}.ff-quick-rank,.ff-card-rank{font-size:10px;color:#8299ad;text-transform:uppercase;letter-spacing:.06em}.ff-quick-pick{font-size:19px;font-weight:850;margin:4px 0}.ff-quick-reason{font-size:12px;line-height:1.45;color:#becbd7}.ff-summary{overflow:hidden}.ff-summary-row{display:grid;grid-template-columns:40px minmax(150px,1.45fr) 65px minmax(120px,1fr) repeat(5,58px);align-items:center;border-bottom:1px solid #203249}.ff-summary-row:last-child{border-bottom:0}.ff-summary-row>div{padding:10px 8px;font-size:12px}.ff-summary-head>div{font-size:9px;color:#8299ad;text-transform:uppercase;letter-spacing:.05em;background:#101f31}.ff-summary-pick{font-weight:800;font-size:13px}.ff-summary-game{display:block;color:#7f96aa;font-size:10px;margin-top:2px}.ff-grade{display:inline-flex;min-width:32px;justify-content:center;padding:4px 7px;border-radius:999px;background:#17304d;border:1px solid #31557d;font-weight:800}.ff-mini{font-weight:800;text-align:center}.ff-pos{color:#86d1a8}.ff-neg{color:#f0a6a6}.ff-neu{color:#9eb0c1}.ff-card{padding:15px;margin:11px 0}.ff-card-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.ff-card-pick{font-size:23px;font-weight:850;margin:3px 0}.ff-card-sub{font-size:11px;color:#9fb0c1;line-height:1.5}.ff-badge{padding:5px 8px;border-radius:999px;font-size:10px;border:1px solid #31557d;background:#14253a;color:#cce0f7;white-space:nowrap}.ff-badge.disagree{border-color:#74494e;background:#2a171a;color:#f1c4c8}.ff-bottomline{margin:12px 0;background:#0a1725;border-left:3px solid #4f8fdc;border-radius:8px;padding:10px 12px;font-size:12px;line-height:1.5}.ff-factor-list{border:1px solid #203249;border-radius:11px;overflow:hidden}.ff-factor-row{display:grid;grid-template-columns:145px 100px 1fr;gap:11px;align-items:start;padding:10px 11px;border-bottom:1px solid #203249}.ff-factor-row:last-child{border-bottom:0}.ff-factor-name{font-size:12px;font-weight:750}.ff-factor-verdict{font-size:10px;font-weight:800}.ff-factor-copy{font-size:12px;line-height:1.45;color:#c5d1dc}.ff-factor-detail{display:block;color:#7f96aa;font-size:10px;line-height:1.4;margin-top:4px}.ff-against{margin-top:11px;padding:10px 11px;border-radius:9px;background:#101722;border:1px solid #2a3442;font-size:12px;line-height:1.5;color:#cbd5df}.ff-against b{color:#f0c2c2}.ff-cap{margin-top:7px;font-size:10px;color:#8398aa}.ff-method{margin-top:17px;padding:14px}.ff-method h2{font-size:15px;margin:0 0 7px}.ff-method p{font-size:11px;color:#b8c7d5;line-height:1.55;margin:6px 0}.ff-foot{font-size:10px;color:#71889d;margin-top:11px}
.primary-nav .ff-nav-link,.mobile-nav .ff-nav-link{font:inherit;color:inherit;cursor:pointer}.ff-nav-link{border:0;background:transparent}
@media(max-width:880px){.ff-quick{grid-template-columns:1fr}.ff-summary-head{display:none}.ff-summary-row{grid-template-columns:30px 1fr 48px 100px}.ff-summary-row>div:nth-child(n+5){display:none}.ff-card-head{flex-direction:column}.ff-factor-row{grid-template-columns:125px 86px 1fr}.ff-title{font-size:27px}}
@media(max-width:600px){.ff-page-head{flex-direction:column}.ff-title{font-size:25px}.ff-summary-row{grid-template-columns:27px 1fr 43px 84px}.ff-summary-row>div{padding:8px 5px}.ff-card{padding:12px}.ff-card-pick{font-size:21px}.ff-factor-row{grid-template-columns:1fr;gap:4px}.ff-bottomline,.ff-against{font-size:11px}}
</style>
<script id="five-factor-scorecard-script">
(function(){
 const VIEW='spreadScorecard', S=()=>window.FIVE_FACTOR_PUBLIC||{};
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const fmt=n=>n==null?'Unavailable':`${n>0?'+':''}${Number(n)}`;
 const score=(f,side)=>f?.scores?.[side]??10, sideOf=g=>g.fiveFactor.overall.leanSide;
 const sideLabel=(g,side)=>side==='away'?g.away:side==='home'?g.home:'No edge';
 const scoreClass=v=>v>=12?'ff-pos':v<=8?'ff-neg':'ff-neu', verdict=v=>v>=12?'SUPPORTS':v<=8?'OPPOSES':'NEUTRAL';
 function comparison(g){const x=g.mainSystemComparison||{},s=x.status||'CHALLENGER ONLY',cls=s==='DISAGREES'?'ff-badge disagree':'ff-badge';return `<span class="${cls}">${esc(s)}${x.mainSide?' · main: '+esc(x.mainSide):''}</span>`;}
 function factorRaw(g,key){const f=g.fiveFactor[key],r=f.raw||{};if(key==='lineMovement')return r.openAway==null?'Opening line unavailable':`${g.away}: ${fmt(r.openAway)} → ${fmt(r.currentAway)}`;if(key==='trends')return `Weighted ATS index: ${g.away} ${r.awayIndex??'—'} · ${g.home} ${r.homeIndex??'—'}`;if(key==='money')return r.awayPct==null?'Verified handle unavailable':`${g.away} ${r.awayPct}% · ${g.home} ${r.homePct}% handle · ref ${g.away} ${fmt(r.referenceAway)}`;if(key==='defense')return r.awayRank==null?'Comparable defense rank unavailable':`Def EPA/play rank: ${g.away} #${r.awayRank} · ${g.home} #${r.homeRank}`;if(key==='keyNumbers')return `Sly: ${g.away} ${fmt(r.slyAway)} · current: ${g.away} ${fmt(r.currentAway)}`;return '';}
 function factorRow(g,key,label){const f=g.fiveFactor[key],side=sideOf(g),v=side==='neutral'?10:score(f,side);return `<div class="ff-factor-row"><div class="ff-factor-name">${esc(label)}</div><div class="ff-factor-verdict ${scoreClass(v)}">${verdict(v)} · ${v}/20</div><div class="ff-factor-copy">${esc(f.explanation)}<span class="ff-factor-detail">${esc(factorRaw(g,key))}${f.status!=='verified'?' · '+esc(f.status):''}</span></div></div>`;}
 function caseText(g){const side=sideOf(g);if(side==='neutral')return{why:'The five-factor test does not separate the two sides enough to create an independent lean.',against:'There is no clear factor cluster on either side.'};const keys=['lineMovement','trends','money','defense','keyNumbers'],names={lineMovement:'line movement',trends:'ATS trends',money:'money/handle',defense:'defense',keyNumbers:'key-number value'},support=keys.filter(k=>score(g.fiveFactor[k],side)>=12),oppose=keys.filter(k=>score(g.fiveFactor[k],side)<=8);return{why:support.length?`${sideLabel(g,side)} is supported by ${support.map(k=>names[k]).join(', ')}.`:`${sideLabel(g,side)} has the higher total score, but the support is narrow rather than broad.`,against:oppose.length?`The main counter-signals are ${oppose.map(k=>names[k]).join(' and ')}.`:'No factor strongly points the other way, although several inputs can be noisy or correlated.'};}
 function summaryRow(g,i){const o=g.fiveFactor.overall,side=o.leanSide,leanScore=Math.max(o.awayScore,o.homeScore),mini=k=>{const v=side==='neutral'?10:score(g.fiveFactor[k],side);return `<div class="ff-mini ${scoreClass(v)}">${v}</div>`};return `<div class="ff-summary-row"><div>${i+1}</div><div><span class="ff-summary-pick">${esc(o.lean)}</span><span class="ff-summary-game">${esc(g.game)}</span></div><div><span class="ff-grade">${esc(o.displayGrade)}</span></div><div><b>${leanScore}/100</b><span class="ff-summary-game">${o.alignment.supports} support · ${o.alignment.opposes} oppose</span></div>${mini('lineMovement')}${mini('trends')}${mini('money')}${mini('defense')}${mini('keyNumbers')}</div>`;}
 function card(g,i){const o=g.fiveFactor.overall,side=o.leanSide,leanScore=Math.max(o.awayScore,o.homeScore),c=caseText(g),slyPick=side==='away'?`${g.away} ${fmt(g.slyAway)}`:side==='home'?`${g.home} ${fmt(-g.slyAway)}`:'No edge';return `<section class="ff-card"><div class="ff-card-head"><div><div class="ff-card-rank">#${i+1} · ${esc(g.game)}</div><div class="ff-card-pick">${esc(slyPick)} · ${esc(o.displayGrade)}</div><div class="ff-card-sub">Lean score ${leanScore}/100 · ${o.alignment.supports} of 5 factors support · ${o.alignment.opposes} oppose · grading Sly's locked spread</div></div>${comparison(g)}</div><div class="ff-bottomline"><b>Bottom line:</b> ${esc(c.why)}</div><div class="ff-factor-list">${factorRow(g,'lineMovement','1 · Line movement')}${factorRow(g,'trends','2 · ATS trends')}${factorRow(g,'money','3 · Money / handle')}${factorRow(g,'defense','4 · Defense')}${factorRow(g,'keyNumbers','5 · Key numbers')}</div><div class="ff-against"><b>What argues against it:</b> ${esc(c.against)}</div>${o.confidenceCaps?.length?`<div class="ff-cap">Confidence/grade limits: ${esc(o.confidenceCaps.join(' · '))}</div>`:''}</section>`;}
 function markup(){const s=S();if(!s.games?.length)return '<div class="ff-explainer"><p>Five-factor data is unavailable.</p></div>';const games=[...s.games].sort((a,b)=>Math.max(b.fiveFactor.overall.awayScore,b.fiveFactor.overall.homeScore)-Math.max(a.fiveFactor.overall.awayScore,a.fiveFactor.overall.homeScore)),top=games.slice(0,3).map((g,i)=>{const o=g.fiveFactor.overall,c=caseText(g);return `<div class="ff-quick-card"><div class="ff-quick-rank">#${i+1} · ${esc(g.game)}</div><div class="ff-quick-pick">${esc(o.lean)} · ${esc(o.displayGrade)}</div><div class="ff-quick-reason">${esc(c.why)}</div></div>`}).join('');return `<div class="ff-page"><div class="ff-page-head"><div><div class="ff-kicker">Week 4 · Separate spread-analysis lens</div><h1 class="ff-title">5-Factor Spread Scorecard</h1><div class="ff-sub">Every Sly spread graded across line movement, ATS trends, verified money/handle, defense and NFL key numbers. This is intentionally independent of the main model so agreement and disagreement stay visible.</div></div><span class="ff-challenger">CHALLENGER · DOES NOT FEED V2</span></div><div class="ff-explainer"><p><b>How to read it:</b> green supports the five-factor lean, red points the other way, and neutral does not separate the teams. The overall score is a heuristic score out of 100—not a cover probability. <b>Money always means dollars/handle, never ticket count.</b></p></div><h2 class="ff-section-title">Strongest five-factor leans</h2><div class="ff-quick">${top}</div><h2 class="ff-section-title">All games</h2><div class="ff-panel ff-summary"><div class="ff-summary-row ff-summary-head"><div>#</div><div>Lean</div><div>Grade</div><div>Strength</div><div>Line</div><div>Trends</div><div>Money</div><div>Def</div><div>Key #</div></div>${games.map(summaryRow).join('')}</div><h2 class="ff-section-title">Game-by-game</h2>${games.map(card).join('')}<section class="ff-method"><h2>Methodology guardrails</h2><p><b>Money = handle/dollars wagered, not bets/tickets.</b> Small ATS samples are shrunk toward neutral; older H2H results are downweighted; defense uses one EPA/play methodology; key numbers are 3, 7, 6, 10 and 14; Sly is never overwritten by market/model lines.</p><p>Line movement and money can be correlated, so they are not assumed to be fully independent. This page remains a challenger and does not alter V2 or Catherine/Amanda sizing.</p></section><div class="ff-foot">Scorecard engine ${esc(s.engineVersion||'v1')} · captured ${esc(s.capturedAt||'')} · adversarial review: ${esc(s.review?.status||'pending')}</div></div>`;}
 function mount(){let view=document.getElementById(VIEW);if(view){view.innerHTML=markup();return view;}const anchor=document.getElementById('analysis')||document.getElementById('games')||document.querySelector('.view');if(!anchor)return null;view=document.createElement('section');view.id=VIEW;view.className='view';view.innerHTML=markup();anchor.parentElement.appendChild(view);return view;}
 function ensureNav(){for(const nav of [document.querySelector('.primary-nav'),document.querySelector('.mobile-nav')]){if(!nav||nav.querySelector(`[data-view="${VIEW}"]`))continue;const b=document.createElement('button');b.type='button';b.dataset.view=VIEW;b.className='ff-nav-link'+(nav.classList.contains('primary-nav')?' nav-btn':'');b.textContent='5-Factor';const games=nav.querySelector('[data-view="games"]');games?nav.insertBefore(b,games):nav.appendChild(b);}}
 function activate(push=true){const view=mount();if(!view)return false;document.querySelectorAll('.view').forEach(el=>el.classList.toggle('active',el.id===VIEW));document.querySelectorAll('[data-view]').forEach(el=>el.classList.toggle('active',el.dataset.view===VIEW));if(push&&location.pathname!=='/spread-scorecard')history.pushState({view:VIEW},'', '/spread-scorecard');document.title='5-Factor Spread Scorecard · NFL Monopoly';window.scrollTo(0,0);return true;}
 function boot(){mount();ensureNav();if(location.pathname==='/spread-scorecard'||new URLSearchParams(location.search).get('view')==='spread-scorecard')setTimeout(()=>activate(false),80);}
 document.addEventListener('click',e=>{const c=e.target.closest(`[data-view="${VIEW}"]`);if(!c)return;e.preventDefault();e.stopImmediatePropagation();activate(true);},true);
 window.addEventListener('popstate',()=>{if(location.pathname==='/spread-scorecard')activate(false);else if(document.getElementById(VIEW)?.classList.contains('active')&&typeof window.switchView==='function')window.switchView('today');});
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>{boot();setTimeout(boot,400);setTimeout(boot,1200)});else{boot();setTimeout(boot,400);setTimeout(boot,1200)}
 let t=null;new MutationObserver(()=>{clearTimeout(t);t=setTimeout(()=>{mount();ensureNav()},120)}).observe(document.documentElement,{childList:true,subtree:true});
 window.renderFiveFactorScorecard=()=>{mount();return activate(false)};
})();
</script>
