<style id="five-factor-scorecard-style">
.ff-nav-link{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:inherit;font:inherit;cursor:pointer}.primary-nav .ff-nav-link{padding:8px 10px;border-radius:8px}.mobile-nav .ff-nav-link{padding:9px 4px;font-size:10px}
#ffStandalone{min-height:100vh;background:#07111f;color:#e7eef7;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}.ff-wrap{max-width:1180px;margin:0 auto}.ff-top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.ff-back{color:#9fc9ff;text-decoration:none;font-size:13px;white-space:nowrap}.ff-kicker{font-size:11px;text-transform:uppercase;letter-spacing:.11em;color:#8fa5ba}.ff-title{font-size:34px;line-height:1.08;margin:6px 0 8px}.ff-sub{font-size:14px;line-height:1.6;color:#b7c6d5;max-width:860px}.ff-note{margin:16px 0;background:#101f31;border-left:3px solid #4f8fdc;padding:12px 14px;border-radius:8px;font-size:12px;line-height:1.55;color:#cfdae5}.ff-table-wrap{overflow:auto;background:#0d1a2a;border:1px solid #203249;border-radius:14px;margin:16px 0}.ff-table{width:100%;border-collapse:collapse;min-width:900px}.ff-table th,.ff-table td{padding:10px 11px;border-bottom:1px solid #203249;text-align:left;font-size:12px}.ff-table th{color:#8fa5ba;font-size:10px;text-transform:uppercase;letter-spacing:.06em;position:sticky;top:0;background:#0d1a2a}.ff-rank{color:#8fa5ba}.ff-lean{font-weight:800;font-size:14px}.ff-grade{display:inline-flex;min-width:34px;justify-content:center;padding:4px 7px;border-radius:999px;background:#17304d;border:1px solid #31557d;font-weight:800}.ff-factor-pos{color:#86d1a8}.ff-factor-neg{color:#f0a6a6}.ff-factor-neu{color:#9eb0c1}.ff-card{background:#0d1a2a;border:1px solid #203249;border-radius:14px;padding:16px;margin:14px 0}.ff-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.ff-game{font-size:11px;color:#8fa5ba}.ff-pick{font-size:25px;font-weight:850;margin:3px 0}.ff-meta{font-size:12px;color:#a8b9ca;line-height:1.5}.ff-badge{padding:5px 8px;border-radius:999px;font-size:10px;border:1px solid #31557d;background:#14253a;color:#cce0f7;white-space:nowrap}.ff-badge.disagree{border-color:#74494e;background:#2a171a;color:#f1c4c8}.ff-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:14px}.ff-factor{background:#101f31;border:1px solid #203249;border-radius:10px;padding:10px}.ff-factor h4{font-size:11px;margin:0 0 5px;color:#91a8bd}.ff-score{font-size:18px;font-weight:850}.ff-factor p{font-size:11px;line-height:1.45;color:#c1cfdb;margin:6px 0 0}.ff-why{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.ff-callout{background:#0a1725;border-radius:10px;padding:11px 12px;font-size:12px;line-height:1.5;color:#d3dee8}.ff-callout b{display:block;margin-bottom:3px}.ff-source{font-size:10px;color:#7890a5;margin-top:7px;line-height:1.4}.ff-method{margin-top:16px;background:#0d1a2a;border:1px solid #203249;border-radius:14px;padding:15px}.ff-method h2{font-size:17px;margin:0 0 8px}.ff-method p{font-size:12px;color:#b8c7d5;line-height:1.6}.ff-foot{font-size:10px;color:#71889d;margin-top:12px}
@media(max-width:900px){#ffStandalone{padding:16px}.ff-title{font-size:27px}.ff-grid{grid-template-columns:1fr 1fr}.ff-why{grid-template-columns:1fr}.ff-head{flex-direction:column}.ff-top{flex-direction:column}.ff-back{order:-1}}@media(max-width:520px){.ff-grid{grid-template-columns:1fr}}
</style>
<script id="five-factor-scorecard-script">
(function(){
 const S=()=>window.FIVE_FACTOR_PUBLIC||{}; const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const fmt=n=>n==null?'Unavailable':`${n>0?'+':''}${Number(n)}`; const score=(f,side)=>f?.scores?.[side]??10;
 const state=(v)=>v>=12?'ff-factor-pos':v<=8?'ff-factor-neg':'ff-factor-neu';
 const sideOf=(g)=>g.fiveFactor.overall.leanSide; const team=(g,side)=>side==='away'?g.away:g.home;
 function factorCell(g,key,label){const f=g.fiveFactor[key],side=sideOf(g),v=side==='neutral'?10:score(f,side),cl=state(v);return `<div class="ff-factor"><h4>${esc(label)}</h4><div class="ff-score ${cl}">${v}/20</div><p>${esc(f.explanation)}</p><div class="ff-source">${esc(f.status)}${f.raw?.source?' · '+esc(f.raw.source):''}${f.raw?.capturedAt?' · '+esc(f.raw.capturedAt):''}</div></div>`;}
 function caseText(g){const side=sideOf(g);if(side==='neutral')return {why:'The five factors are balanced. There is no independent five-factor lean.',against:'No factor cluster is strong enough to separate the sides.'};const fs=['lineMovement','trends','money','defense','keyNumbers'].map(k=>g.fiveFactor[k]);const support=fs.filter(f=>score(f,side)>=12).map(f=>f.explanation);const oppose=fs.filter(f=>score(f,side)<=8).map(f=>f.explanation);return {why:support.length?support.slice(0,3).join(' '):'The overall score is slightly higher for this side, but broad support is limited.',against:oppose.length?oppose.slice(0,2).join(' '):'No factor strongly argues the other way; the main risk is that several inputs are correlated or noisy.'};}
 function comparison(g){const x=g.mainSystemComparison||{};const s=x.status||'CHALLENGER ONLY';const cls=s==='DISAGREES'?'ff-badge disagree':'ff-badge';return `<span class="${cls}">${esc(s)}${x.mainSide?' · main: '+esc(x.mainSide):''}</span>`;}
 function summaryRow(g,i){const o=g.fiveFactor.overall,side=o.leanSide;const f=k=>{const v=side==='neutral'?10:score(g.fiveFactor[k],side);return `<span class="${state(v)}">${v}</span>`};return `<tr><td class="ff-rank">${i+1}</td><td><div class="ff-lean">${esc(o.lean)}</div><div class="ff-rank">${esc(g.game)}</div></td><td><span class="ff-grade">${esc(o.displayGrade)}</span></td><td>${o.awayScore}-${o.homeScore}</td><td>${f('lineMovement')}</td><td>${f('trends')}</td><td>${f('money')}</td><td>${f('defense')}</td><td>${f('keyNumbers')}</td><td>${comparison(g)}</td></tr>`;}
 function card(g,i){const o=g.fiveFactor.overall,c=caseText(g),side=o.leanSide;const slySide=side==='away'?`${g.away} ${fmt(g.slyAway)}`:side==='home'?`${g.home} ${fmt(-g.slyAway)}`:'No edge';const al=o.alignment;return `<section class="ff-card"><div class="ff-head"><div><div class="ff-game">#${i+1} · ${esc(g.game)}</div><div class="ff-pick">${esc(slySide)} · ${esc(o.displayGrade)}</div><div class="ff-meta">Five-factor score: ${o.awayScore}-${o.homeScore} · ${al.supports} support · ${al.neutral} neutral · ${al.opposes} oppose<br>Sly: ${esc(g.away)} ${fmt(g.slyAway)} / ${esc(g.home)} ${fmt(-g.slyAway)} · Market open/current: ${fmt(g.market?.openAway)} → ${fmt(g.market?.currentAway)} for ${esc(g.away)}</div></div>${comparison(g)}</div><div class="ff-grid">${factorCell(g,'lineMovement','1 · Line Movement')}${factorCell(g,'trends','2 · ATS Trends')}${factorCell(g,'money','3 · Money / Handle')}${factorCell(g,'defense','4 · Defense')}${factorCell(g,'keyNumbers','5 · Key Numbers')}</div><div class="ff-why"><div class="ff-callout"><b>Why this side</b>${esc(c.why)}</div><div class="ff-callout"><b>What argues against it</b>${esc(c.against)}</div></div>${o.confidenceCaps?.length?`<div class="ff-source">Grade caps: ${esc(o.confidenceCaps.join(' · '))}</div>`:''}</section>`;}
 function ensureNav(){for(const nav of [document.querySelector('.primary-nav'),document.querySelector('.mobile-nav')]){if(!nav||nav.querySelector('.ff-nav-link'))continue;const a=document.createElement('a');a.href='/spread-scorecard';a.className='ff-nav-link';if(nav.classList.contains('primary-nav'))a.classList.add('nav-btn');a.textContent='5-Factor';const games=nav.querySelector('[data-view="games"]');games?nav.insertBefore(a,games):nav.appendChild(a);}}
 function render(){const s=S();if(!s.games?.length)return false;const games=[...s.games].sort((a,b)=>Math.max(b.fiveFactor.overall.awayScore,b.fiveFactor.overall.homeScore)-Math.max(a.fiveFactor.overall.awayScore,a.fiveFactor.overall.homeScore));document.body.innerHTML=`<div id="ffStandalone"><div class="ff-wrap"><div class="ff-top"><div><div class="ff-kicker">NFL Monopoly · Week 4 · Challenger Analysis</div><h1 class="ff-title">5-Factor Spread Scorecard</h1><div class="ff-sub">Every eligible Sly spread is evaluated independently on five things: line movement, ATS trends, verified <b>money/handle %</b>, defense, and NFL key numbers. This is deliberately separate from V2 and the main wager optimizer so we can see where a transparent heuristic framework agrees—or disagrees—with our primary system.</div></div><a class="ff-back" href="/">← Full Command Center</a></div><div class="ff-note"><b>How to read this:</b> each factor is scored 0–20 for each side. 10 is neutral. The five factors sum to 100 across the matchup. The grade is a heuristic strength grade, <b>not a cover probability</b>. Line movement and money can be correlated, H2H trends can be noisy, and this Saturday snapshot must be refreshed before PRE_KICK_FINAL.</div><div class="ff-table-wrap"><table class="ff-table"><thead><tr><th>#</th><th>5-Factor Lean</th><th>Grade</th><th>Score A-H</th><th>Line</th><th>Trends</th><th>Money</th><th>Defense</th><th>Key #</th><th>Main system</th></tr></thead><tbody>${games.map(summaryRow).join('')}</tbody></table></div>${games.map(card).join('')}<section class="ff-method"><h2>Methodology guardrails</h2><p><b>Sly is immutable.</b> Market/source lines are evidence only. <b>Money means Handle %</b>—actual dollars wagered—not bets or tickets. ATS trend samples are shrunk toward neutral when small and older H2H results are downweighted. Defensive EPA/play comes from one methodology. Key-number logic uses 3, 7, 6, 10 and 14. This scorecard does not feed V2 or Catherine/Amanda sizing.</p><p><b>Adversarial-review note:</b> the current Yards Per Pass page labels the source as Week 4 because the week is in progress; Sunday/Monday teams still have three completed games, and the Thursday result can slightly affect league-wide rank ordering. Refresh defense, market and handle before final submission.</p></section><div class="ff-foot">Scorecard engine ${esc(s.engineVersion||'v1')} · captured ${esc(s.capturedAt||'')} · challenger only</div></div></div>`;document.title='5-Factor Spread Scorecard · NFL Monopoly';window.scrollTo(0,0);return true;}
 function apply(){if(location.pathname==='/spread-scorecard'){render();return;}ensureNav();}
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>{setTimeout(apply,50);setTimeout(apply,400);setTimeout(apply,1200)});else{setTimeout(apply,50);setTimeout(apply,400);setTimeout(apply,1200)}
 if(location.pathname!=='/spread-scorecard'){let t=null;new MutationObserver(()=>{clearTimeout(t);t=setTimeout(ensureNav,100)}).observe(document.documentElement,{childList:true,subtree:true});}
 window.renderFiveFactorScorecard=render;
})();
</script>
