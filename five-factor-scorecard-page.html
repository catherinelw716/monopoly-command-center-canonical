<style id="five-factor-scorecard-style">
#spreadScorecard.view{display:none}#spreadScorecard.view.active,#spreadScorecard.ff-active{display:block!important}.ff-page{width:100%;padding-bottom:36px;color:var(--ff-text,inherit)}.ff-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:16px}.ff-title{font-size:28px;font-weight:850;line-height:1.12;margin:4px 0 6px}.ff-sub{font-size:13px;line-height:1.5;opacity:.74;max-width:900px}.ff-eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;opacity:.6}.ff-pill{display:inline-flex;padding:5px 9px;border:1px solid var(--ff-border,rgba(255,255,255,.12));border-radius:999px;font-size:10px;font-weight:800;white-space:nowrap;background:var(--ff-soft,rgba(255,255,255,.04))}.ff-panel,.ff-card,.ff-game{background:var(--ff-surface,rgba(255,255,255,.04));border:1px solid var(--ff-border,rgba(255,255,255,.12));border-radius:var(--ff-radius,12px);box-shadow:var(--ff-shadow,none)}.ff-note{padding:12px 14px;font-size:12px;line-height:1.5;margin-bottom:15px}.ff-section{font-size:16px;font-weight:850;margin:20px 0 9px}.ff-compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ff-card{padding:13px}.ff-card h3{font-size:13px;margin:0 0 8px}.ff-list{display:grid;gap:7px}.ff-choice{padding:8px 9px;border-radius:8px;background:var(--ff-soft,rgba(255,255,255,.035));font-size:11px;line-height:1.4}.ff-choice b{font-size:12px}.ff-choice small{display:block;opacity:.6;margin-top:2px}.ff-consensus-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ff-consensus{border-left:3px solid var(--ff-good,#5fc88d)}.ff-diff{border-left:3px solid var(--ff-bad,#e68686)}.ff-table{overflow:auto}.ff-row{display:grid;grid-template-columns:32px minmax(135px,1.3fr) 70px minmax(145px,1.25fr) minmax(145px,1.25fr) repeat(4,56px);align-items:center;border-bottom:1px solid var(--ff-border,rgba(255,255,255,.1));min-width:820px}.ff-row:last-child{border-bottom:0}.ff-row>div{padding:9px 7px;font-size:10px}.ff-th{background:var(--ff-soft,rgba(255,255,255,.035))}.ff-th>div{text-transform:uppercase;letter-spacing:.04em;font-size:8px;font-weight:800;opacity:.6}.ff-lean{font-size:12px!important;font-weight:800}.ff-muted{display:block;font-size:9px;font-weight:500;opacity:.55;margin-top:2px}.ff-method-cell{padding:7px!important}.ff-method-box{padding:6px 7px;border-radius:7px;background:rgba(127,127,127,.06);line-height:1.35}.ff-method-label{font-size:8px;text-transform:uppercase;letter-spacing:.04em;opacity:.55}.ff-method-pick{font-size:11px;font-weight:850;margin-top:2px}.ff-agree{color:var(--ff-good,#5fc88d)}.ff-flip{color:var(--ff-bad,#e68686)}.ff-game{padding:14px;margin:10px 0}.ff-game-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.ff-game-pick{font-size:20px;font-weight:850;margin:3px 0}.ff-meta{font-size:10px;opacity:.6}.ff-ats-pair{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:11px 0}.ff-ats-box{padding:10px;border:1px solid var(--ff-border,rgba(255,255,255,.1));border-radius:9px;background:var(--ff-soft,rgba(255,255,255,.035))}.ff-ats-box .label{font-size:9px;text-transform:uppercase;letter-spacing:.05em;opacity:.56}.ff-ats-box .pick{font-size:14px;font-weight:850;margin:3px 0}.ff-ats-box .desc{font-size:10px;line-height:1.4;opacity:.7}.ff-status{display:inline-flex;padding:3px 7px;border-radius:999px;border:1px solid var(--ff-border,rgba(255,255,255,.12));font-size:8px;font-weight:850;text-transform:uppercase;letter-spacing:.04em}.ff-factors{border:1px solid var(--ff-border,rgba(255,255,255,.1));border-radius:10px;overflow:hidden}.ff-factor{display:grid;grid-template-columns:135px 90px 1fr;gap:10px;padding:9px 10px;border-bottom:1px solid var(--ff-border,rgba(255,255,255,.1));align-items:start}.ff-factor:last-child{border-bottom:0}.ff-factor-name{font-size:11px;font-weight:800}.ff-factor-score{font-size:10px;font-weight:850}.ff-factor-copy{font-size:11px;line-height:1.45;opacity:.76}.ff-method{padding:13px 14px;margin-top:16px;font-size:11px;line-height:1.5}.ff-foot{font-size:9px;opacity:.5;margin-top:10px}.ff-nav-native{cursor:pointer}.ff-error{padding:18px}
@media(max-width:850px){.ff-compare-grid,.ff-consensus-grid{grid-template-columns:1fr}.ff-row{min-width:760px}.ff-factor{grid-template-columns:115px 80px 1fr}}
@media(max-width:600px){.ff-head,.ff-game-head{flex-direction:column}.ff-title{font-size:24px}.ff-ats-pair{grid-template-columns:1fr}.ff-factor{grid-template-columns:1fr;gap:3px}.ff-game{padding:12px}}
</style>
<script id="five-factor-scorecard-script">
(function(){
 window.__ATS_COMPARISON_NATIVE=true;
 const VIEW='spreadScorecard',PATH='/spread-scorecard';
 const FF=()=>window.FIVE_FACTOR_PUBLIC||{},V2=()=>window.ATS_TRENDS_V2_PUBLIC||{};
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const fmt=n=>n==null?'—':`${Number(n)>0?'+':''}${Number(n)}`;
 const v2Map=()=>Object.fromEntries((V2().games||[]).map(x=>[x.game,x]));
 function skin(){const sample=document.querySelector('#analysis .card,#analysis .panel,#games .card,.card,.panel');if(!sample)return;const c=getComputedStyle(sample),r=document.documentElement.style;r.setProperty('--ff-surface',c.backgroundColor||'transparent');r.setProperty('--ff-border',c.borderColor||'rgba(255,255,255,.12)');r.setProperty('--ff-radius',c.borderRadius||'12px');r.setProperty('--ff-shadow',c.boxShadow||'none');r.setProperty('--ff-text',c.color||'inherit');}
 function sideSpread(g,t){return t===g.away?g.slyAway:t===g.home?-g.slyAway:null}
 function pick(g,t){return !t||t==='NO EDGE'||t==='neutral'?'No edge':`${t} ${fmt(sideSpread(g,t))}`}
 function officialPick(g){const o=g.fiveFactor.overall;return o.leanSide==='away'?pick(g,g.away):o.leanSide==='home'?pick(g,g.home):'No edge'}
 function trendStrength(scores){if(!scores)return 0;return Math.abs((scores.away??10)-(scores.home??10))}
 function trendRows(version){const m=v2Map();return (FF().games||[]).map(g=>{const r=m[g.game];if(version==='v1')return{game:g.game,g,team:r?.v1?.lean||g.fiveFactor.trends.lean||'NO EDGE',scores:r?.v1?.scores||g.fiveFactor.trends.scores};return{game:g.game,g,team:r?.v2?.leanTeam||'NO EDGE',scores:r?.v2?.scores||{away:10,home:10}}}).sort((a,b)=>trendStrength(b.scores)-trendStrength(a.scores)||a.game.localeCompare(b.game));}
 function choice(x,i){return `<div class="ff-choice"><b>#${i+1} · ${esc(pick(x.g,x.team))}</b><small>${esc(x.game)} · score ${esc(x.scores?.away??10)}-${esc(x.scores?.home??10)} · separation ${trendStrength(x.scores)}</small></div>`}
 function comparisonPanels(){const m=v2Map(),v1=trendRows('v1').slice(0,5),v2=trendRows('v2').slice(0,5);const all=(FF().games||[]).map(g=>({g,r:m[g.game]})).filter(x=>x.r);const agree=all.filter(x=>x.r.comparison==='AGREE'),diff=all.filter(x=>x.r.comparison!=='AGREE');const agreeHtml=agree.map(({g,r})=>`<div class="ff-choice"><b>${esc(pick(g,r.v1.lean))}</b><small>${esc(g.game)} · v1 ${r.v1.scores.away}-${r.v1.scores.home} · v2 ${r.v2.scores.away}-${r.v2.scores.home}</small></div>`).join('')||'<div class="ff-choice">No consensus games.</div>';const diffHtml=diff.map(({g,r})=>`<div class="ff-choice"><b>${esc(g.game)}</b><small>v1: ${esc(pick(g,r.v1.lean))} · v2: ${esc(pick(g,r.v2.leanTeam))} · ${esc(r.comparison)}</small></div>`).join('')||'<div class="ff-choice">No differences.</div>';return `<h2 class="ff-section">ATS Trends top choices — v1 vs v2</h2><div class="ff-compare-grid"><div class="ff-card"><h3>v1 · locked Week 4 methodology</h3><div class="ff-list">${v1.map(choice).join('')}</div></div><div class="ff-card"><h3>v2 · preferred cover-margin challenger</h3><div class="ff-list">${v2.map(choice).join('')}</div></div></div><h2 class="ff-section">Consensus and differences</h2><div class="ff-consensus-grid"><div class="ff-card ff-consensus"><h3>Consensus · ${agree.length} games</h3><div class="ff-list">${agreeHtml}</div></div><div class="ff-card ff-diff"><h3>Differences · ${diff.length} games</h3><div class="ff-list">${diffHtml}</div></div></div>`}
 function factorScore(g,k){const o=g.fiveFactor.overall,s=o.leanSide;if(s==='neutral')return 10;return g.fiveFactor[k]?.scores?.[s]??10}
 function factorClass(v){return v>=12?'ff-agree':v<=8?'ff-flip':''}
 function allRows(){const m=v2Map();const games=[...(FF().games||[])].sort((a,b)=>Math.max(b.fiveFactor.overall.awayScore,b.fiveFactor.overall.homeScore)-Math.max(a.fiveFactor.overall.awayScore,a.fiveFactor.overall.homeScore));return games.map((g,i)=>{const r=m[g.game]||{},v1=r.v1||{},v2=r.v2||{},status=r.comparison||'NO V2';return `<div class="ff-row"><div>${i+1}</div><div class="ff-lean">${esc(officialPick(g))}<span class="ff-muted">${esc(g.game)} · official 5-factor</span></div><div><b>${Math.max(g.fiveFactor.overall.awayScore,g.fiveFactor.overall.homeScore)}/100</b><span class="ff-muted">${esc(g.fiveFactor.overall.displayGrade||'')}</span></div><div class="ff-method-cell"><div class="ff-method-box"><div class="ff-method-label">ATS v1 · locked</div><div class="ff-method-pick">${esc(pick(g,v1.lean))}</div><span class="ff-muted">${esc(v1.scores?.away??10)}-${esc(v1.scores?.home??10)}</span></div></div><div class="ff-method-cell"><div class="ff-method-box"><div class="ff-method-label">ATS v2 · preferred</div><div class="ff-method-pick">${esc(pick(g,v2.leanTeam))}</div><span class="ff-muted ${status==='AGREE'?'ff-agree':'ff-flip'}">${esc(v2.scores?.away??10)}-${esc(v2.scores?.home??10)} · ${esc(status)}</span></div></div>${['lineMovement','money','defense','keyNumbers'].map(k=>`<div class="${factorClass(factorScore(g,k))}">${factorScore(g,k)}</div>`).join('')}</div>`}).join('')}
 function factor(g,k,label){const v=factorScore(g,k),f=g.fiveFactor[k]||{};return `<div class="ff-factor"><div class="ff-factor-name">${esc(label)}</div><div class="ff-factor-score ${factorClass(v)}">${v}/20</div><div class="ff-factor-copy">${esc(f.explanation||'No explanation available.')}</div></div>`}
 function gameCards(){const m=v2Map();const games=[...(FF().games||[])].sort((a,b)=>Math.max(b.fiveFactor.overall.awayScore,b.fiveFactor.overall.homeScore)-Math.max(a.fiveFactor.overall.awayScore,a.fiveFactor.overall.homeScore));return games.map((g,i)=>{const r=m[g.game]||{},v1=r.v1||{},v2=r.v2||{},status=r.comparison||'NO V2',o=g.fiveFactor.overall;return `<section class="ff-game"><div class="ff-game-head"><div><div class="ff-eyebrow">#${i+1} · ${esc(g.game)}</div><div class="ff-game-pick">${esc(officialPick(g))} · ${esc(o.displayGrade||'')}</div><div class="ff-meta">Official five-factor grade ${Math.max(o.awayScore,o.homeScore)}/100 · Sly's locked spread</div></div><span class="ff-status ${status==='AGREE'?'ff-agree':'ff-flip'}">${esc(status)}</span></div><div class="ff-ats-pair"><div class="ff-ats-box"><div class="label">ATS Trends v1 · locked official Week 4 factor</div><div class="pick">${esc(pick(g,v1.lean))} · ${esc(v1.scores?.away??10)}-${esc(v1.scores?.home??10)}</div><div class="desc">40% H2H ATS · 35% current-season ATS · 25% recent ATS. Remains the factor used in the locked Week 4 100-point grade.</div></div><div class="ff-ats-box"><div class="label">ATS Trends v2 · preferred challenger</div><div class="pick">${esc(pick(g,v2.leanTeam))} · ${esc(v2.scores?.away??10)}-${esc(v2.scores?.home??10)}</div><div class="desc">45% current-season cover margin · 40% non-overlapping prior form · 15% H2H. ${esc(status==='AGREE'?'Agrees with v1.':status==='DISAGREE'?'Flips the side from v1.':'Changes the strength/neutrality versus v1.')}</div></div></div><div class="ff-factors">${factor(g,'lineMovement','1 · Line Movement')}${factor(g,'money','3 · Money / Handle')}${factor(g,'defense','4 · Defense')}${factor(g,'keyNumbers','5 · Key Numbers')}</div></section>`}).join('')}
 function markup(){const f=FF();if(!f.games?.length)return '<div class="ff-panel ff-error">5-Factor data is unavailable.</div>';return `<div class="ff-page"><div class="ff-head"><div><div class="ff-eyebrow">NFL Monopoly · Week 4</div><h1 class="ff-title">5-Factor Spread Scorecard</h1><div class="ff-sub">The official Week 4 five-factor score remains locked, while ATS Trends v1 and v2 are displayed next to each other everywhere so you can see consensus, disagreement and how the revised methodology changes the slate.</div></div><span class="ff-pill">V1 BASELINE · V2 CHALLENGER</span></div><div class="ff-panel ff-note"><b>Important:</b> v1 still feeds the locked Week 4 100-point grade. v2 is shown prospectively beside it and does not rewrite the original score. Money means dollars/handle only.</div>${comparisonPanels()}<h2 class="ff-section">All games — v1 and v2 side by side</h2><div class="ff-panel ff-table"><div class="ff-row ff-th"><div>#</div><div>Official 5-Factor Lean</div><div>Grade</div><div>ATS Trends v1</div><div>ATS Trends v2</div><div>Line</div><div>Money</div><div>Def</div><div>Key #</div></div>${allRows()}</div><h2 class="ff-section">Game-by-game comparison</h2>${gameCards()}<div class="ff-panel ff-method"><b>Methodology guardrail:</b> Week 4 v1 and v2 predictions are frozen before results. Promotion decisions require multi-week prospective evidence; no post-result rewriting. Line movement and money/handle are related market signals and should not be treated as fully independent confirmation.</div><div class="ff-foot">5-Factor engine ${esc(f.engineVersion||'v1')} · ATS v2 ${esc(V2().engine||'challenger')} · captured ${esc(f.capturedAt||'')}</div></div>`}
 function mount(){let v=document.getElementById(VIEW);if(v)return v;const anchor=document.getElementById('analysis')||document.getElementById('games')||document.querySelector('.view');if(!anchor)return null;v=document.createElement(anchor.tagName==='SECTION'?'section':'div');v.id=VIEW;v.className='view';v.innerHTML=markup();anchor.parentElement.appendChild(v);skin();return v}
 function ensureNav(){for(const nav of [document.querySelector('.primary-nav'),document.querySelector('.mobile-nav')]){if(!nav||nav.querySelector(`[data-ff-view="${VIEW}"]`))continue;const tpl=nav.querySelector('[data-view]');const b=tpl?tpl.cloneNode(false):document.createElement('button');b.removeAttribute('data-view');b.removeAttribute('aria-current');b.type='button';b.dataset.ffView=VIEW;b.classList.add('ff-nav-native');b.classList.remove('active');b.textContent='5-Factor';const analysis=nav.querySelector('[data-view="analysis"]');analysis?analysis.insertAdjacentElement('afterend',b):nav.appendChild(b)}}
 function activate(push=true){const v=mount();if(!v)return false;document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));v.classList.add('active','ff-active');document.querySelectorAll('[data-view]').forEach(x=>x.classList.remove('active'));document.querySelectorAll(`[data-ff-view="${VIEW}"]`).forEach(x=>x.classList.add('active'));if(push&&location.pathname!==PATH)history.pushState({ff:VIEW},'',PATH);document.title='5-Factor Spread Scorecard · NFL Monopoly';skin();window.scrollTo(0,0);return true}
 function deactivate(){document.getElementById(VIEW)?.classList.remove('active','ff-active');document.querySelectorAll(`[data-ff-view="${VIEW}"]`).forEach(x=>x.classList.remove('active'))}
 function boot(){mount();ensureNav();skin();if(location.pathname===PATH||new URLSearchParams(location.search).get('view')==='spread-scorecard')activate(false)}
 document.addEventListener('click',e=>{const b=e.target.closest(`[data-ff-view="${VIEW}"]`);if(b){e.preventDefault();e.stopImmediatePropagation();activate(true);return}if(e.target.closest('[data-view]'))deactivate()},true);
 window.addEventListener('popstate',()=>location.pathname===PATH?activate(false):deactivate());
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>{boot();setTimeout(boot,300)});else{boot();setTimeout(boot,300)}
 let t=null;new MutationObserver(()=>{clearTimeout(t);t=setTimeout(()=>{ensureNav();if(location.pathname===PATH&&!document.getElementById(VIEW)?.classList.contains('ff-active'))activate(false)},150)}).observe(document.documentElement,{childList:true,subtree:true});
 window.renderFiveFactorScorecard=activate;
})();
</script>
