<style id="ats-trends-v2-ui-style">
.ff-v2-compare{margin-top:8px;padding:9px 10px;border:1px solid var(--ff-border,rgba(255,255,255,.1));border-radius:8px;background:var(--ff-soft,rgba(255,255,255,.035));font-size:10px;line-height:1.45}.ff-v2-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px}.ff-v2-title{font-weight:850}.ff-v2-badge{font-size:8px;font-weight:850;letter-spacing:.05em;text-transform:uppercase;padding:3px 6px;border-radius:999px;border:1px solid var(--ff-border,rgba(255,255,255,.12))}.ff-v2-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ff-v2-col{padding:6px 7px;border-radius:6px;background:rgba(127,127,127,.06)}.ff-v2-label{font-size:8px;text-transform:uppercase;letter-spacing:.05em;opacity:.58}.ff-v2-value{font-size:11px;font-weight:800;margin-top:2px}.ff-v2-note{margin-top:5px;opacity:.64}.ff-v2-flip{color:var(--ff-bad,#e68686);font-weight:800}.ff-v2-agree{color:var(--ff-good,#5fc88d);font-weight:800}.ff-trend-cell-v2{display:block;font-size:8px;font-weight:650;opacity:.68;margin-top:2px;white-space:nowrap}@media(max-width:600px){.ff-v2-grid{grid-template-columns:1fr}}
</style>
<script id="ats-trends-v2-ui-script">
(function(){
 const D=()=>window.ATS_TRENDS_V2_PUBLIC||{};
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const fmtSide=(g,team)=>team==='NO EDGE'?'No edge':team;
 function byGame(){return Object.fromEntries((D().games||[]).map(g=>[g.game,g]));}
 function injectCards(){const map=byGame();document.querySelectorAll('#spreadScorecard .ff-game').forEach(card=>{if(card.querySelector('.ff-v2-compare'))return;const rank=card.querySelector('.ff-rank')?.textContent||'';const game=rank.split('·').slice(1).join('·').trim();const r=map[game];if(!r)return;const factors=card.querySelectorAll('.ff-factor');const trend=factors[1];if(!trend)return;const v1=r.v1||{},v2=r.v2||{},same=r.comparison==='AGREE',neutral=r.comparison==='NEUTRAL_INVOLVED';const status=neutral?'Neutral involved':same?'Agrees with v1':'Side flip';const cls=same?'ff-v2-agree':neutral?'':'ff-v2-flip';trend.querySelector('.ff-factor-text')?.insertAdjacentHTML('beforeend',`<div class="ff-v2-compare"><div class="ff-v2-head"><span class="ff-v2-title">ATS Trends methodology check</span><span class="ff-v2-badge">v2 preferred challenger</span></div><div class="ff-v2-grid"><div class="ff-v2-col"><div class="ff-v2-label">v1 · locked official Week 4 factor</div><div class="ff-v2-value">${esc(fmtSide(r,v1.lean))} · ${esc(v1.scores?.away)}-${esc(v1.scores?.home)}</div></div><div class="ff-v2-col"><div class="ff-v2-label">v2 · cover-margin challenger</div><div class="ff-v2-value">${esc(fmtSide(r,v2.leanTeam))} · ${esc(v2.scores?.away)}-${esc(v2.scores?.home)}</div></div></div><div class="ff-v2-note ${cls}">${esc(status)}. v2 uses 45% current-season cover margin, 40% non-overlapping prior form, and 15% H2H; it does not change this game's official five-factor grade.</div></div>`);});}
 function injectTable(){const map=byGame();document.querySelectorAll('#spreadScorecard .ff-row:not(.ff-th)').forEach(row=>{if(row.querySelector('.ff-trend-cell-v2'))return;const game=row.querySelector('.ff-game-id')?.textContent?.trim();const r=map[game];if(!r)return;const cells=row.children;if(cells.length<6)return;const c=cells[5];const v2=r.v2||{};c.insertAdjacentHTML('beforeend',`<span class="ff-trend-cell-v2">v2: ${esc(v2.leanTeam||'NO EDGE')} ${esc(v2.scores?.away)}-${esc(v2.scores?.home)}</span>`);});}
 function injectMethod(){const page=document.querySelector('#spreadScorecard .ff-page');if(!page||page.querySelector('.ff-v2-method-note'))return;const method=page.querySelector('.ff-method');if(!method)return;method.insertAdjacentHTML('beforeend','<div class="ff-v2-method-note" style="margin-top:8px"><b>ATS Trends v2:</b> shown beside the locked v1 factor as a preferred challenger only. Week 4 predictions are frozen prospectively; promotion requires multi-week evidence, not one slate.</div>');}
 function run(){if(!document.getElementById('spreadScorecard'))return;injectCards();injectTable();injectMethod();}
 const obs=new MutationObserver(run);obs.observe(document.documentElement,{subtree:true,childList:true});document.addEventListener('click',()=>setTimeout(run,0));window.addEventListener('popstate',()=>setTimeout(run,0));setTimeout(run,0);setTimeout(run,500);
})();
</script>
