<style id="ats-trends-v2-ui-style">
.ff-v12-board{margin:16px 0}.ff-v12-summary{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ff-v12-panel{padding:13px 14px;background:var(--ff-surface,rgba(255,255,255,.04));border:1px solid var(--ff-border,rgba(255,255,255,.12));border-radius:var(--ff-radius,12px)}.ff-v12-kicker{font-size:9px;text-transform:uppercase;letter-spacing:.06em;opacity:.58}.ff-v12-title{font-size:15px;font-weight:850;margin:3px 0 8px}.ff-v12-pick{display:grid;grid-template-columns:24px 1fr auto;gap:7px;align-items:center;padding:7px 0;border-top:1px solid var(--ff-border,rgba(255,255,255,.08));font-size:11px}.ff-v12-pick:first-of-type{border-top:0}.ff-v12-rank{opacity:.5}.ff-v12-team{font-weight:800}.ff-v12-edge{font-weight:800;opacity:.72}.ff-v12-split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.ff-v12-tag{display:inline-flex;align-items:center;gap:5px;font-size:9px;font-weight:800;padding:3px 7px;border-radius:999px;border:1px solid var(--ff-border,rgba(255,255,255,.12));margin:2px 4px 2px 0}.ff-v12-agree{color:var(--ff-good,#5fc88d)}.ff-v12-diff{color:var(--ff-bad,#e68686)}.ff-v12-neutral{opacity:.68}.ff-v12-mini{display:block;font-size:8px;line-height:1.35;opacity:.68;margin-top:3px}.ff-v12-cell{display:grid;grid-template-columns:1fr 1fr;gap:3px;font-size:8px;line-height:1.25}.ff-v12-cell b{font-size:9px}.ff-v12-trendrow .ff-factor-text{opacity:1}.ff-v12-factorgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ff-v12-factorcol{padding:8px;border-radius:7px;background:var(--ff-soft,rgba(255,255,255,.035));border:1px solid var(--ff-border,rgba(255,255,255,.08))}.ff-v12-factorlabel{font-size:8px;text-transform:uppercase;letter-spacing:.05em;opacity:.6}.ff-v12-factorpick{font-size:12px;font-weight:850;margin:3px 0}.ff-v12-factordetail{font-size:9px;line-height:1.4;opacity:.72}.ff-v12-status{margin-top:6px;font-size:9px;font-weight:800}.ff-v12-topnote{margin-top:6px;font-size:9px;opacity:.7}.ff-v12-method{margin-top:8px}.ff-v12-sourcewarn{margin-top:5px;font-size:8px;opacity:.62}
@media(max-width:700px){.ff-v12-summary,.ff-v12-split,.ff-v12-factorgrid{grid-template-columns:1fr}.ff-v12-cell{grid-template-columns:1fr}.ff-v12-pick{grid-template-columns:20px 1fr auto}}
</style>
<script id="ats-trends-v2-ui-script">
(function(){
 const D=()=>window.ATS_TRENDS_V2_PUBLIC||{}, esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const spread=(r,t)=>{if(!t||t==='NO EDGE')return 'No edge';const n=t===r.away?r.slyAway:-r.slyAway;return `${t} ${n>0?'+':''}${n}`};
 const gameMap=()=>Object.fromEntries((D().games||[]).map(x=>[x.game,x]));
 const strength=(x,v)=>Math.abs((x[v]?.scores?.away??10)-(x[v]?.scores?.home??10));
 const lean=(x,v)=>v==='v1'?(x.v1?.lean||'NO EDGE'):(x.v2?.leanTeam||'NO EDGE');
 function top(v){return [...(D().games||[])].filter(x=>lean(x,v)!=='NO EDGE').sort((a,b)=>strength(b,v)-strength(a,v)||Math.max(b[v].scores.away,b[v].scores.home)-Math.max(a[v].scores.away,a[v].scores.home)||a.game.localeCompare(b.game)).slice(0,5);}
 function topPanel(v){const is2=v==='v2',rows=top(v).map((r,i)=>`<div class="ff-v12-pick"><span class="ff-v12-rank">${i+1}</span><span><span class="ff-v12-team">${esc(spread(r,lean(r,v)))}</span><span class="ff-v12-mini">${esc(r.game)}</span></span><span class="ff-v12-edge">${strength(r,v)} pt edge</span></div>`).join('');return `<div class="ff-v12-panel"><div class="ff-v12-kicker">${is2?'Preferred challenger':'Locked Week 4 baseline'}</div><div class="ff-v12-title">ATS Trends ${is2?'v2':'v1'} · Top 5</div>${rows}</div>`;}
 function board(){const page=document.querySelector('#spreadScorecard .ff-page');if(!page||page.querySelector('.ff-v12-board')||!(D().games||[]).length)return;const note=page.querySelector('.ff-note'),agree=D().games.filter(x=>x.comparison==='AGREE'),diff=D().games.filter(x=>x.comparison==='DISAGREE'),neutral=D().games.filter(x=>x.comparison==='NEUTRAL_INVOLVED');const tags=a=>a.map(x=>`<span class="ff-v12-tag">${esc(x.game)} · ${esc(spread(x,lean(x,'v1')))}</span>`).join('');const difftags=diff.map(x=>`<span class="ff-v12-tag ff-v12-diff">${esc(x.game)} · v1 ${esc(spread(x,lean(x,'v1')))} → v2 ${esc(spread(x,lean(x,'v2')))}</span>`).join('');const neutraltags=neutral.map(x=>`<span class="ff-v12-tag ff-v12-neutral">${esc(x.game)} · v1 ${esc(spread(x,lean(x,'v1')))} · v2 ${esc(spread(x,lean(x,'v2')))}</span>`).join('');const html=`<section class="ff-v12-board"><h2 class="ff-section">ATS Trends v1 vs v2</h2><div class="ff-v12-summary">${topPanel('v1')}${topPanel('v2')}</div><div class="ff-v12-split"><div class="ff-v12-panel"><div class="ff-v12-kicker">Consensus · ${agree.length} games</div><div class="ff-v12-title">Same side in both versions</div><div class="ff-v12-agree">${tags(agree)}</div></div><div class="ff-v12-panel"><div class="ff-v12-kicker">Differences · ${diff.length} flips + ${neutral.length} neutral changes</div><div class="ff-v12-title">Where methodology changes the answer</div>${difftags}${neutraltags}</div></div><div class="ff-v12-topnote">v1 remains the locked Week 4 factor used in the official 100-point score. v2 is the preferred challenger and is being tracked prospectively.</div></section>`;note?.insertAdjacentHTML('afterend',html);}
 function topCards(){const m=gameMap();document.querySelectorAll('#spreadScorecard .ff-top-card').forEach(card=>{if(card.querySelector('.ff-v12-topnote'))return;const game=card.querySelector('.ff-rank')?.textContent?.split('·').slice(1).join('·').trim(),r=m[game];if(!r)return;card.insertAdjacentHTML('beforeend',`<div class="ff-v12-topnote"><b>ATS:</b> v1 ${esc(spread(r,lean(r,'v1')))} · v2 ${esc(spread(r,lean(r,'v2')))} ${r.comparison==='AGREE'?'<span class="ff-v12-agree">· consensus</span>':r.comparison==='DISAGREE'?'<span class="ff-v12-diff">· differs</span>':'· neutral change'}</div>`);});}
 function table(){const m=gameMap();document.querySelectorAll('#spreadScorecard .ff-row:not(.ff-th)').forEach(row=>{const game=row.querySelector('.ff-game-id')?.textContent?.trim(),r=m[game];if(!r||row.children.length<6)return;const c=row.children[5];c.innerHTML=`<div class="ff-v12-cell"><span><b>v1</b><br>${esc(lean(r,'v1'))}<br>${esc(r.v1.scores.away)}-${esc(r.v1.scores.home)}</span><span><b>v2</b><br>${esc(lean(r,'v2'))}<br>${esc(r.v2.scores.away)}-${esc(r.v2.scores.home)}</span></div>`;});}
 function cards(){const m=gameMap();document.querySelectorAll('#spreadScorecard .ff-game').forEach(card=>{const game=card.querySelector('.ff-rank')?.textContent?.split('·').slice(1).join('·').trim(),r=m[game];if(!r)return;const factors=card.querySelectorAll('.ff-factor'),trend=factors[1];if(!trend||trend.classList.contains('ff-v12-trendrow'))return;trend.classList.add('ff-v12-trendrow');const text=trend.querySelector('.ff-factor-text');const status=r.comparison==='AGREE'?'<span class="ff-v12-agree">CONSENSUS</span>':r.comparison==='DISAGREE'?'<span class="ff-v12-diff">DIFFERENT SIDES</span>':'<span class="ff-v12-neutral">NEUTRAL CHANGE</span>';const sm=r.sourceAlignment||{},warn=[sm.away,sm.home].filter(x=>x&&!x.matchesV1SeasonRecord).map(x=>x.team);text.innerHTML=`<div class="ff-v12-factorgrid"><div class="ff-v12-factorcol"><div class="ff-v12-factorlabel">v1 · locked official factor</div><div class="ff-v12-factorpick">${esc(spread(r,lean(r,'v1')))} · ${esc(r.v1.scores.away)}-${esc(r.v1.scores.home)}</div><div class="ff-v12-factordetail">Binary ATS record blend with heavier H2H influence. This is still the score feeding the official five-factor grade.</div></div><div class="ff-v12-factorcol"><div class="ff-v12-factorlabel">v2 · preferred challenger</div><div class="ff-v12-factorpick">${esc(spread(r,lean(r,'v2')))} · ${esc(r.v2.scores.away)}-${esc(r.v2.scores.home)}</div><div class="ff-v12-factordetail">45% current-season cover margin · 40% non-overlapping prior form · 15% H2H. Actual margin versus spread, with small-sample shrinkage.</div></div></div><div class="ff-v12-status">${status}</div>${warn.length?`<div class="ff-v12-sourcewarn">Source-line definition differs from v1 season record for: ${esc(warn.join(', '))}.</div>`:''}`;});}
 function method(){const x=document.querySelector('#spreadScorecard .ff-method');if(!x||x.querySelector('.ff-v12-method'))return;x.insertAdjacentHTML('beforeend','<div class="ff-v12-method"><b>ATS Trends comparison:</b> v1 and v2 are shown together everywhere ATS Trends appears. v1 remains frozen for Week 4 audit integrity; v2 is the preferred challenger until multi-week prospective evidence supports promotion.</div>');}
 function run(){if(!document.getElementById('spreadScorecard'))return;board();topCards();table();cards();method();}
 const obs=new MutationObserver(()=>run());obs.observe(document.documentElement,{subtree:true,childList:true});document.addEventListener('click',()=>setTimeout(run,0));window.addEventListener('popstate',()=>setTimeout(run,0));setTimeout(run,0);setTimeout(run,500);
})();
</script>
