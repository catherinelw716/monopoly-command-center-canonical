<style id="week4-sportsline-style">
.sl-banner{margin:10px 0;padding:11px 12px;border:1px solid rgba(56,189,248,.28);background:rgba(56,189,248,.07);border-radius:12px;font-size:10px;line-height:1.5}.sl-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}.sl-card{padding:10px;border:1px solid rgba(148,163,184,.16);border-radius:10px;background:rgba(15,23,42,.28)}.sl-card small{display:block;color:#94a3b8;font-size:8px;text-transform:uppercase}.sl-card b{display:block;margin-top:3px;font-size:11px}.sl-note{font-size:10px;color:#a7bac9;line-height:1.5}.src-sub{display:block;color:#94a3b8;font-size:9px;line-height:1.35;margin-top:3px}
@media(max-width:760px){.sl-grid{grid-template-columns:1fr}.source-table{min-width:1040px!important}}
</style>
<script id="week4-sportsline-layer">
(function(){
 const META=window.WEEK4_CURRENT_META||{};
 const G=window.WEEK4_CURRENT_PUBLIC||[];
 const S=window.WEEK4_SOURCE_PUBLIC||[];
 const byGame=Object.fromEntries(G.map(g=>[g.game,g]));
 const money=n=>'$'+Number(n||0).toLocaleString();
 const sum=arr=>(arr||[]).reduce((a,x)=>a+Number(x.amount||0),0);
 function activate(view){try{if(typeof window.switchView==='function'){window.switchView(view);return;}}catch(e){}document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===view));window.scrollTo(0,0);}
 function ensureAnalysisNav(){for(const nav of [document.querySelector('.primary-nav'),document.querySelector('.mobile-nav')]){if(!nav||nav.querySelector('[data-view="analysis"]'))continue;const b=document.createElement('button');if(nav.classList.contains('primary-nav'))b.className='nav-btn';b.dataset.view='analysis';b.textContent='Analysis';b.onclick=()=>activate('analysis');const before=nav.querySelector('[data-view="games"]');before?nav.insertBefore(b,before):nav.appendChild(b);}}
 function moneyText(sl){const x=sl?.moneyPct||{};return Object.entries(x).map(([t,p])=>t+' '+p+'%').join(' · ')||'—';}
 function simPctText(sl){if(!sl?.simPct)return 'Not publicly exposed';const q=sl.simPct.qualifier==='approximately'?'≈':'';return q+sl.simPct.cover_pct+'% '+sl.simPct.team+' cover';}
 function gridText(g){const ga=g?.gridiron;if(!ga)return '—';return ga.bestSide==='NO TAKE'?'50/50':ga.grade+' · '+ga.bestSide+' '+ga.bestPct+'%';}
 function updateToday(){
   const t=document.getElementById('today');if(!t)return;
   let b=document.getElementById('slCurrentBanner');if(!b){b=document.createElement('div');b.id='slCurrentBanner';b.className='sl-banner';(t.querySelector('.panel')||t).prepend(b);}
   b.innerHTML='<b>'+META.snapshot_label+'</b><br>Current Action market, official NFL injury statuses, weather, SportsLine screenshot data and Gridiron screenshot data are reconciled into one Week 4 state. Sly lines remain immutable.';
   const p=META.working_portfolio||{};const ks=[...t.querySelectorAll('.kpi')];const top=G.slice(0,4).map(x=>x.lean).join(' / ');
   const vals=[['Catherine','$10,800','#28 · working outlay '+money(sum(p.Catherine))],['Amanda','$8,700','#65 · working outlay '+money(sum(p.Amanda))],['Household','$19,500',money(p.household_outlay)+' working outlay'],['Top board',top,'Latest reconciled Week 4 ranking']];
   ks.slice(0,4).forEach((k,i)=>{const v=vals[i];if(!v)return;const sm=k.querySelector('small'),bb=k.querySelector('b'),sp=k.querySelector('span');if(sm)sm.textContent=v[0];if(bb)bb.textContent=v[1];if(sp)sp.textContent=v[2];});
   const alerts=t.querySelector('.alerts');if(alerts){alerts.innerHTML=G.slice(0,4).map((g,i)=>'<div class="alert '+(i<3?'green':'yellow')+'"><span class="dot"></span><div><b>#'+g.rank+' '+g.lean+' · '+g.decision+'</b><br>'+g.whyPlay+'</div></div>').join('');}
 }
 function updatePortfolio(){
   const p=document.getElementById('portfolio');if(!p)return;const meta=META.working_portfolio||{};const first=p.querySelector('.section-head + .panel')||p.querySelector('.panel');
   if(first){const e=first.querySelector('.eyebrow');if(e)e.textContent='Week 4 Saturday · full source reconciliation';const b=first.querySelector('b');if(b)b.textContent='Household working outlay: '+money(meta.household_outlay);const para=first.querySelector('p');if(para)para.textContent='Working portfolio after the latest market, SportsLine, Gridiron, official injury and weather reconciliation. It remains provisional until PRE_KICK_FINAL.';}
   const cards=[...p.querySelectorAll('.portfolio-grid .entry-card')];for(const [i,name] of ['Catherine','Amanda'].entries()){const card=cards[i],arr=meta[name]||[];if(!card)continue;const eye=card.querySelector('.eyebrow');if(eye)eye.textContent=name+' · '+(name==='Catherine'?'#28 · $10,800':'#65 · $8,700');const h=card.querySelector('h3');if(h)h.textContent=money(sum(arr))+' · '+arr.length+' games';const list=card.querySelector('.wager-list');if(list)list.innerHTML=arr.map(x=>'<div class="wager"><b>'+x.pick+'</b><span>'+money(x.amount)+' · '+x.role+'</span></div>').join('');}
 }
 function renderSources(){
   const tbody=document.getElementById('sourceCompareBody');if(!tbody)return;
   tbody.innerHTML=S.map(d=>'<tr>'+[
    '<td><b>'+d.game+'</b><span class="src-sub">'+d.time+' · Sly '+d.sly+' · market '+d.current+'</span></td>',
    '<td><b>'+d.ourPick+'</b><span class="src-sub">#'+d.ourRank+' · '+d.ourGrade+' · '+d.ourState+'</span></td>',
    '<td><b>'+(d.sportsPick||'—')+'</b><span class="src-sub">'+d.sportsGrade+' · '+d.sportsType+' · spread '+d.sportsCurrent+'<br>Money: '+d.sportsMoney+'<br>SIM %: '+d.sportsSimPct+'</span></td>',
    '<td><b><span class="gridiron-grade gridiron-grade-'+String(d.gridGrade||'N').toLowerCase()+'">'+(d.gridGrade||'N')+'</span> '+(d.gridPick||'—')+'</b><span class="src-sub">Gridiron '+d.gridLine+' · '+d.gridOther+'</span></td>',
    '<td><b>—</b><span class="src-sub">Week 4 Lucas pick not supplied/verified</span></td>',
    '<td><b>'+d.agreement+'</b><span class="src-sub">Source-specific lines retained; non-ATS SportsLine SIMs are not ATS votes.</span></td>'
   ].join('')+'</tr>').join('');
   const th=document.querySelector('#sourceCompare .source-table thead tr');if(th)th.innerHTML='<th>Game</th><th>Our Decision</th><th>SportsLine · spread / money / SIM</th><th>Gridiron · grade / cover %</th><th>Lucas</th><th>Cross-source read</th>';document.querySelectorAll('[data-source-view="compare"]').forEach(b=>b.textContent='All Sources');
 }
 function updateAnalysis(){
   let s=document.getElementById('analysis');if(!s){s=document.createElement('section');s.id='analysis';s.className='view';const lab=document.getElementById('lab');lab?.parentNode?.insertBefore(s,lab);}
   const top=G.slice(0,8).map(g=>'<div class="sl-card"><small>#'+g.rank+' · '+g.decision+'</small><b>'+g.lean+'</b><p class="sl-note">'+g.whyPlay+'</p><p class="sl-note"><b>Gridiron:</b> '+gridText(g)+' · <b>SportsLine:</b> '+(g.sportsline?.grade||'—')+' '+(g.sportsline?.visiblePick||'—')+'</p></div>').join('');
   s.innerHTML='<div class="panel"><div class="eyebrow">Full reconciliation · '+META.snapshot_label+'</div><h2>Overall Analysis</h2><p>The ranking below is generated from the current normalized Week 4 state. Market-price value, SportsLine evidence, Gridiron probabilities, official injuries and weather are displayed separately so one source cannot silently overwrite another.</p><div class="sl-grid">'+top+'</div></div><div class="panel" style="margin-top:12px"><h3>Current contradictions to keep visible</h3><p><b>DAL/HOU:</b> SportsLine backs Houston while Gridiron prefers Dallas at a shorter number. <b>JAX/CIN:</b> SportsLine backs Jacksonville while Gridiron slightly prefers Cincinnati. <b>NE/BUF:</b> Sly gives New England the key +7 versus Action +6.5, but Gridiron and the Patriots injury report push the other way. <b>MIN:</b> SportsLine A is at -9.5, one point better than Sly -10.5.</p></div>';
 }
 function updateLab(){const lab=document.getElementById('lab');if(!lab)return;let p=document.getElementById('slLab');if(!p){p=document.createElement('div');p.id='slLab';p.className='panel';lab.querySelector('.section-head')?.insertAdjacentElement('afterend',p);}p.innerHTML='<div class="eyebrow">Current provenance · '+META.snapshot_label+'</div><h3>Normalized Week 4 source state</h3><p class="sl-note">Sly freeze is immutable. Action current market/weather is timestamped at 5:10 PM ET. Official NFL injury statuses are from the Oct 3 Week 4 report. SportsLine spread/money/SIM metadata is from the user-provided 4:11 PM screenshots. Gridiron spread/cover probabilities are from the user-provided Week 4 screenshot. Lucas remains unavailable rather than inferred.</p>';}
 function addGameRead(){
   const id=new URLSearchParams(location.search).get('game');if(!id)return;document.getElementById('slGameRead')?.remove();const hero=document.getElementById('gameHero');const x=byGame[id];if(!hero||!x)return;const sl=x.sportsline||{},ga=x.gridiron||{};const box=document.createElement('div');box.id='slGameRead';box.className='panel';box.style.margin='12px 0';
   box.innerHTML='<div class="eyebrow">Latest source snapshot · '+META.snapshot_label+'</div><h3>'+id+' · '+x.lean+'</h3><div class="sl-grid">'+
    '<div><small>SportsLine spread</small><b>'+(sl.currentPrice||'—')+'</b><p class="sl-note">Open '+(sl.openPrice||'—')+' · Money '+moneyText(sl)+'</p></div>'+
    '<div><small>SportsLine SIM %</small><b>'+simPctText(sl)+'</b><p class="sl-note">Visible SIM '+(sl.grade||'—')+' · '+(sl.visiblePick||'—')+' ('+(sl.kind||'—')+')</p></div>'+
    '<div><small>Gridiron</small><b>'+gridText(x)+'</b><p class="sl-note">Reference '+(ga.line||'—')+' · '+(ga.away||'')+' '+(ga.awayPct??'—')+'% / '+(ga.home||'')+' '+(ga.homePct??'—')+'%</p></div>'+
    '<div><small>Current market</small><b>'+(x.current||'—')+'</b><p class="sl-note">'+(x.marketNote||'')+'</p></div>'+
    '<div><small>Weather</small><b>'+(x.weather||'—')+'</b><p class="sl-note">Context only; not folded into frozen V2.</p></div>'+
    '<div><small>Decision</small><b>'+x.decision+' · '+x.lean+'</b><p class="sl-note">'+x.whyPlay+'</p></div></div>'+
    '<p class="sl-note"><b>Latest injuries:</b> '+(x.news?.[0]?.detail||'—')+'</p><p class="sl-note"><b>Main risk:</b> '+x.against+'</p>';
   hero.insertAdjacentElement('afterend',box);
 }
 function apply(){ensureAnalysisNav();updateToday();updatePortfolio();renderSources();updateAnalysis();updateLab();addGameRead();window.week4SourceQA={version:META.version,householdOutlay:META.working_portfolio?.household_outlay,top:G.slice(0,8).map(x=>x.lean),sourceRows:S.length};}
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(apply,250));else setTimeout(apply,250);[800,1500,2400].forEach(ms=>setTimeout(apply,ms));document.addEventListener('click',e=>{if(e.target.closest('[data-view],[data-source-view],[data-game],button'))setTimeout(apply,180);},true);
})();
</script>
