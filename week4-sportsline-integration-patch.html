<style id="week4-sportsline-style">
.sl-banner{margin:10px 0;padding:11px 12px;border:1px solid rgba(56,189,248,.28);background:rgba(56,189,248,.07);border-radius:12px;font-size:10px;line-height:1.5}.sl-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}.sl-card{padding:10px;border:1px solid rgba(148,163,184,.16);border-radius:10px;background:rgba(15,23,42,.28)}.sl-card small{display:block;color:#94a3b8;font-size:8px;text-transform:uppercase}.sl-card b{display:block;margin-top:3px;font-size:11px}.sl-note{font-size:10px;color:#a7bac9;line-height:1.5}
@media(max-width:760px){.sl-grid{grid-template-columns:1fr}.source-table{min-width:920px!important}}
</style>
<script id="week4-sportsline-layer">
(function(){
 const META=window.WEEK4_CURRENT_META||{};
 const G=window.WEEK4_CURRENT_PUBLIC||[];
 const S=window.WEEK4_SOURCE_PUBLIC||[];
 const byGame=Object.fromEntries(G.map(g=>[g.game,g]));
 function money(n){return '$'+Number(n||0).toLocaleString();}
 function activate(view){try{if(typeof window.switchView==='function'){window.switchView(view);return;}}catch(e){}document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===view));window.scrollTo(0,0);}
 function ensureAnalysisNav(){for(const nav of [document.querySelector('.primary-nav'),document.querySelector('.mobile-nav')]){if(!nav||nav.querySelector('[data-view="analysis"]'))continue;const b=document.createElement('button');if(nav.classList.contains('primary-nav'))b.className='nav-btn';b.dataset.view='analysis';b.textContent='Analysis';b.onclick=()=>activate('analysis');const before=nav.querySelector('[data-view="games"]');before?nav.insertBefore(b,before):nav.appendChild(b);}}
 function updateToday(){const t=document.getElementById('today');if(!t)return;let b=document.getElementById('slCurrentBanner');if(!b){b=document.createElement('div');b.id='slCurrentBanner';b.className='sl-banner';(t.querySelector('.panel')||t).prepend(b);}b.innerHTML='<b>'+META.snapshot_label+'</b><br>User-provided SportsLine full-slate screenshots are now reconciled with the existing Action/DraftKings market layer. SportsLine spread, total, projected score, SIM grade/pick, and pick-count metadata are preserved source-by-source rather than overwriting canonical Sly lines.';
 const p=META.working_portfolio||{};const ks=[...t.querySelectorAll('.kpi')];const vals=[['Catherine','$10,800','#28 · working outlay '+money((p.Catherine||[]).reduce((a,x)=>a+x.amount,0))],['Amanda','$8,700','#65 · working outlay '+money((p.Amanda||[]).reduce((a,x)=>a+x.amount,0))],['Household','$19,500',money(p.household_outlay)+' working outlay'],['Top board','DEN / SEA / IND','Then JAX / HOU · SportsLine reconciled']];ks.slice(0,4).forEach((k,i)=>{const v=vals[i];if(!v)return;const sm=k.querySelector('small'),bb=k.querySelector('b'),sp=k.querySelector('span');if(sm)sm.textContent=v[0];if(bb)bb.textContent=v[1];if(sp)sp.textContent=v[2];});
 const alerts=t.querySelector('.alerts');if(alerts)alerts.innerHTML='<div class="alert green"><span class="dot"></span><div><b>DEN +3 remains the cleanest price-value play.</b><br>SportsLine is SF -2.5, matching the current -2.5 market reference and leaving Sly +3 through the key number.</div></div><div class="alert green"><span class="dot"></span><div><b>SEA -7 remains a football-model play.</b><br>SportsLine SIM explicitly selects SEA -7 (B) at the same line as Sly.</div></div><div class="alert yellow"><span class="dot"></span><div><b>IND -3.5 improved as a source-sensitive value.</b><br>SportsLine is IND -4.5 while Sly remains -3.5; Action/DK have been shorter, so this is meaningful but not broad-market unanimous.</div></div><div class="alert yellow"><span class="dot"></span><div><b>NYG and NE were downgraded.</b><br>The screenshots do not show a SportsLine ATS pick on either game; NYG SIM is the total and NE SIM is moneyline. SportsLine also has BUF -7, equal to Sly.</div></div>';
 }
 function updatePortfolio(){const p=document.getElementById('portfolio');if(!p)return;const meta=META.working_portfolio||{};const first=p.querySelector('.section-head + .panel')||p.querySelector('.panel');if(first){const e=first.querySelector('.eyebrow');if(e)e.textContent='Week 4 Saturday · SportsLine full-slate reconciliation';const b=first.querySelector('b');if(b)b.textContent='Household working outlay: '+money(meta.household_outlay);const para=first.querySelector('p');if(para)para.textContent='Working portfolio after reconciling SportsLine with Sly, Action/DraftKings, frozen V2 price value, and football-context evidence. It remains provisional until PRE_KICK_FINAL.';}
 const cards=[...p.querySelectorAll('.portfolio-grid .entry-card')];for(const [i,name] of ['Catherine','Amanda'].entries()){const card=cards[i],arr=meta[name]||[];if(!card)continue;const eye=card.querySelector('.eyebrow');if(eye)eye.textContent=name+' · '+(name==='Catherine'?'#28 · $10,800':'#65 · $8,700');const h=card.querySelector('h3');if(h)h.textContent=money(arr.reduce((a,x)=>a+x.amount,0))+' · '+arr.length+' games';const list=card.querySelector('.wager-list');if(list)list.innerHTML=arr.map(x=>'<div class="wager"><b>'+x.pick+'</b><span>'+money(x.amount)+' · '+x.role+'</span></div>').join('');}}
 }
 function renderSources(){const tbody=document.getElementById('sourceCompareBody');if(!tbody)return;tbody.innerHTML=S.map(d=>{const ats=d.sportsType==='Spread';const sports=(d.sportsPick&&d.sportsPick!=='—')?d.sportsPick:'—';const sub=(d.sportsGrade&&d.sportsGrade!=='—'?d.sportsGrade+' · ':'')+(d.sportsType||'Unavailable')+(d.sportsCurrent&&d.sportsCurrent!=='—'?' · current '+d.sportsCurrent:'')+(d.sportsPickCount?' · '+d.sportsPickCount+' SportsLine picks':'');return '<tr><td><b>'+d.game+'</b><span class="src-sub">'+d.time+' · Sly '+d.sly+'</span></td><td><b>'+d.ourPick+'</b><span class="src-sub">#'+d.ourRank+' · '+d.ourGrade+' · '+d.ourState+'</span></td><td><b>'+sports+'</b><span class="src-sub">'+sub+(ats?' · verified ATS SIM':' · non-ATS SIM')+'</span></td><td><b>—</b><span class="src-sub">Week 4 Gridiron ATS set not verified</span></td><td><b>—</b><span class="src-sub">Week 4 Lucas pick not supplied/verified</span></td><td><b>'+d.agreement+'</b><span class="src-sub">Spread SIM counts as ATS evidence; total/ML does not</span></td></tr>';}).join('');const th=document.querySelector('#sourceCompare .source-table thead tr');if(th)th.innerHTML='<th>Game</th><th>Our Decision</th><th>SportsLine SIM / Current</th><th>Gridiron AI</th><th>Lucas</th><th>Cross-source read</th>';document.querySelectorAll('[data-source-view="compare"]').forEach(b=>b.textContent='All 4 Sources');}
 function updateAnalysis(){let s=document.getElementById('analysis');if(!s){s=document.createElement('section');s.id='analysis';s.className='view';const lab=document.getElementById('lab');lab?.parentNode?.insertBefore(s,lab);}s.innerHTML='<div class="panel"><div class="eyebrow">SportsLine reconciliation · Oct 3 · 4:11 PM ET</div><h2>Overall Analysis</h2><p>The new SportsLine screenshots materially change the evidence map. The most important correction is that the prior NYG ATS attribution was wrong: the visible SportsLine SIM selection is <b>Over 44.5</b>, not NYG +2.5. NE is also a moneyline SIM, not an ATS pick. We now count only actual spread SIM selections as SportsLine ATS evidence.</p><div class="sl-grid"><div class="sl-card"><small>#1</small><b>DEN +3 · core price edge</b><p class="sl-note">SportsLine SF -2.5 confirms the current market reference; Sly keeps +3.</p></div><div class="sl-card"><small>#2</small><b>SEA -7 · SportsLine B spread</b><p class="sl-note">Exact Sly line and explicit SportsLine spread SIM support.</p></div><div class="sl-card"><small>#3</small><b>IND -3.5 · source-sensitive value</b><p class="sl-note">SportsLine IND -4.5 gives Sly a full point; not unanimous across other books.</p></div><div class="sl-card"><small>#4</small><b>JAX +2.5 · SportsLine B spread</b><p class="sl-note">SportsLine SIM explicitly takes JAX +2.5 at the exact Sly number.</p></div><div class="sl-card"><small>#5</small><b>HOU -3 · SportsLine B spread</b><p class="sl-note">No Sly price edge, but SportsLine SIM explicitly backs HOU -3.</p></div><div class="sl-card"><small>#6</small><b>KC -4.5 · SportsLine B spread</b><p class="sl-note">Exact-line football-model support; kept below the stronger plays.</p></div></div></div><div class="panel" style="margin-top:12px"><h3>Important conflicts</h3><p><b>NE +7:</b> SportsLine current is BUF -7, so Sly is market-equal there; injury concerns remain. <b>GB -3.5:</b> SportsLine is only GB -3 and its SIM likes TB moneyline, so the prior small GB position is removed. <b>MIN -10.5:</b> SportsLine SIM likes MIN -9.5 with an A grade, but Sly asks us to lay an extra point, so we do not automatically transfer that pick to -10.5.</p></div>';}
 function updateLab(){const lab=document.getElementById('lab');if(!lab)return;let p=document.getElementById('slLab');if(!p){p=document.createElement('div');p.id='slLab';p.className='panel';lab.querySelector('.section-head')?.insertAdjacentElement('afterend',p);}p.innerHTML='<div class="eyebrow">Source provenance · Oct 3 · 4:11 PM ET</div><h3>SportsLine full slate is now captured from screenshots</h3><p class="sl-note">For each game we preserve SportsLine projected score, open/current spread, open/current total, visible SIM grade and pick, and the displayed SportsLine-pick count. We do not infer the hidden picks behind the count. Only a visible spread SIM is treated as an ATS signal.</p>';}
 function addGameRead(){const id=new URLSearchParams(location.search).get('game');if(!id)return;document.getElementById('slGameRead')?.remove();const hero=document.getElementById('gameHero');const x=byGame[id];if(!hero||!x)return;const sl=x.sportsline||{};const box=document.createElement('div');box.id='slGameRead';box.className='panel';box.style.margin='12px 0';box.innerHTML='<div class="eyebrow">Latest SportsLine snapshot · Oct 3 · 4:11 PM ET</div><h3>'+id+' · '+x.lean+'</h3><div class="sl-grid"><div><small>SportsLine market</small><b>'+(sl.openPrice||'—')+' → '+(sl.currentPrice||'—')+'</b><p class="sl-note">Total '+(sl.openTotal??'—')+' → '+(sl.currentTotal??'—')+'</p></div><div><small>SportsLine SIM</small><b>'+(sl.grade||'—')+' · '+(sl.visiblePick||sl.side||'—')+'</b><p class="sl-note">'+(sl.kind||'—')+' · '+(sl.pickCount||0)+' SportsLine picks shown</p></div><div><small>Projected score</small><b>'+(sl.projectedScore||'—')+'</b><p class="sl-note">Only visible spread SIMs count as ATS evidence.</p></div></div><p class="sl-note"><b>Decision:</b> '+x.decision+' · '+x.whyPlay+'</p><p class="sl-note"><b>Main risk:</b> '+x.risk+'</p>';hero.insertAdjacentElement('afterend',box);}
 function apply(){ensureAnalysisNav();updateToday();updatePortfolio();renderSources();updateAnalysis();updateLab();addGameRead();window.week4SportsLineQA={version:META.version,householdOutlay:META.working_portfolio?.household_outlay,top:G.slice(0,6).map(x=>x.lean),sportsLineGames:S.length};}
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(apply,300));else setTimeout(apply,300);setTimeout(apply,1000);document.addEventListener('click',e=>{if(e.target.closest('[data-view],[data-source-view],[data-game]'))setTimeout(apply,250);},true);
})();
</script>
