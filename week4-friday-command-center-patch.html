  let top=document.getElementById('week4StandingsOverlay');if(top)top.remove();top=document.createElement('div');top.id='week4StandingsOverlay';top.className='w4-wrap';top.innerHTML=`<div class="w4-hero"><div class="w4-eyebrow">Field state entering Week 4</div><div class="w4-title">Household position</div><div class="w4-sub">Commissioner Week 3 standings anchors are the current field state. Active-entry count remains a carry-forward assumption because the Week 3 screenshot did not show the full bottom of the field.</div></div><div class="w4-kpis"><div class="w4-kpi"><small>Catherine</small><b>#28 · $10,800</b><span>Above approximate median</span></div><div class="w4-kpi"><small>Amanda</small><b>#65 · $8,700</b><span>Near/below median cluster</span></div><div class="w4-kpi"><small>Approx. median</small><b>$8,800</b><span>Visible rank-63 cluster</span></div><div class="w4-kpi"><small>Leader</small><b>$26,700</b><span>Top-10 floor $14,900 · top-5 floor $19,000</span></div></div>`;s.prepend(top);
 }
 function apply(){today();games();analysis();portfolio();standings();window.week4FridayCommandCenter={timestamp:TS,status:'STEP_10_REFRESHED',householdOutlay:3800,candidates:['HOU -3','SEA -7'],watch:['IND -3.5'],holds:['DEN +3 / SF -3','NE +7 / BUF -7'],reconciliation:'PASS',games:15};}
 function showGame(game){const u=new URL(location.href);u.searchParams.set('game',game);history.replaceState({},'',u);games();const el=document.getElementById('games');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});}
 document.addEventListener('click',e=>{const g=e.target.closest('[data-w4-game]');if(g){showGame(g.dataset.w4Game);return;}if(e.target.closest('[data-w4-close]')){const u=new URL(location.href);u.searchParams.delete('game');history.replaceState({},'',u);games();return;}if(e.target.closest('[data-view="today"],[data-view="games"],[data-view="analysis"],[data-view="portfolio"],[data-view="standings"]'))setTimeout(apply,150);},true);
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(apply,700));else setTimeout(apply,700);setTimeout(apply,1800);
})();
</script>
