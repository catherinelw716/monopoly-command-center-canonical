<style id="canonical-mobile-ux-style">
@media (max-width: 760px) {
  html,body{max-width:100%;overflow-x:hidden!important}
  body{padding-bottom:72px!important}
  .panel{border-radius:14px!important;padding:13px!important}
  .panel h2{font-size:20px!important;line-height:1.2!important}
  .panel h3{font-size:16px!important}
  .eyebrow{font-size:10px!important;line-height:1.3!important}

  #today .kpis{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important}
  #today .kpi{min-width:0!important;padding:10px!important}
  #today .kpi b{font-size:18px!important}
  #today .kpi span,#today .kpi small{font-size:10px!important}
  #today .alerts{display:grid!important;grid-template-columns:1fr!important;gap:8px!important}
  #today .alert{padding:11px!important;align-items:flex-start!important}
  #today .alert b{font-size:13px!important}
  #today .alert div{font-size:11px!important;line-height:1.4!important}

  /* Preserve the app's original Decision Board controls/cards. Only make them fit. */
  #recommendedPlays{width:100%!important;max-width:100%!important}
  #recommendedPlays .play-card,#recommendedPlays .recommended-card,#recommendedPlays [data-game]{max-width:100%!important;box-sizing:border-box!important}
  #recommendedPlays button,#recommendedPlays .btn,#recommendedPlays .badge{min-height:32px;touch-action:manipulation}

  /* Keep source tiles readable without changing their semantics or DOM structure. */
  .vg-sources{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:7px!important}
  .source-mini{min-width:0!important;padding:8px!important}
  .source-mini small{font-size:9px!important}
  .source-mini b{font-size:12px!important}
  .source-mini span{font-size:9px!important;overflow-wrap:anywhere!important}

  /* Existing source comparison remains the existing component; allow horizontal swipe if needed. */
  #sourceCompare{max-width:100%!important;overflow:hidden!important}
  #sourceCompare .source-table{display:table!important;min-width:760px!important}
  #sourceCompare .source-table-wrap,#sourceCompare .table-wrap{overflow-x:auto!important;-webkit-overflow-scrolling:touch!important}

  .grid3,.grid4{grid-template-columns:1fr!important}
  .primary-nav{overflow-x:auto!important;white-space:nowrap!important;-webkit-overflow-scrolling:touch!important}
  .primary-nav .nav-btn{flex:0 0 auto!important;touch-action:manipulation!important}
  .mobile-nav{z-index:1000!important;pointer-events:auto!important}
  .mobile-nav button,.mobile-nav a{font-size:10px!important;padding:9px 3px!important;pointer-events:auto!important;touch-action:manipulation!important}
}
@media (max-width:390px){
  .panel{padding:11px!important}
  #today .kpis{grid-template-columns:1fr 1fr!important}
}
.gridiron-games-chip{display:inline-flex;align-items:center;gap:5px;margin-top:5px;padding:4px 7px;border-radius:999px;background:rgba(99,102,241,.12);border:1px solid rgba(99,102,241,.24);color:#c7d2fe;font-size:9px;font-weight:800;line-height:1.2;white-space:normal}
</style>
<script id="week4-gridiron-games-board">
(function(){
 const G={
  'IND @ WAS':['WAS +3.5','IND 50% · WAS 50%'],
  'TEN @ BAL':['BAL -11.5','TEN 52% · BAL 48%'],
  'NE @ BUF':['BUF -7','NE 49% · BUF 51%'],
  'NYJ @ CHI':['CHI -3.5','NYJ 48% · CHI 52%'],
  'JAX @ CIN':['CIN -2.5','JAX 49% · CIN 51%'],
  'DAL @ HOU':['HOU -2.5','DAL 52% · HOU 48%'],
  'ARI @ NYG':['NYG +1.5','ARI 48% · NYG 52%'],
  'LAR @ PHI':['PHI +2.5','LAR 50% · PHI 50%'],
  'GB @ TB':['TB +3.5','GB 49% · TB 51%'],
  'MIA @ MIN':['MIN -10.5','MIA 48% · MIN 52%'],
  'KC @ LV':['LV +4.5','KC 57% · LV 43%'],
  'LAC @ SEA':['SEA -7','LAC 50% · SEA 50%'],
  'DEN @ SF':['SF -3','DEN 50% · SF 50%'],
  'DET @ CAR':['CAR +3.5','DET 51% · CAR 49%'],
  'ATL @ NO':['NO -3','ATL 51% · NO 49%']
 };
 function gameId(text){text=String(text||'').replace(/\s+/g,' ');return Object.keys(G).find(k=>text.includes(k))||'';}
 function addChip(host,id){if(!host||host.querySelector('.gridiron-games-chip'))return;const c=document.createElement('span');c.className='gridiron-games-chip';c.textContent='Gridiron '+G[id][0]+' · '+G[id][1];host.appendChild(c);}
 function patchGames(){
   const root=document.getElementById('games')||document.querySelector('[data-view-panel="games"]')||document.body;
   root.querySelectorAll('tr').forEach(r=>{const id=gameId(r.textContent);if(id)addChip(r.cells?.[0]||r,id);});
   root.querySelectorAll('[data-game]').forEach(el=>{const id=el.getAttribute('data-game')||gameId(el.textContent);if(!G[id])return;const host=el.querySelector('.vg-sources,.game-meta,.card-meta,.play-meta')||el;addChip(host,id);});
   root.querySelectorAll('.game-card,.play-card,.recommended-card,.matchup-card').forEach(el=>{const id=gameId(el.textContent);if(id)addChip(el,id);});
 }
 function patchSourceCompare(){
   const tbody=document.getElementById('sourceCompareBody');if(!tbody)return;
   [...tbody.rows].forEach(r=>{const id=gameId(r.cells?.[0]?.textContent);if(!id||r.cells.length<4)return;r.cells[3].innerHTML='<b>'+G[id][1]+'</b><span class="src-sub">Gridiron spread '+G[id][0]+'</span>';});
 }
 function apply(){patchGames();patchSourceCompare();}
 function later(){setTimeout(apply,1450);setTimeout(apply,2300);}
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',later);else later();
 document.addEventListener('click',e=>{if(e.target.closest('[data-view],[data-game],[data-source-view]'))setTimeout(apply,650);},true);
})();
</script>
