<style id="week4-overview-style">
.overview-nav-link{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:inherit;font:inherit;cursor:pointer}.primary-nav .overview-nav-link{padding:8px 10px;border-radius:8px}.mobile-nav .overview-nav-link{padding:9px 4px;font-size:10px}
#overviewStandalone{min-height:100vh;background:#07111f;color:#e5edf6;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}.ov-wrap{max-width:1220px;margin:0 auto}.ov-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}.ov-back{color:#9fc9ff;text-decoration:none;font-size:13px;white-space:nowrap}.ov-kicker{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#8fa5ba}.ov-title{font-size:34px;line-height:1.1;margin:6px 0 8px}.ov-sub{font-size:14px;line-height:1.55;color:#b6c5d3;max-width:930px}.ov-note{background:#101f31;border-left:3px solid #4f8fdc;padding:12px 14px;border-radius:8px;font-size:13px;line-height:1.55;color:#cfdae5;margin-bottom:14px}.ov-legend{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 16px}.ov-pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#14253a;border:1px solid #29415e;color:#b8d5f5;font-size:10px}.ov-board{background:#0d1a2a;border:1px solid #203249;border-radius:14px;overflow:auto}.ov-row{display:grid;grid-template-columns:175px 128px 145px 190px 190px minmax(210px,1fr) 175px;min-width:1130px;border-bottom:1px solid #203249;align-items:stretch}.ov-row:last-child{border-bottom:0}.ov-row>div{padding:12px 10px;font-size:11px;line-height:1.4}.ov-head{background:#101f31}.ov-head>div{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:#8fa5ba;font-weight:800}.ov-game{font-size:13px!important;font-weight:850}.ov-game small,.ov-muted{display:block;color:#8095a8;font-weight:500;font-size:9px;margin-top:3px}.ov-side{font-size:13px;font-weight:850}.ov-price-good{color:#6fd59a}.ov-price-bad{color:#f0a0a0}.ov-price-flat{color:#c5d1dd}.ov-check{display:block;margin:2px 0}.ov-yes{color:#6fd59a}.ov-no{color:#f0a0a0}.ov-neutral{color:#aab9c7}.ov-raw{display:block;color:#8fa5ba;font-size:9px;margin-top:4px}.ov-decision{display:inline-flex;padding:5px 8px;border-radius:999px;border:1px solid #29415e;font-size:9px;font-weight:850;text-transform:uppercase;letter-spacing:.04em}.ov-play{color:#78d7a0;border-color:#2f6e4b;background:#0d2b1d}.ov-mixed{color:#f0c778;border-color:#765e29;background:#2e2511}.ov-pass{color:#ef9b9b;border-color:#6e3434;background:#2a1515}.ov-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}.ov-card{background:#0d1a2a;border:1px solid #203249;border-radius:14px;padding:16px}.ov-card h2{font-size:17px;margin:0 0 10px}.ov-card h3{font-size:14px;margin:14px 0 6px}.ov-card p{font-size:12px;line-height:1.55;color:#c5d1dd}.ov-wager{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #203249;font-size:12px}.ov-wager:last-child{border-bottom:0}.ov-foot{margin-top:14px;font-size:10px;color:#7f96aa;line-height:1.5}.ov-chain{font-size:12px;line-height:1.55;color:#c5d1dd}.ov-chain b{color:#e5edf6}
@media(max-width:800px){#overviewStandalone{padding:16px}.ov-title{font-size:27px}.ov-top{flex-direction:column}.ov-grid{grid-template-columns:1fr}.ov-row{min-width:1080px}.ov-board{border-radius:10px}}
</style>
<script id="week4-overview-page-script">
(function(){
 const G=()=>window.WEEK4_CURRENT_PUBLIC||[],M=()=>window.WEEK4_CURRENT_META||{},FF=()=>window.FIVE_FACTOR_PUBLIC||{},V2=()=>window.ATS_TRENDS_V2_PUBLIC||{};
 const money=n=>'$'+Number(n||0).toLocaleString();
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const teamOfPick=s=>String(s||'').trim().split(/\s+/)[0]||null;
 const signed=n=>n==null?'—':`${Number(n)>0?'+':''}${Number(n)}`;
 function teamLine(str,team){const m=String(str||'').match(new RegExp('(?:^|\\s)'+team.replace(/[.*+?^${}()|[\\]\\]/g,'\\$&')+'\\s*([+-]?\\d+(?:\\.5)?)','i'));return m?Number(m[1]):null;}
 function price(g){const team=teamOfPick(g.lean);if(!team)return{label:'No primary side',cls:'ov-price-flat',delta:null};const sly=teamLine(g.sly,team)??teamLine(g.lean,team),cur=teamLine(g.current,team);if(sly==null||cur==null)return{label:`Sly ${g.sly||'—'} · market ${g.current||'—'}`,cls:'ov-price-flat',delta:null};const d=+(sly-cur).toFixed(1);if(d>=.5)return{label:`${signed(d)} pt better than market`,cls:'ov-price-good',delta:d,detail:`Sly ${team} ${signed(sly)} · market ${team} ${signed(cur)}`};if(d<=-.5)return{label:`${signed(Math.abs(d))} pt worse than market`,cls:'ov-price-bad',delta:d,detail:`Sly ${team} ${signed(sly)} · market ${team} ${signed(cur)}`};return{label:'Same as market',cls:'ov-price-flat',delta:d,detail:`Sly ${team} ${signed(sly)} · market ${team} ${signed(cur)}`};}
 function external(g){const team=teamOfPick(g.lean),checks=[];if(g.sportsline?.kind==='Spread'&&g.sportsline.visiblePick){const side=teamOfPick(g.sportsline.visiblePick);checks.push({name:'SportsLine',state:side===team?'yes':'no',text:g.sportsline.visiblePick});}else checks.push({name:'SportsLine',state:'neutral',text:'no spread call'});if(g.gridiron){const side=g.gridiron.bestSide==='NO TAKE'?null:g.gridiron.bestSide;checks.push({name:'Gridiron',state:!side?'neutral':side===team?'yes':'no',text:!side?'50/50':`${side} ${g.gridiron.bestPct}%`});}if(g.nfelo){const side=g.nfelo.positiveEdge?g.nfelo.bestSide:null;checks.push({name:'nfelo',state:!side?'neutral':side===team?'yes':'no',text:!side?'neutral':`${side} ${signed(g.nfelo.bestEv)}% EV`});}const yes=checks.filter(x=>x.state==='yes').length,no=checks.filter(x=>x.state==='no').length;return{checks,yes,no,label:yes>=2&&no===0?'Broad confirmation':no>=2?'Major conflict':yes>no?'Leans supportive':no>yes?'Leans opposing':'Mixed / neutral'};}
 function fiveFactor(g){const f=(FF().games||[]).find(x=>x.game===g.game),r=(V2().games||[]).find(x=>x.game===g.game),team=teamOfPick(g.lean);if(!f)return{label:'Unavailable',detail:'No five-factor snapshot'};const factors=['lineMovement','money','defense','keyNumbers'];let sup=0,opp=0;for(const k of factors){const lean=f.fiveFactor?.[k]?.lean;if(lean===team)sup++;else if(lean&&lean!=='neutral'&&lean!==team)opp++;}const v1=r?.v1?.lean,v2=r?.v2?.leanTeam;if(v1===team)sup++;else if(v1&&v1!=='NO EDGE'&&v1!==team)opp++;if(v2===team)sup++;else if(v2&&v2!=='NO EDGE'&&v2!==team)opp++;const label=sup>=opp+2?'Supportive':opp>=sup+2?'Opposing':'Mixed';const lm=f.fiveFactor?.lineMovement?.raw||{},mm=f.fiveFactor?.money?.raw||{},dd=f.fiveFactor?.defense?.raw||{};const raw=[];if(lm.openAway!=null&&lm.currentAway!=null)raw.push(`move ${f.away} ${signed(lm.openAway)}→${signed(lm.currentAway)}`);if(mm.awayPct!=null)raw.push(`handle ${f.away} ${mm.awayPct}%/${f.home} ${mm.homePct}%`);if(dd.awayRank!=null)raw.push(`def ${f.away} #${dd.awayRank}/${f.home} #${dd.homeRank}`);if(r)raw.push(`ATS v1 ${v1||'—'} / v2 ${v2||'—'}`);return{label,detail:raw.join(' · '),sup,opp};}
 function context(g){const injury=g.news?.[0]?.detail||'',weather=g.weather||'';const risk=g.against||'';const severe=/snow|heavy rain|thunder|20 mph|25 mph|30 mph/i.test(weather);const key=/QB|quarterback|offensive line|OL|OUT|doubtful/i.test(injury);return{label:severe?'Weather review':key?'Injury context':'No major weather flag',detail:[risk,weather].filter(Boolean).join(' · ')};}
 function decision(g,p,e,f,c){if(!g.lean||g.lean==='NO TAKE'||g.decision==='PASS')return{label:'PASS — Insufficient Edge',cls:'ov-pass'};if(p.delta!=null&&p.delta<=-1)return{label:'MIXED — Price Penalty',cls:'ov-mixed'};if(e.no>=2)return{label:'MIXED — Model Conflict',cls:'ov-mixed'};if(f.label==='Opposing')return{label:'MIXED — 5-Factor Conflict',cls:'ov-mixed'};if(g.decision==='PLAY'&&p.delta!=null&&p.delta>=.5)return{label:'PLAY — Model + Price',cls:'ov-play'};if(g.decision==='PLAY'&&e.yes>=2)return{label:'PLAY — Broad Confirmation',cls:'ov-play'};if(g.decision==='PLAY')return{label:'PLAY — Primary Model Edge',cls:'ov-play'};return{label:'MIXED — Needs Confirmation',cls:'ov-mixed'};}
 function checks(e){return e.checks.map(x=>`<span class="ov-check ${x.state==='yes'?'ov-yes':x.state==='no'?'ov-no':'ov-neutral'}">${x.state==='yes'?'✓':x.state==='no'?'✕':'–'} ${esc(x.name)}: ${esc(x.text)}</span>`).join('');}
 function ensureNav(){for(const nav of [document.querySelector('.primary-nav'),document.querySelector('.mobile-nav')]){if(!nav||nav.querySelector('.overview-nav-link'))continue;const a=document.createElement('a');a.href='/overview';a.className='overview-nav-link';if(nav.classList.contains('primary-nav'))a.classList.add('nav-btn');a.textContent='Overview';const games=nav.querySelector('[data-view="games"]');games?nav.insertBefore(a,games):nav.appendChild(a);}}
 function renderStandalone(){const games=[...G()].sort((a,b)=>(a.rank||99)-(b.rank||99)),meta=M();if(!games.length)return false;const rows=games.map(g=>{const p=price(g),e=external(g),f=fiveFactor(g),c=context(g),d=decision(g,p,e,f,c);return `<div class="ov-row"><div class="ov-game">#${esc(g.rank||'—')} · ${esc(g.game)}<small>${esc(g.confidence||'')} · ${esc(g.role||'')}</small></div><div><div class="ov-side">${esc(g.lean||'No take')}</div><span class="ov-muted">primary prediction</span></div><div><b class="${p.cls}">${esc(p.label)}</b><span class="ov-raw">${esc(p.detail||'')}</span></div><div><b>${esc(e.label)}</b>${checks(e)}</div><div><b>${esc(f.label)}</b><span class="ov-raw">${esc(f.detail)}</span></div><div><b>${esc(c.label)}</b><span class="ov-raw">${esc(c.detail||'No material context note')}</span></div><div><span class="ov-decision ${d.cls}">${esc(d.label)}</span><span class="ov-raw">Sizing remains downstream of this decision.</span></div></div>`;}).join('');const p=meta.working_portfolio||{},ca=p.Catherine||[],am=p.Amanda||[];const wagers=arr=>arr.map(w=>`<div class="ov-wager"><span><b>${esc(w.pick)}</b><br><span class="ov-muted">${esc(w.role||'')}</span></span><b>${money(w.amount)}</b></div>`).join('')||'<p>No current wagers.</p>';document.body.innerHTML=`<div id="overviewStandalone"><div class="ov-wrap"><div class="ov-top"><div><div class="ov-kicker">NFL Monopoly · Week 4 · Decision synthesis</div><h1 class="ov-title">Prediction → Price → Confirmation → Context → Decision</h1><div class="ov-sub">This is the synthesis layer. It does <b>not</b> create a new master score. The primary model establishes the side; Sly vs current market tells us whether we are getting a good number; external models and the 5-Factor lens confirm or contradict; verified context can reduce confidence; only then do we decide Play / Mixed / Pass. Stake sizing comes afterward.</div></div><a class="ov-back" href="/">← Full Command Center</a></div><div class="ov-note"><b>How to read it:</b> a green PLAY label means the existing primary recommendation survives the decision chain. MIXED means there is a concrete contradiction—bad price, model conflict, or opposing 5-Factor evidence—that should be resolved or reflected in smaller exposure. PASS means the primary system does not show enough edge. These labels are decision explanations, <b>not calibrated cover probabilities</b>.</div><div class="ov-legend"><span class="ov-pill">Prediction = primary model</span><span class="ov-pill">Price = Sly vs current market</span><span class="ov-pill">Confirmation ≠ vote count</span><span class="ov-pill">5-Factor = diagnostic evidence</span><span class="ov-pill">Context = verified modifiers</span><span class="ov-pill">Sizing comes last</span></div><div class="ov-board"><div class="ov-row ov-head"><div>Game</div><div>1 · Prediction</div><div>2 · Sly vs Market</div><div>3 · External Confirmation</div><div>4 · 5-Factor Evidence</div><div>5 · Material Context</div><div>6 · Decision</div></div>${rows}</div><div class="ov-grid"><div class="ov-card"><h2>Current portfolio — downstream of the decision board</h2><h3>Catherine · ${money(ca.reduce((n,w)=>n+w.amount,0))}</h3>${wagers(ca)}<h3>Amanda · ${money(am.reduce((n,w)=>n+w.amount,0))}</h3>${wagers(am)}<p class="ov-foot">Household working outlay: ${money(p.household_outlay||0)}. The portfolio optimizer may diversify Catherine and Amanda even when the same games rank highly.</p></div><div class="ov-card"><h2>Interpretation rules</h2><div class="ov-chain"><p><b>1. Prediction:</b> Who does our primary system prefer against Sly's locked number?</p><p><b>2. Price:</b> Is Sly giving that side a better or worse spread than the live market? A half-point around 3 or 7 can matter more than a generic half-point elsewhere.</p><p><b>3. Confirmation:</b> SportsLine, Gridiron and nfelo are displayed separately. Their agreement is supporting evidence, not three equal independent votes.</p><p><b>4. 5-Factor:</b> Raw line movement, handle, defense and ATS v1/v2 explain the setup. The legacy 100-point score remains audit-only.</p><p><b>5. Context:</b> Injuries and weather can reduce confidence, but are not allowed to become a free-form narrative override.</p><p><b>6. Decision:</b> Play / Mixed / Pass explains the synthesis. Only after that do bankroll and household-correlation logic determine stake size.</p></div></div></div><div class="ov-foot">${esc(meta.snapshot_label||'Current Week 4 snapshot')} · Generated from the same normalized game state, latest-market overlay, five-factor evidence and current portfolio state as the Command Center.</div></div></div>`;document.title='Week 4 Decision Synthesis · NFL Monopoly';window.scrollTo(0,0);return true;}
 function apply(){if(location.pathname==='/overview'){renderStandalone();return;}ensureNav();}
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>{setTimeout(apply,50);setTimeout(apply,400);setTimeout(apply,1200);});else{setTimeout(apply,50);setTimeout(apply,400);setTimeout(apply,1200);}
 if(location.pathname!=='/overview'){let timer=null;new MutationObserver(()=>{clearTimeout(timer);timer=setTimeout(ensureNav,100);}).observe(document.documentElement,{childList:true,subtree:true});}
 window.renderWeek4Overview=renderStandalone;
})();
</script>
