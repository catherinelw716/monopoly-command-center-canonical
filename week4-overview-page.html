<style id="week4-overview-style">
.overview-nav-link{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:inherit;font:inherit;cursor:pointer}.primary-nav .overview-nav-link{padding:8px 10px;border-radius:8px}.mobile-nav .overview-nav-link{padding:9px 4px;font-size:10px}
#overviewStandalone{min-height:100vh;background:#07111f;color:#e5edf6;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}.ov-wrap{max-width:1050px;margin:0 auto}.ov-top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}.ov-back{color:#9fc9ff;text-decoration:none;font-size:13px}.ov-kicker{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#8fa5ba}.ov-title{font-size:34px;line-height:1.1;margin:6px 0 8px}.ov-sub{font-size:15px;line-height:1.55;color:#b6c5d3;max-width:820px}.ov-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}.ov-card{background:#0d1a2a;border:1px solid #203249;border-radius:14px;padding:16px}.ov-card h2{font-size:18px;margin:0 0 10px}.ov-card h3{font-size:17px;margin:0}.ov-card p{font-size:13px;line-height:1.55;color:#c5d1dd}.ov-rec{padding:14px 0;border-bottom:1px solid #203249}.ov-rec:last-child{border-bottom:0}.ov-rank{font-size:11px;color:#8fa5ba}.ov-pick{font-size:22px;font-weight:850;margin:2px 0 4px}.ov-why{font-size:13px;line-height:1.55;color:#e5edf6}.ov-caution{font-size:12px;line-height:1.5;color:#aab9c7;margin-top:6px}.ov-sources{font-size:11px;line-height:1.5;color:#8fa5ba;margin-top:7px}.ov-wager{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #203249;font-size:13px}.ov-wager:last-child{border-bottom:0}.ov-note{background:#101f31;border-left:3px solid #4f8fdc;padding:12px 14px;border-radius:8px;font-size:13px;line-height:1.55;color:#cfdae5}.ov-watch{padding:10px 0;border-bottom:1px solid #203249}.ov-watch:last-child{border-bottom:0}.ov-watch b{font-size:14px}.ov-foot{margin-top:16px;font-size:11px;color:#7f96aa;line-height:1.5}.ov-pill{display:inline-block;padding:3px 7px;border-radius:999px;background:#14253a;border:1px solid #29415e;color:#b8d5f5;font-size:10px;margin-right:5px;margin-top:5px}
@media(max-width:760px){#overviewStandalone{padding:16px}.ov-grid{grid-template-columns:1fr}.ov-title{font-size:27px}.ov-top{align-items:flex-start}.ov-card{padding:14px}}
</style>
<script id="week4-overview-page-script">
(function(){
 const G=()=>window.WEEK4_CURRENT_PUBLIC||[];
 const M=()=>window.WEEK4_CURRENT_META||{};
 const money=n=>'$'+Number(n||0).toLocaleString();
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const PLAIN={
  'DEN @ SF':{why:'We like Denver because of the number, not because every model thinks Denver is the better team. Sly gives us Denver +3 while the broader market is around +2.5. Three is one of the most important NFL key numbers, so getting the full +3 is meaningful value.',risk:'The football models are mostly neutral here, so this is primarily a price-value play. If the market moved back to Denver +3 everywhere, our special advantage would shrink.'},
  'KC @ LV':{why:'Kansas City is one of the cleanest model-agreement plays. SportsLine likes KC -4.5 and Gridiron gives Kansas City a 57% chance to cover at that exact number. That is stronger confirmation than simply seeing the market move our way.',risk:'nfelo sees KC -4.5 as basically fair, so we should not pretend every model is giving us an edge. This is model support, not a stale-line bargain.'},
  'LAR @ PHI':{why:'Philadelphia is attractive because nfelo thinks the Rams should be closer to -2.5, while Sly gives us Philadelphia +3.5. That means we are getting the hook above the key number of 3, and nfelo shows its strongest positive Week 4 value on Philadelphia.',risk:'Philadelphia has meaningful injury concerns. That is why we like the bet but are capping the wager instead of treating it like our safest play.'},
  'ARI @ NYG':{why:'The Giants are interesting because two independent model signals point the same way. Gridiron prefers New York even at only +1.5, and nfelo thinks Arizona should be favored by only about half a point. Sly gives us NYG +2.5, which is better than both of those reference numbers.',risk:'SportsLine is not giving us a spread endorsement here, so this is a cross-model value play rather than broad consensus.'},
  'LAC @ SEA':{why:'Seattle is mostly a SportsLine-driven play. SportsLine has a B spread signal on SEA -7, and the publicly available SportsLine model result puts Seattle at roughly a 60% chance to cover. That is a real football-model reason to consider laying the touchdown.',risk:'Seven is a key number and we are not getting a better price than the market. Gridiron and nfelo are neutral, so this is not a universal-model consensus play.'},
  'IND @ WAS':{why:'Indianapolis combines a better contest number with matchup context. Sly gives us IND -3.5 while SportsLine is around -4.5, so we get roughly a point of price improvement. Washington also has important quarterback and offensive-line injury concerns.',risk:'Gridiron and nfelo are basically neutral at this number. The case depends more on the better Sly price plus Washington personnel issues than on broad model agreement.'}
 };
 function sourceLine(g){const bits=[];if(g.current)bits.push('Current market: '+g.current);if(g.sportsline?.kind==='Spread')bits.push('SportsLine: '+g.sportsline.grade+' '+g.sportsline.visiblePick);if(g.gridiron)bits.push(g.gridiron.bestSide==='NO TAKE'?'Gridiron: 50/50':'Gridiron: '+g.gridiron.bestSide+' '+g.gridiron.bestPct+'%');if(g.nfelo)bits.push(g.nfelo.positiveEdge?'nfelo: '+g.nfelo.bestSide+' +'+g.nfelo.bestEv+'% EV':'nfelo: neutral');return bits.join(' · ');}
 function ensureNav(){
   for(const nav of [document.querySelector('.primary-nav'),document.querySelector('.mobile-nav')]){
     if(!nav||nav.querySelector('.overview-nav-link'))continue;
     const a=document.createElement('a');a.href='/overview';a.className='overview-nav-link';if(nav.classList.contains('primary-nav'))a.classList.add('nav-btn');a.textContent='Overview';
     const games=nav.querySelector('[data-view="games"]');games?nav.insertBefore(a,games):nav.appendChild(a);
   }
 }
 function renderStandalone(){
   const games=G(),meta=M();if(!games.length)return false;
   const plays=games.filter(g=>g.decision==='PLAY').slice(0,6),watches=games.filter(g=>g.decision==='WATCH').slice(0,4),p=meta.working_portfolio||{},c=p.Catherine||[],a=p.Amanda||[];
   const recs=plays.map(g=>{const x=PLAIN[g.game]||{why:g.whyPlay||g.evidence||'',risk:g.against||'The edge is not overwhelming, so sizing should stay disciplined.'};return '<div class="ov-rec"><div class="ov-rank">#'+g.rank+' · '+esc(g.game)+' · '+esc(g.confidence||'')+'</div><div class="ov-pick">'+esc(g.lean)+'</div><div class="ov-why">'+esc(x.why)+'</div><div class="ov-caution"><b>What could be wrong:</b> '+esc(x.risk)+'</div><div class="ov-sources">'+esc(sourceLine(g))+'</div></div>';}).join('');
   const watch=watches.map(g=>'<div class="ov-watch"><b>'+esc(g.lean)+'</b><p>'+esc(g.whyPlay||g.evidence||'')+'</p><div class="ov-caution"><b>Why we are not betting it yet:</b> '+esc(g.against||'The evidence is too conflicted.')+'</div></div>').join('');
   const wagers=arr=>arr.map(w=>'<div class="ov-wager"><span><b>'+esc(w.pick)+'</b><br><span class="ov-caution">'+esc(w.role||'')+'</span></span><b>'+money(w.amount)+'</b></div>').join('');
   document.body.innerHTML='<div id="overviewStandalone"><div class="ov-wrap"><div class="ov-top"><div><div class="ov-kicker">NFL Monopoly · Week 4</div><h1 class="ov-title">What I would bet, and why</h1><div class="ov-sub">This is the plain-English version of the Command Center. It explains the actual logic behind the recommendations without making you interpret model tables. The goal is not to find six teams we think will win. The goal is to find where <b>Sly’s locked spread gives us value</b>, where independent models support the same side, and where conflicting evidence should make us bet less or pass.</div></div><a class="ov-back" href="/">← Full Command Center</a></div><div class="ov-note"><b>Current working approach:</b> DEN +3 is our best price-value play. KC -4.5 has the cleanest exact-line model agreement. PHI +3.5 and NYG +2.5 are the strongest new model-value dogs. SEA -7 is primarily a SportsLine conviction play. IND -3.5 combines a better Sly number with Washington injury context. This is still a Saturday working board, not the final Sunday submission.</div><div class="ov-grid"><div class="ov-card"><h2>Recommended games</h2>'+recs+'</div><div><div class="ov-card"><h2>Current wagers</h2><h3>Catherine · '+money(c.reduce((n,w)=>n+w.amount,0))+'</h3>'+wagers(c)+'<h3 style="margin-top:16px">Amanda · '+money(a.reduce((n,w)=>n+w.amount,0))+'</h3>'+wagers(a)+'<p class="ov-foot">Household working outlay: '+money(p.household_outlay||0)+'. We are intentionally not putting both entries on every play.</p></div><div class="ov-card" style="margin-top:14px"><h2>Games I am watching but not betting yet</h2>'+watch+'</div></div></div><div class="ov-card" style="margin-top:14px"><h2>What would make me change the recommendations?</h2><p><b>Line movement matters most around 3 and 7.</b> If Sunday’s market moves enough to erase the special Sly price, a play can fall. <b>Inactives matter.</b> Philadelphia and Washington-related personnel news can materially change PHI/IND. <b>Weather matters when it becomes severe enough to alter how the game is played.</b> And if our sources disagree sharply—like CAR, JAX or DAL/HOU—we should usually reduce exposure rather than force a pick.</p><span class="ov-pill">Price first</span><span class="ov-pill">Model agreement second</span><span class="ov-pill">Conflicts reduce size</span><span class="ov-pill">No fake consensus</span></div><div class="ov-foot">'+esc(meta.snapshot_label||'Current Week 4 snapshot')+' · This page is generated from the same normalized game and portfolio state as the Command Center.</div></div></div>';
   document.title='Week 4 Overview · NFL Monopoly';window.scrollTo(0,0);return true;
 }
 function apply(){
   if(location.pathname==='/overview'){renderStandalone();return;}
   ensureNav();
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>{setTimeout(apply,50);setTimeout(apply,400);setTimeout(apply,1200);});else{setTimeout(apply,50);setTimeout(apply,400);setTimeout(apply,1200);}
 if(location.pathname!=='/overview'){let timer=null;const obs=new MutationObserver(()=>{clearTimeout(timer);timer=setTimeout(ensureNav,100);});obs.observe(document.documentElement,{childList:true,subtree:true});}
 window.renderWeek4Overview=renderStandalone;
})();
</script>
