<style id="week4-overview-style">
#overview .overview-hero{display:grid;grid-template-columns:1.25fr .75fr;gap:12px;margin-bottom:12px}.overview-card{border:1px solid rgba(148,163,184,.16);background:rgba(15,23,42,.30);border-radius:12px;padding:12px}.overview-card small{display:block;color:#94a3b8;font-size:9px;text-transform:uppercase;letter-spacing:.06em}.overview-card h2,.overview-card h3,.overview-card p{margin-top:6px}.overview-picks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.overview-pick{border:1px solid rgba(148,163,184,.16);border-radius:12px;padding:12px;background:rgba(15,23,42,.26)}.overview-pick .rank{font-size:9px;color:#94a3b8}.overview-pick .pick{font-size:17px;font-weight:900;margin:3px 0 6px}.overview-reasons{font-size:10px;line-height:1.45;color:#cbd5e1}.overview-evidence{margin-top:7px;font-size:9px;line-height:1.4;color:#94a3b8}.overview-tag{display:inline-flex;margin:3px 5px 0 0;padding:3px 6px;border-radius:999px;border:1px solid rgba(148,163,184,.18);font-size:8px;font-weight:800}.overview-watch{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.overview-watch .overview-card{padding:10px}.overview-portfolio{display:grid;grid-template-columns:1fr 1fr;gap:10px}.overview-wager{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid rgba(148,163,184,.12);font-size:10px}.overview-wager:last-child{border-bottom:0}.overview-risk{font-size:10px;line-height:1.45;color:#cbd5e1}.overview-foot{font-size:9px;color:#94a3b8;line-height:1.45}
@media(max-width:760px){#overview .overview-hero,.overview-picks,.overview-watch,.overview-portfolio{grid-template-columns:1fr}.overview-pick .pick{font-size:16px}}
</style>
<script id="week4-overview-page-script">
(function(){
 const G=()=>window.WEEK4_CURRENT_PUBLIC||[];
 const M=()=>window.WEEK4_CURRENT_META||{};
 const money=n=>'$'+Number(n||0).toLocaleString();
 function activate(){try{if(typeof window.switchView==='function'){window.switchView('overview');return;}}catch(e){}document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id==='overview'));document.querySelectorAll('[data-view]').forEach(v=>v.classList.toggle('active',v.dataset.view==='overview'));window.scrollTo(0,0);}
 function ensureNav(){for(const nav of [document.querySelector('.primary-nav'),document.querySelector('.mobile-nav')]){if(!nav||nav.querySelector('[data-view="overview"]'))continue;const b=document.createElement('button');if(nav.classList.contains('primary-nav'))b.className='nav-btn';b.dataset.view='overview';b.textContent='Overview';b.onclick=activate;const games=nav.querySelector('[data-view="games"]');games?nav.insertBefore(b,games):nav.appendChild(b);}}
 function sourceBits(g){const out=[];if(g.sportsline?.kind==='Spread')out.push('SportsLine '+g.sportsline.grade+' '+g.sportsline.visiblePick);if(g.gridiron){out.push(g.gridiron.bestSide==='NO TAKE'?'Gridiron 50/50':'Gridiron '+g.gridiron.grade+' '+g.gridiron.bestSide+' '+g.gridiron.bestPct+'%');}if(g.nfelo){out.push(g.nfelo.positiveEdge?'nfelo '+g.nfelo.bestSide+' EV +'+g.nfelo.bestEv+'%':'nfelo neutral');}return out;}
 function why(g){return g.whyPlay||g.evidence||'';}
 function evidence(g){const parts=sourceBits(g);if(g.current&&g.sly)parts.unshift('Sly '+g.sly+' · market '+g.current);return parts.join(' · ');}
 function render(){
   ensureNav();let s=document.getElementById('overview');if(!s){s=document.createElement('section');s.id='overview';s.className='view';const games=document.getElementById('games');games?.parentNode?.insertBefore(s,games);}
   const games=G(), meta=M(), plays=games.filter(g=>g.decision==='PLAY').slice(0,6), watches=games.filter(g=>g.decision==='WATCH').slice(0,3), p=meta.working_portfolio||{};
   const c=p.Catherine||[],a=p.Amanda||[];
   const top=plays.map(g=>'<div class="overview-pick"><div class="rank">#'+g.rank+' · '+g.confidence+'</div><div class="pick">'+g.lean+'</div><div class="overview-reasons">'+why(g)+'</div><div class="overview-evidence">'+evidence(g)+'</div><div><span class="overview-tag">'+g.role+'</span></div></div>').join('');
   const watch=watches.map(g=>'<div class="overview-card"><small>#'+g.rank+' · watch</small><h3>'+g.lean+'</h3><p class="overview-risk">'+why(g)+'</p><p class="overview-foot"><b>Why not a play yet:</b> '+(g.against||'Conflicting evidence / insufficient edge.')+'</p></div>').join('');
   const wagers=(arr)=>arr.map(w=>'<div class="overview-wager"><span><b>'+w.pick+'</b><br><span class="overview-foot">'+w.role+'</span></span><b>'+money(w.amount)+'</b></div>').join('');
   s.innerHTML='<div class="section-head"><div><div class="eyebrow">Week 4 · one-page decision brief</div><h2>What matters most right now</h2></div></div>'+ 
   '<div class="overview-hero"><div class="overview-card"><small>Current thesis</small><h2>'+plays.slice(0,4).map(x=>x.lean).join(' · ')+'</h2><p class="overview-risk">The board is being driven by three things: <b>price advantage versus Sly</b>, <b>independent model agreement</b>, and <b>conflict penalties</b>. nfelo is treated as its own model lane, not as another generic vote. Games with exact model=market matches are neutral, not confirmations.</p></div><div class="overview-card"><small>Working deployment</small><h2>'+money(p.household_outlay||0)+'</h2><p class="overview-risk">Saturday working portfolio. Catherine '+money(c.reduce((x,w)=>x+w.amount,0))+' · Amanda '+money(a.reduce((x,w)=>x+w.amount,0))+'. Final Sunday refresh still needs current lines, inactives and weather.</p></div></div>'+ 
   '<div class="overview-card" style="margin-bottom:12px"><small>Recommended games · ranked</small><div class="overview-picks">'+top+'</div></div>'+ 
   '<div class="overview-card" style="margin-bottom:12px"><small>Most important watch / contradiction games</small><div class="overview-watch">'+watch+'</div></div>'+ 
   '<div class="overview-card" style="margin-bottom:12px"><small>Working portfolio</small><div class="overview-portfolio"><div><h3>Catherine · '+money(c.reduce((x,w)=>x+w.amount,0))+'</h3>'+wagers(c)+'</div><div><h3>Amanda · '+money(a.reduce((x,w)=>x+w.amount,0))+'</h3>'+wagers(a)+'</div></div></div>'+ 
   '<div class="overview-card"><small>What could change this</small><p class="overview-risk"><b>Sunday line movement:</b> a half-point around 3 or 7 can materially change value. <b>Inactives:</b> PHI, NE, IND/WAS and other injury-sensitive games need final confirmation. <b>Weather:</b> refresh outdoor games before lock. <b>Source disagreement:</b> CAR, JAX and DAL/HOU should not be promoted unless conflicts resolve.</p><p class="overview-foot">'+(meta.snapshot_label||'Current Week 4 snapshot')+' · This page summarizes the normalized Command Center state; it does not create a separate recommendation layer.</p></div>';
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(render,300));else setTimeout(render,300);[900,1800].forEach(ms=>setTimeout(render,ms));document.addEventListener('click',e=>{if(e.target.closest('[data-view],button'))setTimeout(render,120);},true);window.renderWeek4Overview=render;
})();
</script>
