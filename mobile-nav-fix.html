<script id="canonical-mobile-nav-fix">
(function(){
  function activate(view){
    if(!view) return;
    try{
      if(typeof window.switchView==='function'){
        window.switchView(view);
        return;
      }
    }catch(e){}
    document.querySelectorAll('.view').forEach(function(el){el.classList.toggle('active',el.id===view);});
    document.querySelectorAll('[data-view]').forEach(function(el){el.classList.toggle('active',el.dataset.view===view);});
    window.scrollTo(0,0);
  }

  document.addEventListener('click',function(e){
    const control=e.target.closest('.mobile-nav [data-view], .primary-nav [data-view]');
    if(!control) return;
    const view=control.dataset.view;
    if(!view) return;
    e.preventDefault();
    e.stopPropagation();
    activate(view);
  },true);

  document.addEventListener('touchend',function(e){
    const control=e.target.closest('.mobile-nav [data-view]');
    if(!control) return;
    const view=control.dataset.view;
    if(!view) return;
    e.preventDefault();
    activate(view);
  },{capture:true,passive:false});

  window.mobileNavQA={ready:true};
})();
</script>
