<style id="canonical-source-eval-style">
.src-eval-badge{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:22px;padding:0 7px;border-radius:999px;font-size:10px;font-weight:900;line-height:1;letter-spacing:.02em;margin:0 6px 5px 0;border:1px solid transparent;vertical-align:middle}
.src-grade-a{background:rgba(34,197,94,.16);color:#86efac;border-color:rgba(34,197,94,.30)}
.src-grade-b{background:rgba(59,130,246,.16);color:#93c5fd;border-color:rgba(59,130,246,.30)}
.src-grade-c{background:rgba(245,158,11,.16);color:#fcd34d;border-color:rgba(245,158,11,.30)}
.src-grade-d{background:rgba(239,68,68,.15);color:#fca5a5;border-color:rgba(239,68,68,.28)}
.src-type-ats{background:rgba(99,102,241,.14);color:#c7d2fe;border-color:rgba(99,102,241,.28)}
.src-type-context{background:rgba(148,163,184,.12);color:#cbd5e1;border-color:rgba(148,163,184,.22)}
.src-grid-strong{background:rgba(34,197,94,.16);color:#86efac;border-color:rgba(34,197,94,.30)}
.src-grid-edge{background:rgba(59,130,246,.16);color:#93c5fd;border-color:rgba(59,130,246,.30)}
.src-grid-thin{background:rgba(245,158,11,.14);color:#fde68a;border-color:rgba(245,158,11,.26)}
.src-grid-neutral{background:rgba(148,163,184,.12);color:#cbd5e1;border-color:rgba(148,163,184,.22)}
.src-lucas-like{background:rgba(34,197,94,.16);color:#86efac;border-color:rgba(34,197,94,.30)}
.src-lucas-lean{background:rgba(245,158,11,.16);color:#fcd34d;border-color:rgba(245,158,11,.30)}
.src-lucas-none{background:rgba(148,163,184,.12);color:#cbd5e1;border-color:rgba(148,163,184,.22)}
.src-ref-warn{display:inline-flex;margin-top:5px;padding:3px 6px;border-radius:6px;background:rgba(239,68,68,.12);color:#fca5a5;font-size:9px;font-weight:800;border:1px solid rgba(239,68,68,.22)}
.src-consensus-main{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:6px}
.src-consensus-badge{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:900;background:rgba(59,130,246,.16);color:#bfdbfe;border:1px solid rgba(59,130,246,.28)}
.src-consensus-badge.strong{background:rgba(34,197,94,.16);color:#bbf7d0;border-color:rgba(34,197,94,.28)}
.src-consensus-badge.split{background:rgba(245,158,11,.16);color:#fde68a;border-color:rgba(245,158,11,.28)}
.src-consensus-badge.none{background:rgba(148,163,184,.12);color:#cbd5e1;border-color:rgba(148,163,184,.22)}
.src-vote-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.src-vote-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 6px;border-radius:7px;border:1px solid rgba(148,163,184,.18);background:rgba(148,163,184,.07);font-size:9px;color:#cbd5e1;white-space:nowrap}
.src-vote-chip b{font-size:9px!important;color:#e5e7eb!important}
.src-vote-chip.support{background:rgba(34,197,94,.10);border-color:rgba(34,197,94,.20);color:#bbf7d0}
.src-vote-chip.other{background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.16);color:#fecaca}
.src-vote-chip.na{opacity:.72}
.src-primary-pick{display:block;font-weight:850;margin:1px 0 3px}
.src-sub{display:block;color:var(--muted,#94a3b8);font-size:10px;line-height:1.4;margin-top:3px}
@media(max-width:760px){.src-vote-row{gap:3px}.src-vote-chip{font-size:8px;padding:3px 5px}.src-consensus-main{gap:5px}}
</style>
<script id="canonical-source-screenshot-data">
(function(){
  const DATA={
    'LAC @ BUF':{sl:{proj:'LAC 21 · BUF 31',open:'BUF -7 · O/U 50',current:'BUF -7 · O/U 50',picks:6,grade:'B',rec:'BUF -7',type:'ATS'},ga:{away:'LAC +7',awayPct:51,home:'BUF -7',homePct:49,ref:'BUF -7',exact:true}},
    'CAR @ CLE':{sl:{proj:'CAR 24 · CLE 21',open:'CLE +2.5 · O/U 42.5',current:'CLE +2.5 · O/U 42.5',picks:6,grade:'B',rec:'CAR -2.5',type:'ATS'},ga:{away:'CAR -2.5',awayPct:54,home:'CLE +2.5',homePct:46,ref:'CAR -2.5',exact:true}},
    'NYJ @ DET':{sl:{proj:'NYJ 23 · DET 36',open:'DET -6.5 · O/U 48.5',current:'DET -6.5 · O/U 48.5',picks:14,grade:'B',rec:'OVER 48.5',type:'TOTAL'},ga:{away:'NYJ +6.5',awayPct:51,home:'DET -6.5',homePct:49,ref:'DET -6.5',exact:true}},
    'HOU @ IND':{sl:{proj:'HOU 24 · IND 23',open:'IND +1.5 · O/U 42.5',current:'IND +1.5 · O/U 42.5',picks:11,grade:'C',rec:'OVER 42.5',type:'TOTAL'},ga:{away:'HOU -1.5',awayPct:51,home:'IND +1.5',homePct:49,ref:'HOU -1.5',exact:true}},
    'NE @ JAX':{sl:{proj:'NE 20 · JAX 25',open:'JAX -3 · O/U 45.5',current:'JAX -3 · O/U 46',picks:9,grade:'C',rec:'JAX -3',type:'ATS'},ga:{away:'NE +3',awayPct:46,home:'JAX -3',homePct:54,ref:'JAX -3',exact:true}},
    'KC @ MIA':{sl:{proj:'KC 32 · MIA 16',open:'MIA +11.5 · O/U 44.5',current:'MIA +10.5 · O/U 45.5',picks:7,grade:'A',rec:'KC -10.5',type:'ATS'},ga:{away:'KC -11.5',awayPct:53,home:'MIA +11.5',homePct:47,ref:'KC -11.5',exact:false}},
    'TEN @ NYG':{sl:{proj:'TEN 20 · NYG 22',open:'NYG -5.5 · O/U 43.5',current:'NYG -2.5 · O/U 37.5',picks:3,grade:'C',rec:'OVER 37.5',type:'TOTAL'},ga:{away:'TEN PK',awayPct:57,home:'NYG PK',homePct:43,ref:'PK',exact:false}},
    'CIN @ PIT':{sl:{proj:'CIN 22 · PIT 20',open:'PIT +3.5 · O/U 42.5',current:'PIT +3.5 · O/U 42.5',picks:5,grade:'B',rec:'PIT +153',type:'MONEYLINE'},ga:{away:'CIN -3.5',awayPct:50,home:'PIT +3.5',homePct:50,ref:'CIN -3.5',exact:true}},
    'SEA @ WAS':{sl:{proj:'SEA 27 · WAS 15',open:'WAS +7.5 · O/U 40',current:'WAS +7.5 · O/U 40.5',picks:4,grade:'A',rec:'SEA -7.5',type:'ATS'},ga:{away:'SEA -7',awayPct:50,home:'WAS +7',homePct:50,ref:'SEA -7',exact:false}},
    'ARI @ SF':{sl:{proj:'ARI 20 · SF 30',open:'SF -8.5 · O/U 47.5',current:'SF -8.5 · O/U 47.5',picks:6,grade:'B',rec:'SF -8.5',type:'ATS'},ga:{away:'ARI +8.5',awayPct:51,home:'SF -8.5',homePct:49,ref:'SF -8.5',exact:true}},
    'MIN @ TB':{sl:{proj:'MIN 24 · TB 22',open:'TB +1.5 · O/U 42.5',current:'TB +1.5 · O/U 42.5',picks:4,grade:'C',rec:'OVER 42.5',type:'TOTAL'},ga:{away:'MIN -1.5',awayPct:50,home:'TB +1.5',homePct:50,ref:'MIN -1.5',exact:true}},
    'BAL @ DAL':{sl:{proj:'BAL 28 · DAL 26',open:'DAL +3.5 · O/U 53',current:'DAL +3.5 · O/U 53.5',picks:2,grade:'C',rec:'DAL +147',type:'MONEYLINE'},ga:{away:'BAL -3',awayPct:53,home:'DAL +3',homePct:47,ref:'BAL -3',exact:false}},
    'LV @ NO':{sl:{proj:'LV 19 · NO 27',open:'NO -3 · O/U 45.5',current:'NO -3 · O/U 43.5',picks:6,grade:'A',rec:'NO -3',type:'ATS'},ga:{away:'LV +3',awayPct:51,home:'NO -3',homePct:49,ref:'NO -3',exact:true}},
    'LAR @ DEN':{sl:{proj:'LAR 21 · DEN 22',open:'DEN +2.5 · O/U 44',current:'DEN +2.5 · O/U 44',picks:3,grade:'B',rec:'DEN +2.5',type:'ATS'},ga:{away:'LAR -2.5',awayPct:49,home:'DEN +2.5',homePct:51,ref:'LAR -2.5',exact:true}},
    'PHI @ CHI':{sl:{proj:'PHI 23 · CHI 17',open:'CHI +4.5 · O/U 41',current:'CHI +3.5 · O/U 42.5',picks:5,grade:'C',rec:'UNDER 42.5',type:'TOTAL'},ga:{away:'PHI -3',awayPct:46,home:'CHI +3',homePct:54,ref:'PHI -3',exact:false}}
  };
  window.week3ScreenshotSources=DATA;
  const L=window.lucasWeek3||{};
  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const gameFrom=text=>Object.keys(DATA).find(g=>String(text||'').replace(/\s+/g,' ').includes(g))||'';
  const team=s=>{const m=String(s||'').match(/\b([A-Z]{2,3})\b/);return m?m[1].replace('JAC','JAX'):'';};
  const extractSide=s=>{const m=String(s||'').match(/\b([A-Z]{2,3})\s(?:PK|[+-]\d+(?:\.\d+)?)\b/);return m?m[0].replace('JAC','JAX'):'';};
  const stronger=g=>{const x=DATA[g].ga;if(x.awayPct===x.homePct)return '50/50 · NO TAKE';return x.awayPct>x.homePct?`${x.away} · ${x.awayPct}%`:`${x.home} · ${x.homePct}%`;};
  const gridPick=g=>{const x=DATA[g].ga;if(x.awayPct===x.homePct)return '';return x.awayPct>x.homePct?x.away:x.home;};
  const gradeClass=g=>'src-grade-'+String(g||'').charAt(0).toLowerCase();
  const lucasClass=s=>s==='LIKE'?'src-lucas-like':s==='LEAN'?'src-lucas-lean':'src-lucas-none';
  const gridClass=p=>p>=55?'src-grid-strong':p>=52?'src-grid-edge':p===51?'src-grid-thin':'src-grid-neutral';

  function getSourceTable(){return [...document.querySelectorAll('table')].find(t=>{const h=t.querySelector('thead')?.innerText||'';return h.includes('SportsLine')&&h.includes('Gridiron');})||null;}
  function ensureConsensusAfterLucas(table){
    const hr=table?.querySelector('thead tr'); if(!hr)return;
    let heads=[...hr.cells].map(c=>(c.textContent||'').trim());
    let li=heads.findIndex(h=>/^Lucas$/i.test(h));
    let ci=heads.findIndex(h=>/Cross-source|Consensus/i.test(h));
    if(li<0)return;
    if(ci<0){const th=document.createElement('th');th.textContent='Cross-source consensus';hr.cells[li].after(th);[...table.querySelectorAll('tbody tr')].forEach(r=>{const td=document.createElement('td');r.cells[li]?.after(td);});return;}
    hr.cells[ci].textContent='Cross-source consensus';
    if(ci!==li+1){
      const crossHead=hr.cells[ci]; const lucasHead=[...hr.cells].find(c=>(c.textContent||'').trim()==='Lucas'); lucasHead?.after(crossHead);
      [...table.querySelectorAll('tbody tr')].forEach(r=>{const cells=[...r.cells];const lucasTd=cells[li],crossTd=cells[ci];if(lucasTd&&crossTd&&lucasTd.nextElementSibling!==crossTd)lucasTd.after(crossTd);});
    }
  }

  function sportsHTML(sl){
    const typeClass=sl.type==='ATS'?'src-type-ats':'src-type-context';
    const typeLabel=sl.type==='MONEYLINE'?'ML':sl.type;
    return `<div><span class="src-eval-badge ${gradeClass(sl.grade)}">${esc(sl.grade)}</span><span class="src-eval-badge ${typeClass}">${esc(typeLabel)}</span></div><span class="src-primary-pick">${esc(sl.rec)}</span><span class="src-sub">${sl.picks} SportsLine picks · projected ${esc(sl.proj)}<br>Open ${esc(sl.open)} · Current ${esc(sl.current)}${sl.type==='ATS'?'':'<br>Context only for ATS consensus'}</span>`;
  }
  function gridHTML(g){
    const x=DATA[g].ga, pct=Math.max(x.awayPct,x.homePct), main=stronger(g);
    const badge=x.awayPct===x.homePct?'50/50':pct+'%';
    return `<div><span class="src-eval-badge ${gridClass(x.awayPct===x.homePct?50:pct)}">${esc(badge)}</span><span class="src-eval-badge ${x.exact?'src-type-ats':'src-type-context'}">${x.exact?'AT SLY':'REF MISMATCH'}</span></div><span class="src-primary-pick">${esc(main)}</span><span class="src-sub">${esc(x.away)} ${x.awayPct}% · ${esc(x.home)} ${x.homePct}%<br>Reference ${esc(x.ref)}</span>${x.exact?'':`<span class="src-ref-warn">Different reference spread — context only</span>`}`;
  }
  function lucasHTML(g){const p=L[g];return p?`<div><span class="src-eval-badge ${lucasClass(p.signal)}">${esc(p.signal)}</span></div><span class="src-primary-pick">${esc(p.side)}</span><span class="src-sub">Independent source · Sly line</span>`:`<div><span class="src-eval-badge src-lucas-none">NO TAKE</span></div><span class="src-primary-pick">—</span><span class="src-sub">No Week 3 opinion</span>`;}

  function consensusHTML(g,ourText){
    const d=DATA[g],lp=L[g],ourSide=extractSide(ourText),ourTeam=team(ourSide);
    const sources=[{name:'Model',side:ourSide,team:ourTeam,eligible:!!ourTeam}];
    if(d.sl.type==='ATS')sources.push({name:'SportsLine',side:d.sl.rec,team:team(d.sl.rec),eligible:true});else sources.push({name:'SportsLine',side:d.sl.rec,team:'',eligible:false,why:d.sl.type});
    const gp=gridPick(g); if(d.ga.exact&&gp)sources.push({name:'Gridiron',side:gp,team:team(gp),eligible:true});else sources.push({name:'Gridiron',side:gp||'NO TAKE',team:'',eligible:false,why:d.ga.exact?'50/50':'ref mismatch'});
    if(lp)sources.push({name:'Lucas',side:lp.side,team:team(lp.side),eligible:true});else sources.push({name:'Lucas',side:'NO TAKE',team:'',eligible:false,why:'no take'});
    const eligible=sources.filter(s=>s.eligible&&s.team),counts={};eligible.forEach(s=>counts[s.team]=(counts[s.team]||0)+1);
    const ordered=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
    let leader='',n=0,summary='No comparable ATS consensus',cls='none';
    if(ordered.length){leader=ordered[0][0];n=ordered[0][1];const tied=ordered.length>1&&ordered[1][1]===n;if(tied){summary=`Split ${eligible.length}-source ATS board`;cls='split';}else{summary=`${n}/${eligible.length} eligible ATS sources support ${leader}`;cls=n===eligible.length&&eligible.length>1?'strong':'';}}
    const chips=sources.map(s=>{const state=!s.eligible?'na':(leader&&s.team===leader?'support':'other');const label=s.eligible?(s.side||s.team):`${s.side||'—'} · ${s.why||'N/A'}`;return `<span class="src-vote-chip ${state}"><b>${esc(s.name)}</b>${esc(label)}</span>`;}).join('');
    const excluded=4-eligible.length;
    return `<div class="src-consensus-main"><span class="src-consensus-badge ${cls}">${esc(summary)}</span></div><div class="src-vote-row">${chips}</div><span class="src-sub">All 4 sources shown · ${eligible.length} comparable ATS vote${eligible.length===1?'':'s'}${excluded?` · ${excluded} context / no-take`:''}</span>`;
  }

  function patchSourceCompare(){
    const table=getSourceTable(); if(!table)return;
    ensureConsensusAfterLucas(table);
    const hr=table.querySelector('thead tr'); if(!hr)return;
    const heads=[...hr.cells].map(c=>(c.textContent||'').trim());
    const io=heads.findIndex(h=>/Our Model/i.test(h)),is=heads.findIndex(h=>/SportsLine/i.test(h)),ig=heads.findIndex(h=>/Gridiron/i.test(h)),il=heads.findIndex(h=>/^Lucas$/i.test(h)),ic=heads.findIndex(h=>/Cross-source|Consensus/i.test(h));
    [...table.querySelectorAll('tbody tr')].forEach(r=>{
      const g=gameFrom(r.cells[0]?.innerText||r.innerText); if(!g)return;
      const d=DATA[g];
      if(is>=0&&r.cells[is])r.cells[is].innerHTML=sportsHTML(d.sl);
      if(ig>=0&&r.cells[ig])r.cells[ig].innerHTML=gridHTML(g);
      if(il>=0&&r.cells[il])r.cells[il].innerHTML=lucasHTML(g);
      if(ic>=0&&r.cells[ic])r.cells[ic].innerHTML=consensusHTML(g,io>=0&&r.cells[io]?r.cells[io].innerText:'');
    });
  }

  function patchGameCards(){
    document.querySelectorAll('.visual-game[data-game],#games [data-game]').forEach(card=>{
      const g=card.dataset.game||gameFrom(card.innerText); if(!DATA[g])return;
      const box=card.querySelector('.vg-sources,.sources-grid,.source-grid,.game-sources'); if(!box)return;
      const d=DATA[g];
      const ensure=(key,label,main,meta)=>{let t=box.querySelector(`[data-source-key="${key}"]`)||[...box.querySelectorAll('.source-mini')].find(x=>(x.querySelector('small')?.textContent||'').toLowerCase().includes(label.toLowerCase()));if(!t){t=document.createElement('div');t.className='source-mini';box.appendChild(t);}t.dataset.sourceKey=key;t.innerHTML=`<small>${esc(label)}</small><b>${esc(main)}</b><span>${esc(meta)}</span>`;};
      ensure('sportsline','SportsLine',d.sl.rec,`${d.sl.grade} · ${d.sl.type} · ${d.sl.picks} picks`);
      ensure('gridiron','Gridiron',stronger(g),`ref ${d.ga.ref}${d.ga.exact?'':' · mismatch'}`);
    });
  }

  function patchDetail(){
    const q=new URLSearchParams(location.search).get('game'); const g=q&&DATA[q]?q:null; if(!g)return;
    const hero=document.getElementById('gameHero'); if(!hero)return;
    let p=document.getElementById('screenshotSourceDrilldown'); if(!p){p=document.createElement('div');p.id='screenshotSourceDrilldown';p.className='panel source-snapshot-card';hero.insertAdjacentElement('afterend',p);}
    const d=DATA[g],lp=L[g];
    p.innerHTML=`<div class="eyebrow">Screenshot-verified source data</div><div class="source-card-grid"><div class="source-card"><small>SportsLine</small><strong>${esc(d.sl.rec)}</strong><span>${esc(d.sl.grade)} · ${esc(d.sl.type)} · ${d.sl.picks} picks</span><span>Projected ${esc(d.sl.proj)}</span><span>Current ${esc(d.sl.current)}</span></div><div class="source-card"><small>Gridiron AI</small><strong>${esc(stronger(g))}</strong><span>${esc(d.ga.away)} ${d.ga.awayPct}% · ${esc(d.ga.home)} ${d.ga.homePct}%</span><span>Ref ${esc(d.ga.ref)} · ${d.ga.exact?'same Sly spread':'different reference spread'}</span></div><div class="source-card"><small>Lucas</small><strong>${lp?esc(lp.side):'NO TAKE'}</strong><span>${lp?esc(lp.signal):'—'}</span></div></div>`;
  }

  function apply(){patchSourceCompare();patchGameCards();patchDetail();window.screenshotSourceQA={games:Object.keys(DATA).length,consensusUsesAllFour:true};}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(apply,120));else setTimeout(apply,120);
  setTimeout(apply,700);
  document.addEventListener('click',e=>{if(e.target.closest('[data-view="games"],[data-game]'))setTimeout(apply,150);});
})();
</script>
