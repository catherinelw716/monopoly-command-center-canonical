<script id="canonical-source-screenshot-data">
(function(){
  const DATA={
    'LAC @ BUF':{sl:{proj:'LAC 21 · BUF 31',open:'BUF -7 · O/U 50',current:'BUF -7 · O/U 50',picks:6,grade:'B',rec:'BUF -7',type:'ATS'},ga:{away:'LAC +7',awayPct:51,home:'BUF -7',homePct:49,ref:'BUF -7',exact:true}},
    'CAR @ CLE':{sl:{proj:'CAR 24 · CLE 21',open:'CLE +2.5 · O/U 42.5',current:'CLE +2.5 · O/U 42.5',picks:6,grade:'B',rec:'CAR -2.5',type:'ATS'},ga:{away:'CAR -2.5',awayPct:54,home:'CLE +2.5',homePct:46,ref:'CAR -2.5',exact:true}},
    'NYJ @ DET':{sl:{proj:'NYJ 23 · DET 36',open:'DET -6.5 · O/U 48.5',current:'DET -6.5 · O/U 48.5',picks:14,grade:'B',rec:'OVER 48.5',type:'TOTAL'},ga:{away:'NYJ +6.5',awayPct:51,home:'DET -6.5',homePct:49,ref:'DET -6.5',exact:true}},
    'HOU @ IND':{sl:{proj:'HOU 24 · IND 23',open:'IND +1.5 · O/U 42.5',current:'IND +1.5 · O/U 42.5',picks:11,grade:'C',rec:'OVER 42.5',type:'TOTAL'},ga:{away:'HOU -1.5',awayPct:51,home:'IND +1.5',homePct:49,ref:'HOU -1.5',exact:true}},
    'NE @ JAX':{sl:{proj:'NE 20 · JAX 25',open:'JAX -3 · O/U 45.5',current:'JAX -3 · O/U 46',picks:9,grade:'C',rec:'JAX -3',type:'ATS'},ga:{away:'NE +3',awayPct:46,home:'JAX -3',homePct:54,ref:'JAX -3',exact:true}},
    'KC @ MIA':{sl:{proj:'KC 32 · MIA 16',open:'MIA +11.5 · O/U 44.5',current:'MIA +10.5 · O/U 45.5',picks:7,grade:'A',rec:'KC -10.5',type:'ATS'},ga:{away:'KC -11.5',awayPct:53,home:'MIA +11.5',homePct:47,ref:'KC -11.5',exact:false}},
    'TEN @ NYG':{sl:{proj:'TEN 20 · NYG 22',open:'NYG -5.5 · O/U 43.5',current:'NYG -2.5 · O/U 37.5',picks:3,grade:'C',rec:'OVER 37.5',type:'TOTAL'},ga:{away:'TEN PK',awayPct:57,home:'NYG PK',homePct:43,ref:'PK',exact:false}},
    'CIN @ PIT':{sl:{proj:'CIN 22 · PIT 20',open:'PIT +3.5 · O/U 42.5',current:'PIT +3.5 · O/U 42.5',picks:5,grade:'B',rec:'PIT +153',type:'MONEYLINE'},ga:{away:'CIN -3.5',awayPct:50,home:'PIT +3.5',homePct:50,ref:'CIN -3.5',exact:true}},
    'SEA @ WAS':{sl:{proj:'SEA 27 · WAS 15',open:'WAS +7.5 · O/U 40',current:'WAS +7.5 · O/U 40.5',picks:4,grade:'A',rec:'SEA -7.5',type:'ATS'},ga:{away:'SEA -7',awayPct:50,home:'WAS +7',homePct:50,ref:'SEA -7',exact:false}},
    'ARI @ SF':{sl:{proj:'ARI 20 · SF 30',open:'SF -8.5 · O/U 47.5',current:'SF -8.5 · O/U 47.5',picks:6,grade:'B',rec:'SF -8.5',type:'ATS'},ga:{away:'ARI +8.5',awayPct:51,home:'SF -8.5',homePct:49,ref:'SF -8.5',exact:true}},
    'MIN @ TB':{sl:{proj:'MIN 24 · TB 22',open:'TB +1.5 · O/U 42.5',current:'TB +1.5 · O/U 42.5',picks:4,grade:'C',rec:'OVER 42.5',type:'TOTAL'},ga:{away:'MIN -1.5',awayPct:50,home:'TB +1.5',homePct:50,ref:'MIN -1.5',exact:true}},
    'BAL @ DAL':{sl:{proj:'BAL 28 · DAL 26',open:'DAL +3.5 · O/U 53',current:'DAL +3.5 · O/U 53.5',picks:2,grade:'C',rec:'DAL +147',type:'MONEYLINE'},ga:{away:'BAL -3',awayPct:53,home:'DAL +3',homePct:47,ref:'BAL -3',exact:false}},
    'LV @ NO':{sl:{proj:'LV 19 · NO 27',open:'NO -3 · O/U 45.5',current:'NO -3 · O/U 43.5',picks:6,grade:'A',rec:'NO -3',type:'ATS'},ga:{away:'LV +3',awayPct:51,home:'NO -3',homePct:49,ref:'NO -3',exact:true}},
    'LAR @ DEN':{sl:{proj:'LAR 21 · DEN 22',open:'DEN +2.5 · O/U 44',current:'DEN +2.5 · O/U 44',picks:3,grade:'B',rec:'DEN +2.5',type:'ATS'},ga:{away:'LAR -2.5',awayPct:49,home:'DEN +2.5',homePct:51,ref:'LAR -2.5',exact:true}},
    'PHI @ CHI':{sl:{proj:'PHI 23 · CHI 17',open:'CHI +4.5 · O/U 41',current:'CHI +3.5 · O/U 42.5',picks:5,grade:'C',rec:'UNDER 42.5',type:'TOTAL'},ga:{away:'PHI -3',awayPct:46,home:'CHI +3',homePct:54,ref:'PHI -3',exact:false}}
  };
  window.week3ScreenshotSources=DATA;
  const L=window.lucasWeek3||{};
  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const gameFrom=text=>Object.keys(DATA).find(g=>String(text||'').replace(/\s+/g,' ').includes(g))||'';
  const stronger=g=>{const x=DATA[g].ga;if(x.awayPct===x.homePct)return '50/50 · NO TAKE';return x.awayPct>x.homePct?`${x.away} · ${x.awayPct}%`:`${x.home} · ${x.homePct}%`;};

  function patchSourceCompare(){
    const table=[...document.querySelectorAll('table')].find(t=>{const h=t.querySelector('thead')?.innerText||'';return h.includes('SportsLine')&&h.includes('Gridiron');});
    if(!table)return;
    const hr=table.querySelector('thead tr'); if(!hr)return;
    const heads=[...hr.cells].map(c=>(c.textContent||'').trim());
    const is=heads.findIndex(h=>/SportsLine/i.test(h)), ig=heads.findIndex(h=>/Gridiron/i.test(h));
    [...table.querySelectorAll('tbody tr')].forEach(r=>{
      const g=gameFrom(r.cells[0]?.innerText||r.innerText); if(!g)return;
      const d=DATA[g];
      if(is>=0&&r.cells[is])r.cells[is].innerHTML=`<b>${esc(d.sl.rec)}</b><span class="src-sub">${esc(d.sl.type)} · grade ${esc(d.sl.grade)} · ${d.sl.picks} SportsLine picks<br>Projected ${esc(d.sl.proj)}<br>Open ${esc(d.sl.open)} · Current ${esc(d.sl.current)}<br>User-supplied SportsLine screenshot</span>`;
      if(ig>=0&&r.cells[ig])r.cells[ig].innerHTML=`<b>${esc(stronger(g))}</b><span class="src-sub">${esc(d.ga.away)} ${d.ga.awayPct}% · ${esc(d.ga.home)} ${d.ga.homePct}%<br>Reference ${esc(d.ga.ref)} · ${d.ga.exact?'same Sly spread':'DIFFERENT reference spread'}<br>User-supplied GridironAI screenshot</span>`;
    });
  }

  function patchGameCards(){
    document.querySelectorAll('.visual-game[data-game],#games [data-game]').forEach(card=>{
      const g=card.dataset.game||gameFrom(card.innerText); if(!DATA[g])return;
      const box=card.querySelector('.vg-sources,.sources-grid,.source-grid,.game-sources'); if(!box)return;
      const d=DATA[g];
      const ensure=(key,label,main,meta)=>{let t=box.querySelector(`[data-source-key="${key}"]`)||[...box.querySelectorAll('.source-mini')].find(x=>(x.querySelector('small')?.textContent||'').toLowerCase().includes(label.toLowerCase()));if(!t){t=document.createElement('div');t.className='source-mini';box.appendChild(t);}t.dataset.sourceKey=key;t.innerHTML=`<small>${esc(label)}</small><b>${esc(main)}</b><span>${esc(meta)}</span>`;};
      ensure('sportsline','SportsLine',d.sl.rec,`${d.sl.grade} · ${d.sl.type} · ${d.sl.picks} picks`);
      ensure('gridiron','Gridiron',stronger(g),`ref ${d.ga.ref}${d.ga.exact?'':' · mismatch'}`);
    });
  }

  function patchDetail(){
    const q=new URLSearchParams(location.search).get('game'); const g=q&&DATA[q]?q:null; if(!g)return;
    const hero=document.getElementById('gameHero'); if(!hero)return;
    let p=document.getElementById('screenshotSourceDrilldown'); if(!p){p=document.createElement('div');p.id='screenshotSourceDrilldown';p.className='panel source-snapshot-card';hero.insertAdjacentElement('afterend',p);}
    const d=DATA[g],lp=L[g];
    p.innerHTML=`<div class="eyebrow">Screenshot-verified source data</div><div class="source-card-grid"><div class="source-card"><small>SportsLine</small><strong>${esc(d.sl.rec)}</strong><span>${esc(d.sl.grade)} · ${esc(d.sl.type)} · ${d.sl.picks} picks</span><span>Projected ${esc(d.sl.proj)}</span><span>Current ${esc(d.sl.current)}</span></div><div class="source-card"><small>Gridiron AI</small><strong>${esc(stronger(g))}</strong><span>${esc(d.ga.away)} ${d.ga.awayPct}% · ${esc(d.ga.home)} ${d.ga.homePct}%</span><span>Ref ${esc(d.ga.ref)} · ${d.ga.exact?'same Sly spread':'different reference spread'}</span></div><div class="source-card"><small>Lucas</small><strong>${lp?esc(lp.side):'NO TAKE'}</strong><span>${lp?esc(lp.signal):'—'}</span></div></div>`;
  }

  function apply(){patchSourceCompare();patchGameCards();patchDetail();window.screenshotSourceQA={games:Object.keys(DATA).length};}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(apply,120));else setTimeout(apply,120);
  setTimeout(apply,700);
  document.addEventListener('click',e=>{if(e.target.closest('[data-view="games"],[data-game]'))setTimeout(apply,150);});
})();
</script>
