<style id="field-aware-sizing-style">
.sizing-note{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:10px}.sizing-note>div{border:1px solid rgba(148,163,184,.16);border-radius:11px;padding:10px;background:rgba(15,23,42,.24)}.sizing-note small{display:block;color:#94a3b8;font-size:9px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}.sizing-note b{font-size:14px}.sizing-note span{display:block;color:#9db3aa;font-size:10px;line-height:1.35;margin-top:3px}.optimizer-cut{margin-top:9px;padding:9px 10px;border-radius:9px;border:1px solid rgba(148,163,184,.15);background:rgba(148,163,184,.05);font-size:10px;color:#aebdca;line-height:1.45}@media(max-width:760px){.sizing-note{grid-template-columns:1fr}.sizing-note>div{padding:9px}}
</style>
<script id="field-aware-sizing-layer">
(function(){
  const C_BANK=11400,A_BANK=10300;
  /* No fixed game-count constraint. Each incremental game must clear the marginal-value threshold
     after internal grade, source agreement, line quality, uncertainty and household correlation. */
  const plan={
    'LAC @ BUF':{catherine:0,amanda:900},
    'CAR @ CLE':{catherine:1000,amanda:800},
    'NYJ @ DET':{catherine:700,amanda:0},
    'HOU @ IND':{catherine:0,amanda:0},
    'NE @ JAX':{catherine:0,amanda:0},
    'KC @ MIA':{catherine:0,amanda:1100},
    'TEN @ NYG':{catherine:800,amanda:0},
    'CIN @ PIT':{catherine:0,amanda:0},
    'SEA @ WAS':{catherine:0,amanda:600},
    'ARI @ SF':{catherine:0,amanda:0},
    'MIN @ TB':{catherine:0,amanda:500},
    'BAL @ DAL':{catherine:0,amanda:0},
    'LV @ NO':{catherine:600,amanda:0},
    'LAR @ DEN':{catherine:900,amanda:0},
    'PHI @ CHI':{catherine:0,amanda:0}
  };
  const C_TOTAL=4000,A_TOTAL=3900,H_TOTAL=7900,SHARED=1800,C_GAMES=5,A_GAMES=5;
  const pct=(n,d)=>(100*n/d).toFixed(1)+'%';
  function applyGameData(){
    if(!Array.isArray(window.games)) return;
    window.games.forEach(g=>{const p=plan[g.game];if(p){g.catherine=p.catherine;g.amanda=p.amanda;}});
    try{if(typeof window.renderBoards==='function')window.renderBoards();else if(typeof renderBoards==='function')renderBoards();}catch(e){}
  }
  function today(){
    const t=document.getElementById('today');if(!t)return;
    const k=t.querySelector('.kpis');if(k)k.innerHTML=`<div class="kpi"><small>Catherine</small><b>$11,400</b><span>#30 after W2 · ${pct(C_TOTAL,C_BANK)} deployed</span></div><div class="kpi"><small>Amanda</small><b>$10,300</b><span>#44 after W2 · ${pct(A_TOTAL,A_BANK)} deployed</span></div><div class="kpi"><small>Household outlay</small><b>$7,900</b><span>${pct(H_TOTAL,C_BANK+A_BANK)} of bankroll</span></div><div class="kpi"><small>Shared exposure</small><b>CAR only</b><span>$1,800 · ${pct(SHARED,H_TOTAL)} of outlay</span></div>`;
  }
  function portfolio(){
    const p=document.getElementById('portfolio');if(!p)return;
    const fp=p.querySelector('.section-head + .panel');if(fp)fp.innerHTML=`<div class="eyebrow">No-fixed-count Week 3 optimizer</div><b style="display:block;font-size:18px;margin-top:3px">$7,900 household · Catherine $4,000 · Amanda $3,900</b><p style="font-size:10px;color:#9db3aa;margin:5px 0 0">The optimizer tested incremental games instead of stopping at the four-game minimum. The current marginal-value cutoff lands at <b>${C_GAMES} games for Catherine</b> and <b>${A_GAMES} for Amanda</b>.</p><div class="sizing-note"><div><small>Catherine target</small><b>${pct(C_TOTAL,C_BANK)} bankroll · ${C_GAMES} games</b><span>A perfect card produces +$4,000 net P/L, moving $11.4K to $15.4K.</span></div><div><small>Amanda target</small><b>${pct(A_TOTAL,A_BANK)} bankroll · ${A_GAMES} games</b><span>A perfect card produces +$3,900 net P/L, moving $10.3K to $14.2K.</span></div><div><small>Household correlation</small><b>${pct(SHARED,H_TOTAL)} shared</b><span>Only CAR is duplicated; 9 unique games are represented across 10 positions.</span></div></div><div class="optimizer-cut"><b>Why stop at five?</b> The sixth-game candidates did not clear the current marginal threshold. PHI carries a worse Sly price than the current market plus a Gridiron disagreement; HOU is weakened by availability uncertainty; BAL/NO/DET-type mixed-source plays are used only where the rest of that entry's portfolio earns the diversification benefit.</div>`;
    const pg=p.querySelector('.portfolio-grid');if(pg)pg.innerHTML=`<div class="panel entry-card"><div class="eyebrow">Catherine · #30 · $11,400 bankroll</div><h3>$4,000 · ${pct(C_TOTAL,C_BANK)} deployed · ${C_GAMES} games</h3><div class="wager-list"><div class="wager"><b>CAR -2.5</b><span>$1,000</span></div><div class="wager"><b>DEN +2.5</b><span>$900</span></div><div class="wager"><b>TEN +2.5</b><span>$800</span></div><div class="wager"><b>DET -6.5</b><span>$700</span></div><div class="wager"><b>NO -3</b><span>$600</span></div></div></div><div class="panel entry-card"><div class="eyebrow">Amanda · #44 · $10,300 bankroll</div><h3>$3,900 · ${pct(A_TOTAL,A_BANK)} deployed · ${A_GAMES} games</h3><div class="wager-list"><div class="wager"><b>KC -10.5</b><span>$1,100</span></div><div class="wager"><b>BUF -7</b><span>$900</span></div><div class="wager"><b>CAR -2.5</b><span>$800</span></div><div class="wager"><b>SEA -7.5</b><span>$600</span></div><div class="wager"><b>MIN -1.5</b><span>$500</span></div></div></div>`;
    const pk=p.querySelector('.portfolio-grid + .kpis');if(pk)pk.innerHTML=`<div class="kpi"><small>Combined bankroll</small><b>$21,700</b><span>After Week 2</span></div><div class="kpi"><small>Week 3 outlay</small><b>${pct(H_TOTAL,C_BANK+A_BANK)}</b><span>$7,900 household</span></div><div class="kpi"><small>Unique games</small><b>9</b><span>10 total positions</span></div><div class="kpi"><small>Shared exposure</small><b>${pct(SHARED,H_TOTAL)}</b><span>CAR only · $1,800</span></div>`;
    const after=pk?.nextElementSibling;if(after&&after.classList.contains('panel'))after.innerHTML=`<div class="eyebrow">Optimizer read</div><div class="alerts"><div class="alert green"><span class="dot"></span><div><b>The league minimum no longer controls game count.</b><br/>Weeks 1–2 used 5–6 games per entry; Week 3 now stops only when the next game's marginal edge is not worth the extra exposure.</div></div><div class="alert green"><span class="dot"></span><div><b>CAR remains the only household duplicate.</b><br/>It is still the cleanest four-source convergence. The remaining positions are deliberately split to preserve two-entry optionality.</div></div><div class="alert yellow"><span class="dot"></span><div><b>Catherine gets DET and NO as smaller fifth-tier additions.</b><br/>DET combines Our Model + Lucas support against only a thin 51% Gridiron opposition. NO combines SportsLine A with Our Model B- but is capped because Gridiron is 51% the other way.</div></div><div class="alert yellow"><span class="dot"></span><div><b>Amanda remains concentrated in the stronger top-end board.</b><br/>KC, BUF, CAR, SEA and MIN clear the cutoff; a sixth position does not currently add enough edge to justify more variance.</div></div></div>`;
  }
  function apply(){applyGameData();today();portfolio();window.fieldAwareSizingQA={catherine:C_TOTAL,amanda:A_TOTAL,household:H_TOTAL,shared:SHARED,cGames:C_GAMES,aGames:A_GAMES,cPct:pct(C_TOTAL,C_BANK),aPct:pct(A_TOTAL,A_BANK),netWinMath:'cover = stake returned + 1x profit'};}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(apply,180));else setTimeout(apply,180);
  setTimeout(apply,900);
  document.addEventListener('click',e=>{if(e.target.closest('[data-view="today"],[data-view="portfolio"]'))setTimeout(apply,120);});
})();
</script>
