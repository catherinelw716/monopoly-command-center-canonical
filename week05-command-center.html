main{max-width:1260px;margin:auto;padding:22px 17px 90px}h1{font-size:26px;line-height:1.2;margin:0 0 8px}h2{font-size:18px;margin:0 0 10px}h3{font-size:14px;margin:0 0 6px}p{margin:8px 0}.eyebrow{font-size:10px;letter-spacing:.13em;color:var(--muted);font-weight:800;text-transform:uppercase}.muted,small{color:var(--muted)}.small{font-size:11px}.green{color:var(--green)}.red{color:var(--red)}.warn{color:var(--warn)}.blue{color:var(--blue)}.lead{color:var(--muted);max-width:1000px;margin:0 0 19px}.meta{color:var(--muted);font-size:11px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px;margin:0 0 13px}.panel.soft{background:#0e1e2f}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:16px 0 18px}.metric{padding:15px;background:var(--panel);border:1px solid var(--line);border-radius:12px}.metric strong{display:block;font-size:27px;line-height:1.15;margin:5px 0;font-variant-numeric:tabular-nums}.metric small{font-size:11px}.flex{display:flex;gap:12px;justify-content:space-between;align-items:flex-start}.gap{display:grid;gap:10px}.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:13px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.watch{border-left:3px solid var(--green)}.watch.neutral{border-color:var(--line)}.subline{border-top:1px solid var(--line);padding-top:9px;margin-top:10px;color:var(--muted);font-size:12px}.pill{display:inline-block;border:1px solid var(--line);padding:3px 8px;border-radius:30px;font-size:10px;font-weight:750;color:var(--muted)}.pill.good{border-color:#326d56;color:var(--green)}.pill.warning{border-color:#86612d;color:var(--warn)}.pill.bad{border-color:#6d3e4b;color:var(--red)}.table-scroll{overflow:auto;max-width:100%;border-radius:10px;border:1px solid var(--line)}table{border-collapse:collapse;width:100%;min-width:770px;font-size:12px}th{text-align:left;color:#afc3d3;background:#132c40;position:sticky;top:0;font-s <header><div class="brand"><small>NFL Monopoly · 2026 season</small>Command Center</div><div class="strap">Catherine-only strategy · Week 5 · official Sly lines stay frozen · Friday market snapshot</div></header>
<div class="nav-holder"><nav aria-label="Command Center pages" id="nav"></nav></div><main id="root"><div class="panel">Loading Week 5 canonical data…</div></main>
<script>
(function(){
"use strict";
var D=null,P={},view="today",selected=null,standingsSearch="",tabs=[["today","Today"],["games","Games"],["scorecard","Five Criteria"],["sources","4 Sources"],["analysis","Analysis"],["portfolio","Portfolio"],["standings","Standings"],["lab","Lab"],["history","Week 4 History"]];
try{P=JSON.parse(localStorage.getItem("monopoly-catherine-week05-draft")||"{}");if(!P||typeof P!=="object"||Array.isArray(P))P={};}catch(e){P={};}
function h(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function cash(x){return "$"+Number(x||0).toLocaleString("en-US",{maximumFractionDigits:0})}
function signed(n){return Number(n)>0?"+"+n:String(n)}
function percent(p){return (100*Number(p||0)).toFixed(1)+"%"}
function pickFor(g,team){return team+" "+signed(team===g.favorite?g.slyFavoriteSpread:-g.slyFavoriteSpread)}
function currentFor(g){return g.favorite+" "+signed(g.currentFavoriteSpread)}
function gap(g){return Number((g.slyFavoriteSpread-g.currentFavoriteSpread).toFixed(1))}
function score(g){return g.model ? g.model.preferredCoverPct:0}
function signal(g){return g.model&&g.model.preferenceStrength>=0.015?"MARKET-ANCHORED WATCH":"NO VERIFIED EDGE"}
function modelPick(g){return signal(g)==="MARKET-ANCHORED WATCH"?pickFor(g,g.model.preferred):"No actionable model edge"}
function chip(s,cls){return '<span class="pill '+(cls||"")+'">'+h(s)+'</span>'}
function nav(){document.getElementById("nav").innerHTML=tabs.map(function(t){return '<button data-view="'+t[0]+'" aria-current="'+(t[0]===view?'page':'false')+'">'+t[1]+'</button>'}).join("")}
function page(title,sub,body){return '<div class="eyebrow">Week 5 / '+h(view)+'</div><h1>'+title+'</h1><p class="lead">'+sub+'</p>'+body}
function metrics(){return '<div class="metrics"><div class="metric"><div class="eyebrow">Your bankroll</div><strong class="green">'+cash(D.player.bankroll)+'</strong><small>+$2,800 vs Week 1 start</small></div><div class="metric"><div class="eyebrow">Official rank</div><strong>#'+D.player.rank+'</strong><small>Up '+D.player.rankDelta+' in Week 4</small></div><div class="metric"><div class="eyebrow">Week 4 result</div><strong>4–2</strong><small>+$2,000 net</small></div><div class="metric"><div class="eyebrow">Active entries</div><strong>'+D.player.active+'</strong><small>'+cash(14000-D.player.bankroll)+' to tied 10th</small></div></div>'}

function slSim(g){var s=g.sportsline?.sim;return s?"SIM "+s.grade+" · "+s.display+" · "+s.type:"SportsLine not available"}
function slSourceLine(g,key){var x=g.sportsline?.[key];return x?x.display:"Not supplied"}
function slStatus(g){
 var x=g.sportsline?.sim;
 if(!x||x.type!=="ATS")return "NOT AN ATS VOTE";
 if(!x.exactSlyLine)return "DIRECTIONAL ONLY · DIFFERENT SPREAD";
 if(signal(g)!=="MARKET-ANCHORED WATCH")return "EXACT ATS · NO V2 WATCH";
 return x.side===g.model.preferred?"EXACT ATS · AGREES WITH V2 WATCH":"EXACT ATS · V2 WATCH CONFLICT";
}
function slCell(g){
 var x=g.sportsline;
 if(!x)return '<span class="muted">Not supplied</span>';
 return '<b>'+h(slSim(g))+'</b><div class="meta">'+h(slStatus(g))+'</div><div class="meta">SportsLine current '+h(slSourceLine(g,"currentSpread"))+'</div>';
}
function slDetails(g){
 var s=g.sportsline;
 if(!s)return '<div class="note">SportsLine snapshot not supplied.</div>';
 var x=s.sim;
 return '<div class="panel soft"><div class="flex"><div><h2>SportsLine · Week 5 screenshot</h2><div class="meta">Supplied October 9; screenshot capture clock time unavailable</div></div>'+chip(slStatus(g),x.type==="ATS"&&x.exactSlyLine?"good":"")+'</div>'+
 '<div class="metrics"><div class="metric"><div class="eyebrow">SIM selection</div><strong style="font-size:18px">'+h(x.display)+'</strong><small>Grade '+h(x.grade)+' · '+h(x.type)+'</small></div>'+
 '<div class="metric"><div class="eyebrow">Opening spread</div><strong style="font-size:18px">'+h(slSourceLine(g,"openSpread"))+'</strong><small>Opening O/U '+h(s.openTotal)+'</small></div>'+
 '<div class="metric"><div class="eyebrow">Current spread</div><strong style="font-size:18px">'+h(slSourceLine(g,"currentSpread"))+'</strong><small>Current O/U '+h(s.currentTotal)+'</small></div>'+
 '<div class="metric"><div class="eyebrow">Projected score</div><strong style="font-size:18px">'+h(g.away)+' '+h(s.projectedScore.away)+' – '+h(g.home)+' '+h(s.projectedScore.home)+'</strong><small>SportsLine projection</small></div></div>'+
 '<div class="small">'+s.sportslinePickCount+' SportsLine picks listed, but the other picks are not visible. SIM cover probability and dollar-handle percentage are unavailable. '+(x.type!=="ATS"?"Displayed SIM is a "+x.type.toLowerCase()+" play, not an ATS vote.":x.exactSlyLine?"ATS SIM matches Sly’s frozen spread.":"SIM is on "+h(x.display)+" versus contest "+h(x.slyReference)+"; same team direction, different spread.")+'</div></div>';
}
function statusNote(){return '<div class="note warnbox"><b>Decision integrity:</b> Frozen V2 challenger probabilities are model estimates, not validated Week 5 picks. SportsLine’s 14 screenshot matchups are imported: 5 ATS SIMs (4 exact Sly), 7 totals and 2 moneyline. GridironAI and Lucas remain unverified. No submission-ready portfolio is asserted. Sly lines never change with the market.</div>'}
function watchCards(rows){return '<div class="cards">'+rows.map(function(g){return '<article class="panel watch"><div class="eyebrow">'+h(g.id)+' · '+h(g.timeET)+'</div><h2>'+h(modelPick(g))+'</h2><div class="statline"><span>V2 '+score(g)+'% cover</span><span>Market '+h(currentFor(g))+'</span><span>Sly '+h(pickFor(g,g.favorite))+'</span></div><div>'+chip("CHALLENGER WATCH","warning")+'</div><div class="subline">SportsLine: '+h(slSim(g))+' · Model edge reflects contest spread vs current market, not an independent football forecast.</div><button class="link" data-game="'+h(g.id)+'">Open game analysis →</button></article>'}).join("")+'</div>'}
function sorted(){return D.games.slice().sort(function(a,b){return (b.model?.preferenceStrength||0)-(a.model?.preferenceStrength||0)})}
function today(){var watches=sorted().filter(function(g){return signal(g)==="MARKET-ANCHORED WATCH"});return page("Week 5 — Friday decision briefing","Your official results and standings are reconciled. The Saturday/Sunday/ Monday slate is assessed against Sly's exact contest spreads, not sportsbook lines.",metrics()+'<div class="cols"><div><div class="flex"><h2>Model/price watchlist</h2>'+chip(watches.length+" directional watches","good")+'</div>'+ (watches.length?watchCards(watches):'<div class="panel">No current priced edges meet the watch threshold.</div>')+'<div class="panel"><h2>Week 5 Thursday is closed</h2><div class="statline"><strong>TB 24 – DAL 16</strong> '+chip("BUCCANEERS COVER · FINAL","good")+'</div><p class="small">Sly’s Week 5 sheet gives the final result, but not the locked Thursday spread. Thursday is not eligible for a new wager.</p></div><div><div class="panel"><h2>SportsLine snapshot</h2><p>14 games · 5 ATS SIMs (4 exact Sly), 7 totals and 2 moneylines. Grade A spread plays: Vikings −2.5, Colts +2.5 and Seahawks −3.</p><p class="small">SportsLine projected scores, opener/current spreads, SIM grades and pick counts appear in Games and 4 Sources. Unseen additional picks are not counted as ATS votes.</p></div><div class="panel"><h2>Competitive position</h2><div class="statline"><span>1st '+cash(D.standings.rows[0].bankroll)+'</span><span>5th '+cash(D.standings.rows[4].bankroll)+'</span><span>10th '+cash(14000)+'</span></div><p>You are 17th of 111, '+cash(D.standings.rows[0].bankroll-D.player.bankroll)+' behind first. Avoid treating the leader’s early outlier as an exposure target.</p></div><div class="panel"><h2>Model contract</h2><p>Frozen <b>'+h(D.modelVersion)+'</b>. Current market is only the probability anchor. Week 4 results update the bankroll and audit, not the model’s coefficients.</p><p class="meta">Friday market: '+h(D.capturedAtET)+'</p></div><div class="panel"><h2>Before submitting</h2><p>Four separate eligible games and at least $100 per game are required. Use the Portfolio page to stress-test a Catherine-only draft, then confirm injuries, weather, and source signals closer to kickoff.</p></div></div></div>'+statusNote())}
function games(){
 var rows=D.games.map(function(g,i){
  return '<tr><td class="num">'+(i+1)+'</td>'+
  '<td><button class="link" data-game="'+h(g.id)+'">'+h(g.id)+'</button><div class="meta">'+h(g.timeET)+'</div></td>'+
  '<td>'+h(pickFor(g,g.favorite))+'</td><td>'+h(currentFor(g))+'</td>'+
  '<td class="num '+(gap(g)>0?"green":gap(g)<0?"red":"")+'">'+h(signed(Number((g.currentFavoriteSpread-g.slyFavoriteSpread).toFixed(1))))+'</td>'+
  '<td>'+h(modelPick(g))+'</td><td class="num">'+score(g)+'%</td>'+
  '<td>'+slCell(g)+'</td>'+
  '<td>'+chip(signal(g)==="MARKET-ANCHORED WATCH"?"V2 price watch":"No V2 watch",signal(g)==="MARKET-ANCHORED WATCH"?"warning":"")+'</td></tr>';
 }).join("");
 return page("Games & exact contest spreads",
 "All 14 upcoming games. DIFF is the original Friday consensus current price minus Sly for the shown favorite. SportsLine has a separate open/current snapshot; it never overwrites frozen Sly or the market-anchored V2 input.",
 '<div class="panel"><div class="table-scroll"><table><thead><tr><th class="num">#</th><th>Matchup</th><th>Sly · locked</th><th>Market · Oct 9</th><th class="num">DIFF</th><th>V2 challenger</th><th class="num">Cover P</th><th>SportsLine SIM / current</th><th>Readiness</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+statusNote());
}
function scorecard(){var trs=D.games.map(function(g){var op=slSourceLine(g,"openSpread"),mov="SportsLine "+op+" → "+slSourceLine(g,"currentSpread");return '<tr><td><button data-game="'+h(g.id)+'" class="link">'+h(g.id)+'</button></td><td>'+h(pickFor(g,g.favorite))+'</td><td>'+h(mov)+'</td><td>'+chip("Unavailable")+'</td><td>'+chip("Unavailable")+'</td><td>'+chip("Unavailable")+'</td><td>'+chip(Math.abs(g.slyFavoriteSpread)%1===0?"Key: "+Math.abs(g.slyFavoriteSpread):"No exact 3/7/10")+'</td><td>'+chip("Not graded","warning")+'</td></tr>'}).join("");return page("Five-Criteria Spread Scorecard","The dedicated diagnostic page is preserved with five independent factors. SportsLine now supplies same-source opening and current spreads for all 14 games; authoritative composite grades still require ATS trends, handle percentages and comparable defensive EPA.",'<div class="panel"><h2>Five dimensions · maximum 20 each</h2><div class="factor-list"><div><b>1. Line Movement</b><span>SportsLine opener → current; independent of frozen Sly. No raw-factor score asserted.</span></div><div><b>2. ATS Trends</b><span>H2H 40% · season 35% · last 10 25%.</span></div><div><b>3. Money / Handle</b><span>Dollar handle only; never ticket percentages.</span></div><div><b>4. Defensive EPA</b><span>Same-season, same-methodology rankings required.</span></div><div><b>5. Key Numbers</b><span>Exact Sly margins 3, 7, 10, 14.</span></div></div></div><div class="panel"><div class="table-scroll"><table><thead><tr><th>Game</th><th>Frozen Sly</th><th>Line movement</th><th>ATS</th><th>Handle</th><th>Defense EPA</th><th>Key numbers</th><th>5F score</th></tr></thead><tbody>'+trs+'</tbody></table></div></div><div class="note">Five-factor grades are heuristic, not probabilities, and are not the V2 model. Missing factor evidence must not be treated as five neutral verified observations. Week 4’s scorecard remains an archival artifact in the repository.</div>')}
function sources(){
 var rows=D.games.map(function(g){
  var sl=g.sportsline;
  return '<tr><td><button class="link" data-game="'+h(g.id)+'">'+h(g.id)+'</button></td>'+
  '<td>'+h(modelPick(g))+'<div class="meta">V2 estimated cover '+score(g)+'% · exact Sly target</div></td>'+
  '<td>'+slCell(g)+'<div class="meta">Projected '+h(g.away)+' '+h(sl.projectedScore.away)+' : '+h(g.home)+' '+h(sl.projectedScore.home)+'</div></td>'+
  '<td class="muted">No Week 5 native spread / cover % supplied</td>'+
  '<td class="muted">No Week 5 selection supplied</td>'+
  '<td>'+chip(slStatus(g),sl.sim.type==="ATS"&&sl.sim.exactSlyLine?"good":"")+'</td></tr>';
 }).join("");
 return page("Four-source comparison",
 "SportsLine SIM grades and spreads come directly from your Week 5 screenshots; the projected score is preserved but is not treated as a separate spread pick. Moneyline/total SIMs are not ATS votes, and differing spreads are directional only.",
 '<div class="panel"><div class="statline"><span>SportsLine: 14 games</span><span>ATS SIMs: 5 (4 exact Sly)</span><span>Totals: 7</span><span>Moneylines: 2</span><span>Gridiron/Lucas: unavailable</span></div>'+
 '<div class="table-scroll"><table><thead><tr><th>Game</th><th>Our V2 challenger</th><th>SportsLine · grade, type, price</th><th>GridironAI</th><th>Lucas</th><th>Cross-source read</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+statusNote());
}

function analysis(){
 var ranking=sorted();var watches=ranking.filter(function(g){return signal(g)==="MARKET-ANCHORED WATCH"});var others=ranking.filter(function(g){return signal(g)!=="MARKET-ANCHORED WATCH"});
 var list=function(arr){return arr.map(function(g){return '<div class="panel"><div class="flex"><div><div class="eyebrow">'+h(g.id)+' · '+h(g.timeET)+'</div><h3>'+h(modelPick(g))+'</h3><div class="statline"><span>Sly '+h(pickFor(g,g.favorite))+'</span><span>Market '+h(currentFor(g))+'</span><span>Estimated cover '+score(g)+'%</span><span>SportsLine '+h(slSim(g))+'</span></div></div><button class="link" data-game="'+h(g.id)+'">Deep dive →</button></div><div class="subline">Model gap: '+h(g.model.home_line_advantage)+' points (home-spread units). '+h(g.injuryContext||"Final injury context not independently verified.")+'</div></div>'}).join("")};
 return page("Analysis — Week 5 evidence review","This page separates model price signals from unresolved third-party and matchup evidence. A directional watch is not a submission recommendation.",'<div class="panel"><h2>Decision framework</h2><div class="factor-list"><div><b>1. Probability</b><span>Frozen V2 exact Sly-line model only.</span></div><div><b>2. Contest price</b><span>Sly versus Oct 9 market. DIFF = current − Sly.</span></div><div><b>3. Other sources</b><span>SportsLine screenshot supplied; Gridiron and Lucas are unverified.</span></div><div><b>4. Context</b><span>Injuries and weather remain independent context checks.</span></div><div><b>5. Wager sizing</b><span>Only a solo what-if draft; not approved by V2 optimizer.</span></div></div></div><h2>Potential price advantages · '+watches.length+' games</h2>'+list(watches)+'<h2>Other matchups · '+others.length+' games</h2>'+list(others)+'<div class="note warnbox">Adversarial check: Do not infer that market moves cause wins. Opposing price books, last-minute personnel changes, sample uncertainty, and lack of independent exact-line cover projections can reverse any watchlist ranking. No final stakes are approved.</div>');
}
function lab(){
 var rows=[["Sly Friday freeze","Official user-provided October 9 sheet","Verified immutable target","v2/season_2026/week_05_sly_freeze.json"],["Week 4 standings","Official commissioner PDF, all 111 active","Verified","week05-standings.json"],["Week 4 actual wagers","October 4 email submission, settled +1x / −1x","Reconciled +$2,000","week05-canonical-data.json"],["Market lines",D.capturedAtET+" consensus snapshot","Time-stamped; not live odds","week05-canonical-data.json"],["V2 challenger",D.modelVersion+" · historical training through 2025","Challenger only; not production champion","week05-model.js"],["SportsLine","User screenshots · 14 games; five ATS SIMs (four exact), seven totals, two moneyline","Captured · cover% and dollar handle unavailable","week05-sportsline-user-screenshot-2026-10-09.json"],["GridironAI","Exact Week 5 spread and cover probabilities","Not independently verified","—"],["Lucas","Week 5 selection with timestamp","Not provided","—"],["Weather","Venue weather check; game-time forecast","Not verified","—"],["Five factors","Full ATS, money handle, Defensive EPA and opener history","Partial inputs only, not graded","five-factor-scorecard-page.html"]];
 return page("Lab — provenance and QA","Underlying inputs, dates, model identity, and missing evidence used across every Week 5 view.",'<div class="metrics"><div class="metric"><div class="eyebrow">Week</div><strong>5</strong><small>Friday freeze</small></div><div class="metric"><div class="eyebrow">Eligible games</div><strong>'+D.games.length+'</strong><small>Thursday already completed</small></div><div class="metric"><div class="eyebrow">Official standings</div><strong>'+D.standings.rows.length+'</strong><small>Active entries</small></div><div class="metric"><div class="eyebrow">Strategy scope</div><strong>SOLO</strong><small>Catherine only</small></div></div><div class="panel"><h2>Data provenance</h2><div class="table-scroll"><table><thead><tr><th>Input</th><th>Reference</th><th>Confidence / status</th><th>Canonical repository path</th></tr></thead><tbody>'+rows.map(function(x){return '<tr><td><b>'+h(x[0])+'</b></td><td>'+h(x[1])+'</td><td>'+h(x[2])+'</td><td class="meta">'+h(x[3])+'</td></tr>'}).join("")+'</tbody></table></div></div><div class="panel"><h2>Frozen model</h2><div class="small">Model: '+h(D.modelVersion)+'</div><div class="small">Artifact hash: '+h(D.sourceHash||"See canonical artifact")+'</div><div class="small">Latest snapshot: '+h(D.capturedAtET)+'</div><div class="divider"></div><h3>Operational safeguards</h3><p class="small">Historical Week 3 and 4 source votes are excluded from this slate. SportsLine SIMs are interpreted only in their stated market type, grade, and spread; cover percentages and handle remain unknown. Different sportsbook spreads are preserved separately. Results update competitive position, not the historical model coefficients.</p></div><div class="note">Render deployment confirms server startup, not full in-browser visual QA. Recheck final injury reports and market prices before entry submission.</div>');
}

function choice(g){var v=P[g.id];return v&&v.amount>=100?v:null}
function selectedRows(){return D.games.filter(choice)}
function preview(){var chosen=selectedRows(),outlay=0,ev=0,evStress=0;chosen.forEach(function(g){var a=Number(P[g.id].amount);outlay+=a;var p=g.model.hybrid, side=P[g.id].side;var net=side===g.home?p.p_home_cover-p.p_home_loss:p.p_away_cover-p.p_away_loss;ev+=a*net;evStress+=a*net*.25});var ok=chosen.length>=4&&outlay<=D.player.bankroll;return '<div class="metrics"><div class="metric"><div class="eyebrow">Draft games</div><strong>'+chosen.length+'</strong><small>minimum 4</small></div><div class="metric"><div class="eyebrow">Total draft outlay</div><strong>'+cash(outlay)+'</strong><small>'+Math.round(outlay/D.player.bankroll*100)+'% of bankroll</small></div><div class="metric"><div class="eyebrow">Worst 0-for-all net</div><strong class="red">-'+cash(outlay)+'</strong><small>Bankroll floor '+cash(D.player.bankroll-outlay)+'</small></div><div class="metric"><div class="eyebrow">Model expected net</div><strong class="green">'+cash(Math.round(ev))+'</strong><small>25% edge-stress '+cash(Math.round(evStress))+'</small></div></div><div class="note '+(ok?"":"warnbox")+'">'+(ok?"Draft passes the minimum game count and bankroll checks; independent evidence is still missing.":"Draft not submission-ready: select four eligible games at $100+ each, keep outlay within the available bankroll.")+' This is a personal what-if calculator, not actual submitted wagers or a validated solo tournament optimizer.</div>'}
function portfolio(){return page("Catherine — solo portfolio planner","This planner covers your entry only. Select eligible games and edit $100-increment stakes to inspect expected value and downside against the frozen V2 baseline.",'<div id="preview">'+preview()+'</div><div class="panel"><h2>Draft wagers <span class="meta">Local to this browser; never transmitted to Sly</span></h2><div class="gap">'+sorted().map(function(g){var v=P[g.id]||{side:g.model.preferred,amount:0},checked=!!choice(g);return '<div class="plannerRow"><div><label><input type="checkbox" data-pick="'+h(g.id)+'" '+(checked?'checked':'')+'/> <b>'+h(g.id)+'</b></label><div class="meta">'+h(g.timeET)+'</div></div><div><select class="input" data-side="'+h(g.id)+'"><option value="'+h(g.model.preferred)+'">'+h(pickFor(g,g.model.preferred))+'</option><option value="'+h(g.model.preferred===g.home?g.away:g.home)+'" '+(v.side!==g.model.preferred?'selected':'')+'>'+h(pickFor(g,g.model.preferred===g.home?g.away:g.home))+'</option></select></div><div class="meta">V2 '+score(g)+'%</div><div style="text-align:right"><input class="input" type="number" min="0" step="100" data-amount="'+h(g.id)+'" value="'+(v.amount||0)+'" aria-label="Amount for '+h(g.id)+'"/></div></div>'}).join("")+'</div></div><div class="panel"><button class="btn" data-clear="true">Clear draft</button><div class="subline">The full Monopoly tournament optimizer remains a separate research model. This planner does not claim to maximize prize equity, and no final staking recommendation has passed the source/model red team yet.</div></div>')}
function standings(){var search=standingsSearch.toLowerCase(),rows=D.standings.rows.filter(function(x){return x.name.toLowerCase().includes(search)});return page("Official standings — after Week 4","All 111 active entries imported from the commissioner PDF, not estimated from a partial leaderboard. Your entry is highlighted.",'<div class="panel"><div class="flex"><div><b>'+D.standings.rows.length+' active players</b><p class="meta">Rank is commissioner-assigned, with official ties preserved.</p></div><div><input id="searchStandings" class="input" placeholder="Filter player name" value="'+h(standingsSearch)+'"/></div></div><div class="table-scroll"><table><thead><tr><th class="num">Rank</th><th>Entry</th><th class="num">Bankroll</th><th class="num">Rank change</th></tr></thead><tbody>'+rows.map(function(x){return '<tr class="'+(x.name==="Catherine Williams"?"me":"")+'"><td class="num">'+x.rank+'</td><td>'+h(x.name)+'</td><td class="num">'+cash(x.bankroll)+'</td><td class="num">'+(x.movement==null?"—":x.movement>0?'<span class="green">▲ '+x.movement+'</span>':'<span class="red">▼ '+(-x.movement)+'</span>')+'</td></tr>'}).join("")+'</tbody></table></div></div>')}
function week4History(){var w=D.week4;return page("Week 4 — actual Catherine wagers","Exactly as sent to Sly on October 4, reconciled against the official Week 4 scoreboard and balance. Only Catherine’s submission is included in the analysis.",metrics()+'<div class="panel"><div class="table-scroll"><table><thead><tr><th>Actual selection</th><th class="num">Wager</th><th>Outcome</th><th class="num">Net gain / loss</th></tr></thead><tbody>'+w.bets.map(function(x){return '<tr><td>'+h(x.team+" "+signed(x.line))+'</td><td class="num">'+cash(x.wager)+'</td><td class="'+(x.result==="WIN"?"green":"red")+'">'+x.result+'</td><td class="num '+(x.net>0?"green":"red")+'">'+(x.net>0?"+":"−")+cash(Math.abs(x.net))+'</td></tr>'}).join("")+'<tr><td><b>Total</b></td><td class="num"><b>'+cash(w.outlay)+'</b></td><td><b>4–2</b></td><td class="num green"><b>+'+cash(w.net)+'</b></td></tr></tbody></table></div><div class="bottom-rule">Starting '+cash(w.startingBankroll)+' + net '+cash(w.net)+' = <b>'+cash(w.endingBankroll)+'</b> official Week 4 close.</div></div><div class="note">The Colts $2,000 position contributed $2,000 in net profit, but a single large winner is not evidence that stake sizes should automatically increase. Four straight weeks provide useful process feedback, not enough evidence to refit model coefficients.</div>')}
function detail(g){var pc=g.model,home=pc.hybrid.p_home_cover,away=pc.hybrid.p_away_cover;return '<div class="panel" style="border-color:#3e6980"><div class="flex"><div><div class="eyebrow">Game deep dive</div><h1>'+h(g.id)+'</h1><p class="meta">'+h(g.timeET)+' ET · '+h(g.city)+'</p></div><button class="btn" data-close="true">Back to '+h(view)+'</button></div><div class="metrics"><div class="metric"><div class="eyebrow">Sly · immutable</div><strong>'+h(pickFor(g,g.favorite))+'</strong></div><div class="metric"><div class="eyebrow">Market · Friday</div><strong>'+h(currentFor(g))+'</strong></div><div class="metric"><div class="eyebrow">DIFF current − Sly</div><strong>'+signed(Number((g.currentFavoriteSpread-g.slyFavoriteSpread).toFixed(1)))+'</strong></div><div class="metric"><div class="eyebrow">V2 challenger</div><strong>'+score(g)+'%</strong><small>'+h(modelPick(g))+'</small></div></div>'+slDetails(g)+'<h2>Four-source read</h2><div class="source4"><div><small>Our V2</small><b>'+h(modelPick(g))+'</b><span class="meta">'+percent(pc.hybrid.p_push)+' push probability</span></div><div><small>SportsLine</small><b>'+h(slSim(g))+'</b><span class="meta">'+h(slStatus(g))+'</span></div><div><small>GridironAI</small><b>Not verified</b><span class="meta">Cover % and native line needed</span></div><div><small>Lucas</small><b>Not supplied</b><span class="meta">No implied vote</span></div></div><div class="grid2" style="margin-top:12px"><div class="panel soft"><h3>Model interpretation</h3><p>Home cover '+percent(home)+' · away cover '+percent(away)+' · push '+percent(pc.hybrid.p_push)+'. Model margin comes from price difference at exact Sly spread. It does not estimate a separate injury-driven advantage.</p><p class="meta">Model: '+h(pc.model_version)+'</p></div><div class="panel soft"><h3>Verified context and weather</h3><p>'+h(g.injuryContext||"No game-specific final injury report has been verified into this snapshot; check the linked official NFL injury list.")+'</p>'+(g.injurySource?'<a href="'+h(g.injurySource)+'" rel="noopener" target="_blank">Context source ↗</a>':'')+'<p class="small">'+h(g.weather)+' Game-time forecast: not verified yet.</p></div></div><div class="panel soft"><h3>Five-factor status</h3><p>Line movement: '+h(g.openFavorite?g.openFavorite+" "+signed(g.openFavoriteSpread)+" → "+currentFor(g):"opening line unavailable")+'. ATS trends: unverified. Money handle: unverified. Defensive EPA ranks: unverified. Key numbers: '+h(String(Math.abs(g.slyFavoriteSpread)))+'. <b>No authoritative 5F score.</b></p></div><div class="note warnbox">Red-team challenge: The strongest possible explanation may simply be that the market moved on injuries or public information already priced in. Do not count the 4-source signals as agreement without all four sources at verified comparable reference lines and timestamps.</div></div>'}
function footer(){return '<div class="footer">Data: official Sly Week 5 sheet · official commissioner Week 4 standings · Friday October 9 VegasInsider consensus snapshot · frozen V2-0006C challenger. SportsLine screenshots imported · no invented GridironAI or Lucas picks · Catherine-only. <a href="'+h(D.sourceLinks.market)+'" target="_blank" rel="noopener">Market source ↗</a> · <a href="'+h(D.sourceLinks.injuries)+'" target="_blank" rel="noopener">Official injuries ↗</a></div>'}
function render(){nav();var section=view==="today"?today():view==="games"?games():view==="scorecard"?scorecard():view==="sources"?sources():view==="analysis"?analysis():view==="portfolio"?portfolio():view==="standings"?standings():view==="lab"?lab():week4History();if(selected){var g=D.games.find(function(x){return x.id===selected});if(g)section=detail(g)+section}document.getElementById("root").innerHTML=section+footer();if(view==="standings"){var el=document.getElementById("searchStandings");if(el){el.setSelectionRange(el.value.length,el.value.length)}}}
function syncUrl(){var q="?view="+encodeURIComponent(view)+(selected?"&game="+encodeURIComponent(selected):"");history.replaceState(null,"",q)}
function choose(v){view=v;selected=null;syncUrl();render();window.scrollTo(0,0)}
function persist(){try{localStorage.setItem("monopoly-catherine-week05-draft",JSON.stringify(P))}catch(e){}}
document.addEventListener("click",function(e){var t=e.target.closest("[data-view],[data-game],[data-close],[data-clear]");if(!t)return;if(t.dataset.view){choose(t.dataset.view);return}if(t.dataset.game){selected=t.dataset.game;syncUrl();render();window.scrollTo(0,0);return}if(t.dataset.close){selected=null;syncUrl();render();return}if(t.dataset.clear){P={};persist();render();return}});
document.addEventListener("change",function(e){var el=e.target,id=el.dataset.pick||el.dataset.side||el.dataset.amount;if(!id||!D)return;var g=D.games.find(function(x){return x.id===id});if(!g)return;var p=P[id]||{side:g.model.preferred,amount:0};if(el.dataset.pick){p.amount=el.checked?Math.max(100,p.amount):0}else if(el.dataset.side){p.side=el.value}else if(el.dataset.amount){p.amount=Math.max(0,Math.round(Number(el.value||0)/100)*100)}P[id]=p;persist();render()});
document.addEventListener("input",function(e){if(e.target.id==="searchStandings"){standingsSearch=e.target.value;render();var x=document.getElementById("searchStandings");if(x){x.focus();x.setSelectionRange(standingsSearch.length,standingsSearch.length)}}});
function init(){fetch("/api/week5",{cache:"no-store"}).then(function(r){if(!r.ok)throw Error("Status "+r.status);return r.json()}).then(function(data){D=data;var p=new URLSearchParams(location.search);view=tabs.some(function(x){return x[0]===p.get("view")})?p.get("view"):"today";selected=p.get("game");render()}).catch(function(err){document.getElementById("root").innerHTML='<div class="panel"><h2>Week 5 data did not load</h2><p>'+h(err.message)+'</p></div>'})}
window.addEventListener("popstate",function(){var q=new URLSearchParams(location.search);view=q.get("view")||"today";selected=q.get("game");render()});
init();
})();
</script></body></html>
